pt>\n\"use strict\";\n\n// <<EXTRAS>>\nconst EXTRAS_JSON = \"{\\\"app\\\":{\\\"description\\\":\\\"\\\",\\\"icon\\\":\\\"📑\\\",\\\"icon_background\\\":\\\"#FFEAD5\\\",\\\"mode\\\":\\\"workflow\\\",\\\"name\\\":\\\"契約書 勘定科目区分分類\\\",\\\"use_icon_as_answer_icon\\\":false},\\\"features\\\":{\\\"file_upload\\\":{\\\"allowed_file_extensions\\\":[\\\".PDF\\\",\\\".DOC\\\",\\\".DOCX\\\",\\\".TXT\\\",\\\".MD\\\"],\\\"allowed_file_types\\\":[\\\"document\\\"],\\\"allowed_file_upload_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"],\\\"enabled\\\":true,\\\"fileUploadConfig\\\":{\\\"audio_file_size_limit\\\":50,\\\"batch_count_limit\\\":5,\\\"file_size_limit\\\":15,\\\"image_file_size_limit\\\":10,\\\"video_file_size_limit\\\":100,\\\"workflow_file_upload_limit\\\":10},\\\"image\\\":{\\\"enabled\\\":false,\\\"number_limits\\\":3,\\\"transfer_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"]},\\\"number_limits\\\":3},\\\"opening_statement\\\":\\\"\\\",\\\"retriever_resource\\\":{\\\"enabled\\\":true},\\\"sensitive_word_avoidance\\\":{\\\"enabled\\\":false},\\\"speech_to_text\\\":{\\\"enabled\\\":false},\\\"suggested_questions\\\":[],\\\"suggested_questions_after_answer\\\":{\\\"enabled\\\":false},\\\"text_to_speech\\\":{\\\"enabled\\\":false,\\\"language\\\":\\\"\\\",\\\"voice\\\":\\\"\\\"}},\\\"conversation_variables\\\":[],\\\"scaffold_nodes\\\":[{\\\"data\\\":{\\\"desc\\\":\\\"契約書ファイルをアップロードします。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"開始\\\",\\\"type\\\":\\\"start\\\",\\\"variables\\\":[{\\\"allowed_file_extensions\\\":[],\\\"allowed_file_types\\\":[\\\"document\\\"],\\\"allowed_file_upload_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"],\\\"label\\\":\\\"契約書ファイル\\\",\\\"max_length\\\":48,\\\"options\\\":[],\\\"required\\\":true,\\\"type\\\":\\\"file\\\",\\\"variable\\\":\\\"contract_file\\\"},{\\\"label\\\":\\\"補足情報(更問いへの回答)\\\",\\\"max_length\\\":2000,\\\"options\\\":[],\\\"required\\\":false,\\\"type\\\":\\\"paragraph\\\",\\\"variable\\\":\\\"additional_info\\\"}]},\\\"height\\\":116,\\\"id\\\":\\\"start\\\",\\\"position\\\":{\\\"x\\\":80,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":80,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"契約書ファイルからテキストを抽出します。\\\",\\\"is_array_file\\\":false,\\\"selected\\\":false,\\\"title\\\":\\\"テキスト抽出\\\",\\\"type\\\":\\\"document-extractor\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"contract_file\\\"]},\\\"height\\\":116,\\\"id\\\":\\\"doc-extractor\\\",\\\"position\\\":{\\\"x\\\":384,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":384,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"context\\\":{\\\"enabled\\\":false,\\\"variable_selector\\\":[]},\\\"desc\\\":\\\"契約書の読み取り内容(契約名・当事者・主目的・主要条件)を認識確認用に出力します。補足情報の訂正を反映します。\\\",\\\"model\\\":{\\\"completion_params\\\":{\\\"temperature\\\":0.1},\\\"mode\\\":\\\"chat\\\",\\\"name\\\":\\\"gpt-4o\\\",\\\"provider\\\":\\\"openai\\\"},\\\"prompt_template\\\":[{\\\"id\\\":\\\"system-prompt-summary\\\",\\\"role\\\":\\\"system\\\",\\\"text\\\":\\\"あなたは日本の企業会計に精通した経理・会計の専門家です。\\\\n与えられた契約書の本文から、勘定科目分類の前提となる要点を読み取り、次の形式で出力してください。\\\\nこの出力は「契約書の読み取りに認識間違いがないか」をユーザーが確認するために提示されます。\\\\n\\\\n【出力形式】(この形式のみを出力する。前置き・後書きは付けない)\\\\n契約名: <契約書の題名>\\\\n当事者: <当事者名と、読み取れる場合は自社の立場(貸主/借主、受託者/委託者、買主/売主 など)。読み取れない場合は「不明」と書く>\\\\n契約の主目的: <1行で>\\\\n主要条件: <期間・金額・支払条件など分類に影響する重要な条件を2〜3点、「 / 」区切りで>\\\\n特記事項: <分類に影響しそうな点があれば1行、なければ「なし」>\\\\n※ この認識に誤りがある場合は、「補足情報」欄で訂正して再実行してください。\\\\n\\\\n【ルール】\\\\n- 契約書に書かれていることだけを書き、推測で断定しない。読み取れない項目は「不明」とする。\\\\n- <補足情報>に訂正や回答が入っている場合は、その内容を事実として反映し、該当箇所に「(補足情報より)」と付記する。\\\\n- 最終行の「※ …」の注意書きは毎回そのまま出力する。\\\"},{\\\"id\\\":\\\"user-prompt-summary\\\",\\\"role\\\":\\\"user\\\",\\\"text\\\":\\\"以下は契約書の本文です。読み取り内容の要点を出力してください。\\\\n\\\\n<契約書本文>\\\\n{{#doc-extractor.text#}}\\\\n<\/契約書本文>\\\\n\\\\n<補足情報>\\\\n{{#start.additional_info#}}\\\\n<\/補足情報>\\\\n(補足情報は、過去の質問への回答や認識の訂正です。空の場合もあります。)\\\"}],\\\"selected\\\":false,\\\"title\\\":\\\"契約内容サマリー\\\",\\\"type\\\":\\\"llm\\\",\\\"variables\\\":[],\\\"vision\\\":{\\\"enabled\\\":false}},\\\"height\\\":116,\\\"id\\\":\\\"llm-summary\\\",\\\"position\\\":{\\\"x\\\":688,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":688,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"cases\\\":[{\\\"case_id\\\":\\\"case-unconfirmed\\\",\\\"conditions\\\":[{\\\"comparison_operator\\\":\\\"empty\\\",\\\"id\\\":\\\"cond-unconfirmed\\\",\\\"value\\\":\\\"\\\",\\\"varType\\\":\\\"string\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"additional_info\\\"]}],\\\"id\\\":\\\"case-unconfirmed\\\",\\\"logical_operator\\\":\\\"and\\\"}],\\\"desc\\\":\\\"補足情報が空(=認識結果が未確認)の場合は分類に進まず、確認要求を出力します。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"条件分岐(認識確認)\\\",\\\"type\\\":\\\"if-else\\\"},\\\"height\\\":126,\\\"id\\\":\\\"if-else-confirm\\\",\\\"position\\\":{\\\"x\\\":1296,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":1296,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"認識結果の確認を求めるメッセージを出力します(初回実行時)。\\\",\\\"selected\\\":false,\\\"template\\\":\\\"質問: 契約内容の認識結果(contract_summary)は合っていますか?内容を確認して、補足情報欄に回答を入力し、再実行してください。\\\\n回答例: 正しいです / 当社は借主です(誤りがある場合は、このように訂正内容を記入)\\\",\\\"title\\\":\\\"確認要求\\\",\\\"type\\\":\\\"template-transform\\\",\\\"variables\\\":[]},\\\"height\\\":116,\\\"id\\\":\\\"template-confirm\\\",\\\"position\\\":{\\\"x\\\":1296,\\\"y\\\":990},\\\"positionAbsolute\\\":{\\\"x\\\":1296,\\\"y\\\":990},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"実行された分岐の判定結果を1つに集約します。\\\",\\\"output_type\\\":\\\"string\\\",\\\"selected\\\":false,\\\"title\\\":\\\"変数集約\\\",\\\"type\\\":\\\"variable-aggregator\\\",\\\"variables\\\":[]},\\\"height\\\":150,\\\"id\\\":\\\"aggregator\\\",\\\"position\\\":{\\\"x\\\":3424,\\\"y\\\":860},\\\"positionAbsolute\\\":{\\\"x\\\":3424,\\\"y\\\":860},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"cases\\\":[{\\\"case_id\\\":\\\"case-question\\\",\\\"conditions\\\":[{\\\"comparison_operator\\\":\\\"start with\\\",\\\"id\\\":\\\"cond-question\\\",\\\"value\\\":\\\"質問\\\",\\\"varType\\\":\\\"string\\\",\\\"variable_selector\\\":[\\\"aggregator\\\",\\\"output\\\"]}],\\\"id\\\":\\\"case-question\\\",\\\"logical_operator\\\":\\\"and\\\"}],\\\"desc\\\":\\\"更問い(質問)の場合は仕訳を作らず、質問をそのまま出力へ流します。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"条件分岐(更問いチェック)\\\",\\\"type\\\":\\\"if-else\\\"},\\\"height\\\":126,\\\"id\\\":\\\"if-else-q\\\",\\\"position\\\":{\\\"x\\\":3728,\\\"y\\\":860},\\\"positionAbsolute\\\":{\\\"x\\\":3728,\\\"y\\\":860},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"context\\\":{\\\"enabled\\\":false,\\\"variable_selector\\\":[]},\\\"desc\\\":\\\"判定済みの主科目から、金額なしの仕訳(借方/貸方)と確信度・誤分類時の影響度を生成します。\\\",\\\"model\\\":{\\\"completion_params\\\":{\\\"temperature\\\":0.1},\\\"mode\\\":\\\"chat\\\",\\\"name\\\":\\\"gpt-4o\\\",\\\"provider\\\":\\\"openai\\\"},\\\"prompt_template\\\":[{\\\"id\\\":\\\"system-prompt-journal\\\",\\\"role\\\":\\\"system\\\",\\\"text\\\":\\\"あなたは日本の企業会計に精通した経理・会計の専門家です。\\\\n前段までの判定で、この契約書の主たる勘定科目(主科目)は「{{#aggregator.output#}}」と判定されています。\\\\n契約書の本文を読み、この契約の典型的な取引について仕訳を1本、金額なしで出力してください。\\\\n\\\\n【仕訳の作り方】\\\\n- 主科目を、会計原則に従って借方・貸方の正しい側に置く(資産の増加・費用の発生=借方、負債・純資産・収益の発生=貸方)。\\\\n- 相手科目は契約内容から最も典型的なものを1つ選ぶ。可能な限り本ワークフローの分 (let i = 0; i < s.length; i++) if(s.charCodeAt(i) < 0x20) return false;\n  return true;\n}\n\nfunction dq(s){\n  let out = '\"';\n  for(const c of s){\n    if(c === \"\\\\\") out += \"\\\\\\\\\";\n    else if(c === '\"') out += '\\\\\"';\n    else if(c === \"\\n\") out += \"\\\\n\";\n    else if(c === \"\\t\") out += \"\\\\t\";\n    else if(c === \"\\r\") out += \"\\\\r\";\n    else if(c.charCodeAt(0) < 0x20) out += \"\\\\x\" + (\"0\" + c.charCodeAt(0).toString(16)).slice(-2);\n    else out += c;\n  }\n  return out + '\"';\n}\n\nfunction scalarInline(v){\n  if(v === null || v === undefined) return \"null\";\n  if(v === true) return \"true\";\n  if(v === false) return \"false\";\n  if(typeof v === \"number\") return String(v);\n  if(typeof v === \"string\") return plainOk(v) ? v : dq(v);\n  throw Err(\"YAMLに書き出せない値があります: \" + String(v));\n}\n\nfunction literalOk(s){\n  if(s.indexOf(\"\\n\") < 0 || s.slice(-1) === \"\\n\" || s[0] === \" \" || s[0] === \"\\n\"\n     || s[0] === \"\\t\" || s.indexOf(\"\\r\") >= 0) return false;\n  for(const ln of s.split(\"\\n\")){\n    if(ln !== ln.replace(/\\s+$/, \"\")) return false;\n    for(let i = 0; i < ln.length; i++) if(ln.charCodeAt(i) < 0x20) return false;\n  }\n  return true;\n}\n\nfunction isPlainObject(v){ return v !== null && typeof v === \"object\" && !Array.isArray(v); }\n\nfunction emit(obj, ind, lines){\n  const pad = \"  \".repeat(ind);\n  if(isPlainObject(obj)){\n    for(const k of Object.keys(obj)){\n      const v = obj[k], key = scalarInline(k);\n      if(isPlainObject(v)){\n        if(Object.keys(v).length){ lines.push(pad + key + \":\"); emit(v, ind + 1, lines); }\n        else lines.push(pad + key + \": {}\");\n      }else if(Array.isArray(v)){\n        if(v.length){ lines.push(pad + key + \":\"); emit(v, ind + 1, lines); }\n        else lines.push(pad + key + \": []\");\n      }else if(typeof v === \"string\" && literalOk(v)){\n        lines.push(pad + key + \": |-\");\n        for(const ln of v.split(\"\\n\")    const rows = 1 + subStages.length;\n    pos[head.id] = [colx(6), bandY];\n    if(head.ifelseId) pos[head.ifelseId] = [colx(7), bandY];\n    subStages.forEach(function(st, i){\n      const y = bandY + ROW * (1 + i);\n      pos[st.id] = [colx(4 + 2 * stageDepth(st)), y];\n      if(st.ifelseId) pos[st.ifelseId] = [colx(5 + 2 * stageDepth(st)), y];\n      (function deeper(node){\n        for(const c of node.children){\n          if(!c.isBranch) continue;\n          const dst = stages.get(nodeKey(c));\n          pos[dst.id] = [colx(4 + 2 * stageDepth(dst)), y];\n          if(dst.ifelseId) pos[dst.ifelseId] = [colx(5 + 2 * stageDepth(dst)), y];\n          deeper(c);\n        }\n      })(st.node);\n    });\n    const gy = bandY + rows * ROW + 70;\n    pos[gaggIds[nodeKey(cat)]] = [colx(gaCol), gy];\n    bandY = gy + 116 + BAND_GAP;\n  }\n  return pos;\n}\n\nfunction place(pos, nid){ return {x: pos[nid][0], y: pos[nid][1]}; }\n\nfunction nodeShell(nid, data, p, height){\n  return {data: data, height: height === undefined ? 116 : height, id: nid,\n          position: p, positionAbsolute: {x: p.x, y: p.y}, selected: false,\n          sourcePosition: \"right\", targetPosition: \"left\", type: \"custom\", width: 244};\n}\n\nfunction llmNode(stage, pos){\n  let desc;\n  if(stage.env) desc = stage.ex.desc || (stage.label + \"を環境変数 \" + stage.env + \" の分類基準に従って細分判定します。\");\n  else if(stage.isRoot) desc = stage.ex.desc || \"契約書の主たる勘定科目区分を判定します。\";\n  else desc = stage.ex.desc || (stage.label + \"の細分を判定します(基準はプロンプト内固定)。\");\n  const suffix = rep(stage.id, \"llm-\", \"\");\n  const data = {\n    context: {enabled: false, variable_selector: []},\n    desc: desc,\n    model: clone(MODEL),\n    prompt_template: [\n      {id: \"system-prompt-\" + suffix, role: \"system\", text: systemPrompt(stage)},\n      {id: \"user-prompt-\" + suffix, role: \"user\", text: userPrompt(stage)}\n    ],\n    selected: false,\n    title: stage.ex.title || (stage.titlePrefix + stage.label + \" 細分判定\"),\n    type: \"llm\",\n    variables: [],\n    vision: {enabled: false}\n  };\n  return nodeShell(stage.id, data, place(pos, stage.id));\n}\n\nfunction caseIdFor(childStage){\n  return childStage.ex.case_id || (\"case-\" + rep(rep(childStage.id, \"llm-sub-\", \"\"), \"llm-\", \"\"));\n}\n\nfunction makeCase(stage, childStage){\n  const ex = childStage.ex;\n  const value = ex.case_value || childStage.label;\n  const cid = caseIdFor(childStage);\n  const cond = ex.cond_id || rep(cid, \"case-\", \"cond-\");\n  return [{\n    case_id: cid,\n    conditions: [{\n      comparison_operator: \"start with\",\n      id: cond,\n      value: value,\n      varType: \"string\",\n      variable_selector: [stage.id, \"text\"]\n    }],\n    id: cid,\n    logical_operator: \"and\"\n  }, value];\n}\n\nfunction ifelseNode(stage, stages, pos){\n  const branch = stage.branchChildren();\n  const pairs = branch.map(function(c){\n    const r = makeCase(stage, stages.get(nodeKey(c)));\n    return {case: r[0], value: r[1], child: c};\n  });\n  // ケースは値の長い順(Difyは上から順に評価するため、前方一致の包含関係を解決する)\n  pairs.sort((a, b) => b.value.length - a.value.length);\n  for(const c of stage.node.children){\n    for(const p of pairs){\n      if(c.label === p.child.label) continue;\n      if(c.label.indexOf(p.value) === 0 && !c.isBranch)\n        throw Err(\"条件分岐の前方一致が衝突: 値「\" + p.value + \"」(\" + p.child.label + \"行き)が葉ラベル「\"\n                  + c.label + \"」にもマッチします。\\n→ どちらかのラベル名を変えてください。\");\n    }\n    if(c.label.indexOf(\"質問\") === 0) throw Err(\"「質問」で始まるラベルは使えません: \" + c.label);\n  }\n  const values = pairs.map(p => p.value);\n  if(new Set(values).size !== values.length)\n    throw Err(\"条件分岐のケース値が重複しています: \" + values.join(\"、\"));\n  const exIf = stage.ex.ifelse || {};\n  let defaultTitle, defaultDesc;\n  if(stage.isRoot){ defaultTitle = \"条件分岐\"; defaultDesc = \"細分を持つ区分の場合のみ小区分判定へ分岐します。\"; }\n  else{\n    defaultTitle = \"条件分岐(\" + stage.titlePrefix + stage.label + \"細分)\";\n    defaultDesc = stage.label + \"の細分のうち、さらに細分を持つものを対応する判定へ分岐します。\";\n  }\n  const data = {\n    cases: pairs.map(p => p.case),\n    desc: exIf.desc || defaultDesc,\n    selected: false,\n    title: exIf.title || defaultTitle,\n    type: \"if-else\"\n  };\n  return nodeShell(stage.ifelseId, data, place(pos, stage.ifelseId),\n                   exIf.height === undefined ? 126 : exIf.height);\n}\n\nfunction makeEdge(byId, src, handle, tgt){\n  return {\n    data: {isInIteration: false, sourceType: byId[src].data.type, targetType: byId[tgt].data.type},\n    id: src + \"-\" + handle + \"-\" + tgt + \"-target\",\n    source: src, sourceHandle: handle,\n    target: tgt, targetHandle: \"target\",\n    type: \"custom\", zIndex: 0\n  };\n}\n\n// ============================================================ 環境変数\nfunction codeMapLines(root){\n  const lines = [];\n  (function walk(n, seven, three, path){\n    if(n.parent !== null){\n      path = path.concat([n.label]);\n      let full = null;\n      if(n.code !== null){\n        if(n.code.length === 7 && !seven){ seven = n.code; three = null; }\n        else if(n.code.length === 3) three = n.code;\n        else full = n.code;\n      }\n      if(full) lines.push(path.join(\"/\") + \",\" + full);\n      else if(seven) lines.push(path.join(\"/\") + \",\" + seven + (three || \"\"));\n    }\n    for(const c of n.children) walk(c, seven, three, path);\n  })(root, null, null, []);\n  return lines;\n}\n\nfunction envVars(root, stages, extras){\n  const out = [];\n  (function walk(node){\n    const stage = stages.get(nodeKey(node));\n    if(stage.env){\n      const lines = [];\n      node.children.forEach(function(c, i){\n        lines.push(c.definition ? (i + 1) + \". \" + c.label + \": \" + c.definition : (i + 1) + \". \" + c.label);\n      });\n      let desc = (extras.env_descriptions || {})[stage.env];\n      if(!desc){\n        desc = stage.label + \"の細分の分類基準。行を追記・編集すると判定に反映される\"\n             + \"(ラベル名: 定義 または ラベル名のみ の形式。名前から分かるものは定義省略可)。\";\n        for(const bc of stage.branchChildren())\n          desc += \" ※「\" + bc.label + \"」の行は条件分岐が名称を参照しているため名称変更不可。\";\n      }\n      const ids = (extras.env_ids || {})[stage.env] || {};\n      out.push({\n        description: desc,\n        id: ids.id || (\"env-\" + rep(stage.env, \"_\", \"-\")),\n        name: stage.env,\n        value: lines.join(\"\\n\"),\n        value_type: ids.value_type || \"string\"\n      });\n    }\n    for(const c of stage.branchChildren()) walk(c);\n  })(root);\n  return out;\n}\n\n// ============================================================ 全体組み立て\nfunction generate(treeText, extras, warnings){\n  const root = parseTree(treeText, warnings);\n  const stages = buildStages(root, extras);\n\n  const used = new Set();\n  for(const st of stages.values()){ used.add(st.id); if(st.ifelseId) used.add(st.ifelseId); }\n  const gaggIds = {};\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const suffix = rep(rep(stages.get(nodeKey(cat)).id, \"llm-sub-\", \"\"), \"llm-\", \"\");\n    let gid = \"aggregator-\" + suffix, k = 2;\n    while(used.has(gid)){ gid = \"aggregator-\" + suffix + k; k++; }\n    used.add(gid);\n    gaggIds[nodeKey(cat)] = gid;\n  }\n\n  const pos = computeLayout(root, stages, gaggIds);\n\n  const nodes = extras.scaffold_nodes.map(clone);\n  for(const n of nodes){\n    if(pos[n.id]){ n.position = place(pos, n.id); n.positionAbsolute = place(pos, n.id); }\n  }\n  const order = postorder(root, stages);\n\n  const stageNodes = [];\n  (function emitStage(node){\n    const stage = stages.get(nodeKey(node));\n    stageNodes.push(llmNode(stage, pos));\n    if(stage.ifelseId) stageNodes.push(ifelseNode(stage, stages, pos));\n    for(const c of stage.branchChildren()) emitStage(c);\n  })(root);\n  for(const n of stageNodes) nodes.push(n);\n\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const gid = gaggIds[nodeKey(cat)];\n    nodes.push(nodeShell(gid, {\n      desc: cat.label + \"系の判定結果を1つに集約します(最も深い判定が優先)。\",\n      output_type: \"string\",\n      selected: false,\n      title: \"変数集約(\" + cat.label + \")\",\n      type: \"variable-aggregator\",\n      variables: postorderSub(cat, stages).map(st => [st.id, \"text\"])\n    }, place(pos, gid)));\n  }\n\n  // 経路組み立て\n  const pathOrder = Array.from(stages.values()).slice();\n  pathOrder.sort((a, b) => stageDepth(a) - stageDepth(b));\n  const tpParts = [];\n  for(const st of pathOrder){\n    const v = rep(st.id, \"-\", \"_\");\n    tpParts.push(\"{% if \" + v + \" and \" + v + \"[:2] != '質問' %}\"\n                 + (st.isRoot ? \"\" : \"/\") + \"{{ \" + v + \" }}{% endif %}\");\n  }\n  nodes.push(nodeShell(\"template-path\", {\n    desc: \"判定で通ってきた経路を「流動資産/現金・預金/預金」のように「/」で連結します。\",\n    selected: false,\n    template: tpParts.join(\"\"),\n    title: \"経路組み立て\",\n    type: \"template-transform\",\n    variables: pathOrder.map(st => ({value_selector: [st.id, \"text\"], variable: rep(st.id, \"-\", \"_\")}))\n  }, place(pos, \"template-path\")));\n\n  // コード確定\n  const codeTmpl = \"{% set ns = namespace(code='', p=path) %}\"\n    + \"{% for _ in range(12) %}{% if ns.code == '' and ns.p %}\"\n    + \"{% for line in map.split('\\\\n') %}\"\n    + \"{% if line and line.split(',')[0] == ns.p %}{% set ns.code = line.split(',')[1] %}{% endif %}\"\n    + \"{% endfor %}\"\n    + \"{% if ns.code == '' %}{% set ns.p = ns.p.rsplit('/', 1)[0] if '/' in ns.p else '' %}{% endif %}\"\n    + \"{% endif %}{% endfor %}\"\n    + \"{{ ns.code if ns.code else 'コード未登録' }}\";\n  nodes.push(nodeShell(\"template-code\", {\n    desc: \"経路から勘定科目コード(共通7桁、下3桁まで確定していれば10桁)を対応表 code_map で決定的に確定します。未登録は「コード未登録」。\",\n    selected: false,\n    template: codeTmpl,\n    title: \"コード確定\",\n    type: \"template-transform\",\n    variables: [{value_selector: [\"template-path\", \"output\"], variable: \"path\"},\n                {value_selector: [\"env\", \"code_map\"], variable: \"map\"}]\n  }, place(pos, \"template-code\")));\n\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  if(Object.keys(byId).length !== nodes.length) throw Err(\"ノードIDが重複しています\");\n\n  byId[\"aggregator\"].data.variables =\n    root.children.filter(c => c.isBranch).map(c => [gaggIds[nodeKey(c)], \"output\"])\n      .concat([[stages.get(nodeKey(root)).id, \"text\"]]);\n\n  const endNode = byId[\"end\"];\n  for(const o of endNode.data.outputs)\n    if(o.variable === \"main_account\") o.value_selector = [\"template-path\", \"output\"];\n  if(!endNode.data.outputs.some(o => o.variable === \"account_code\"))\n    endNode.data.outputs.push({value_selector: [\"template-code\", \"output\"], variable: \"account_code\"});\n  endNode.data.desc = \"契約内容サマリー(認識確認用)、仕訳または更問い、判定経路(/区切り)、勘定科目コードを出力します。\";\n\n  const edges = [];\n  const E = (src, handle, tgt) => edges.push(makeEdge(byId, src, handle, tgt));\n  E(\"start\", \"source\", \"doc-extractor\");\n  E(\"doc-extractor\", \"source\", \"llm-summary\");\n  E(\"llm-summary\", \"source\", \"if-else-confirm\");\n  E(\"if-else-confirm\", \"case-unconfirmed\", \"template-confirm\");\n  E(\"if-else-confirm\", \"false\", stages.get(nodeKey(root)).id);\n  E(\"template-confirm\", \"source\", \"aggregator-out\");\n  (function wire(node, sink){\n    const stage = stages.get(nodeKey(node));\n    if(stage.ifelseId){\n      E(stage.id, \"source\", stage.ifelseId);\n      for(const c of stage.branchChildren()){\n        E(stage.ifelseId, caseIdFor(stages.get(nodeKey(c))), stages.get(nodeKey(c)).id);\n        wire(c, node === root ? gaggIds[nodeKey(c)] : sink);\n      }\n      E(stage.ifelseId, \"false\", sink);\n    }else{\n      E(stage.id, \"source\", sink);\n    }\n  })(root, \"aggregator\");\n  for(const cat of root.children) if(cat.isBranch) E(gaggIds[nodeKey(cat)], \"source\", \"aggregator\");\n  E(\"aggregator\", \"source\", \"template-path\");\n  E(\"template-path\", \"source\", \"template-code\");\n  E(\"template-code\", \"source\", \"if-else-q\");\n  E(\"if-else-q\", \"case-question\", \"aggregator-out\");\n  E(\"if-else-q\", \"false\", \"llm-journal\");\n  E(\"llm-journal\", \"source\", \"aggregator-out\");\n  E(\"aggregator-out\", \"source\", \"end\");\n\n  const leaves = [];\n  (function countLeaves(n){\n    for(const c of n.children){ if(c.leaf) leaves.push(c.label); else countLeaves(c); }\n  })(root);\n  const app = clone(extras.app);\n  let envCount = 0;\n  for(const st of stages.values()) if(st.env) envCount++;\n  app.description = \"契約書ファイルを読み込み、契約の主たる勘定科目を段階的に判定して、金額なしの仕訳(借方/貸方)と\"\n    + \"確信度・誤分類時の影響度を出力するワークフロー。初回実行は契約内容の認識確認で停止し、\"\n    + \"情報不足時は更問い(質問+回答例)を返す。分類は\" + order.length + \"ステージの段階判定で、最終ラベルは\"\n    + leaves.length + \"種類。細分の分類基準は環境変数 rules_*(\" + envCount + \"個)で編集できる。\"\n    + \"このDSLはREADMEの分類ツリーから tools/generate_workflow.py で自動生成したもの。\";\n\n  const envs = envVars(root, stages, extras);\n  envs.push({\n    description: \"経路→勘定科目コードの対応表(ツリーの[7桁][3桁]から自動生成。1行=「経路,コード」。\"\n               + \"修正はツリー側が正で、ここでの編集は再生成までの応急対応)。\",\n    id: \"env-code-map\",\n    name: \"code_map\",\n    value: codeMapLines(root).join(\"\\n\"),\n    value_type: \"string\"\n  });\n\n  return {\n    app: app,\n    kind: \"app\",\n    version: \"0.1.5\",\n    workflow: {\n      conversation_variables: extras.conversation_variables || [],\n      environment_variables: envs,\n      features: clone(extras.features),\n      graph: {edges: edges, nodes: nodes, viewport: {x: 0, y: 0, zoom: 0.7}}\n    }\n  };\n}\n\n// ============================================================ オーケストレーション図\n// tools/render_canvas.py と同じ描き方をそのまま移植したもの(SVGを組み立てるだけ・通信なし)\nconst NODE_COLORS = {\n  \"start\": [\"#12b76a\", \"開始\"],\n  \"document-extractor\": [\"#667085\", \"テキスト抽出\"],\n  \"llm\": [\"#2970ff\", \"LLM\"],\n  \"if-else\": [\"#f79009\", \"条件分岐\"],\n  \"variable-aggregator\": [\"#7a5af8\", \"変数集約\"],\n  \"template-transform\": [\"#0e9384\", \"テンプレート\"],\n  \"end\": [\"#f04438\", \"終了\"]\n};\n\nfunction srcPort(node, handle){\n  const x = node.position.x + (node.width || 244);\n  const y0 = node.position.y, h = node.height || 116;\n  if(node.data.type === \"if-else\"){\n    const cases = node.data.cases || [];\n    const slots = cases.length + 1;\n    let idx = cases.length;\n    if(handle !== \"false\"){\n      for(let i = 0; i < cases.length; i++) if(cases[i].case_id === handle){ idx = i; break; }\n    }\n    return [x, y0 + h * (idx + 1) / (slots + 1)];\n  }\n  return [x, y0 + h / 2];\n}\n\nfunction tgtPort(node){\n  return [node.position.x, node.position.y + (node.height || 116) / 2];\n}\n\nfunction xesc(s){\n  return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\")\n                  .replace(/\"/g, \"&quot;\");\n}\n\nfunction canvasSvg(nodes, edges, zoom){\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  let w = 0, h = 0;\n  for(const n of nodes){\n    w = Math.max(w, n.position.x + (n.width || 244));\n    h = Math.max(h, n.position.y + (n.height || 116));\n  }\n  w += 100; h += 100;\n  const p = [];\n  p.push('<svg width=\"' + Math.round(w * zoom) + '\" height=\"' + Math.round(h * zoom)\n         + '\" viewBox=\"0 0 ' + w + \" \" + h + '\" xmlns=\"http://www.w3.org/2000/svg\">');\n  p.push('<rect width=\"' + w + '\" height=\"' + h + '\" fill=\"#f7f8fa\"/>');\n  for(const e of edges){\n    const s0 = byId[e.source], t0 = byId[e.target];\n    if(!s0 || !t0) continue;\n    const a = srcPort(s0, e.sourceHandle), b = tgtPort(t0);\n    const dx = Math.max(50, (b[0] - a[0]) * 0.5);\n    p.push('<path d=\"M ' + a[0].toFixed(0) + \" \" + a[1].toFixed(0)\n           + \" C \" + (a[0] + dx).toFixed(0) + \" \" + a[1].toFixed(0) + \", \"\n           + (b[0] - dx).toFixed(0) + \" \" + b[1].toFixed(0) + \", \"\n           + b[0].toFixed(0) + \" \" + b[1].toFixed(0)\n           + '\" fill=\"none\" stroke=\"rgba(52,64,84,0.5)\" stroke-width=\"1.6\"/>');\n    p.push('<circle cx=\"' + b[0].toFixed(0) + '\" cy=\"' + b[1].toFixed(0) + '\" r=\"3\" fill=\"#344054\"/>');\n  }\n  for(const n of nodes){\n    const x = n.position.x, y = n.position.y;\n    const wd = n.width || 244, ht = n.height || 116;\n    const c = NODE_COLORS[n.data.type] || [\"#667085\", n.data.type];\n    p.push(\"<g>\");\n    p.push('<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + wd + '\" height=\"' + ht\n           + '\" rx=\"10\" fill=\"#ffffff\" stroke=\"#d0d5dd\" stroke-width=\"1.5\"/>');\n    p.push('<rect x=\"' + x + '\" y=\"' + y + '\" width=\"6\" height=\"' + ht + '\" rx=\"3\" fill=\"' + c[0] + '\"/>');\n    p.push('<text x=\"' + (x + 16) + '\" y=\"' + (y + 28) + '\" font-size=\"15\" font-weight=\"bold\" '\n           + 'fill=\"#101828\" font-family=\"sans-serif\">' + xesc(n.data.title || n.id) + \"<\/text>\");\n    p.push('<text x=\"' + (x + 16) + '\" y=\"' + (y + 50) + '\" font-size=\"12\" fill=\"' + c[0]\n           + '\" font-family=\"sans-serif\">' + xesc(c[1]) + \"<\/text>\");\n    if(n.data.type === \"if-else\"){\n      const cases = (n.data.cases || []).concat([null]);\n      for(const cse of cases){\n        const pt = srcPort(n, cse === null ? \"false\" : cse.case_id);\n        const label = cse === null ? \"ELSE\" : cse.conditions[0].value;\n        p.push('<circle cx=\"' + pt[0].toFixed(0) + '\" cy=\"' + pt[1].toFixed(0) + '\" r=\"3.5\" fill=\"#f79009\"/>');\n        p.push('<text x=\"' + (pt[0] - 8).toFixed(0) + '\" y=\"' + (pt[1] + 3).toFixed(0)\n               + '\" font-size=\"10\" fill=\"#98a2b3\" text-anchor=\"end\" font-family=\"sans-serif\">'\n               + xesc(label) + \"<\/text>\");\n      }\n    }\n    p.push(\"<\/g>\");\n  }\n  p.push(\"<\/svg>\");\n  return {svg: p.join(\"\"), w: w, h: h};\n}\n\n// ============================================================ 画面\nconst $ = id => document.getElementById(id);\nlet YAML = null, GRAPH = null, SVG_FULL = \"\", ZOOM = 0;\n\nfunction show(id, on){ $(id).classList.toggle(\"hide\", !on); }\nfunction esc(s){ return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\"); }\n\nfunction run(){\n  const text = $(\"tree\").value;\n  if(!text.trim()){\n    show(\"resultCard\", true); show(\"yamlCard\", false);\n    $(\"summary\").textContent = \"\";\n    $(\"checks\").innerHTML = '<div class=\"warn\">分類ツリーが入っていません。上の欄に貼り付けてください。<\/div>';\n    return;\n  }\n  const warnings = [];\n  let d;\n  try{\n    d = generate(text, JSON.parse(EXTRAS_JSON), warnings);\n  }catch(e){\n    show(\"resultCard\", true); show(\"yamlCard\", false); show(\"canvasCard\", false);\n    $(\"summary\").textContent = \"\";\n    $(\"checks\").innerHTML = '<div class=\"warn\"><b>変換できませんでした<\/b><br>'\n      + esc(e.userFacing ? e.message : e.message).replace(/\\n/g, \"<br>\")\n      + \"<br><br>※ このメッセージをそのまま伝えず、内容をかみくだいて利用者に確認してください。<\/div>\";\n    YAML = null;\n    return;\n  }\n  YAML = dumpYaml(d);\n  const g = d.workflow.graph;\n  const kinds = {};\n  for(const n of g.nodes) kinds[n.data.type] = (kinds[n.data.type] || 0) + 1;\n  const parts = Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a]).map(k => k + \" \" + kinds[k]);\n  show(\"resultCard\", true);\n  $(\"summary\").textContent =\n    \"■ 変換しました\\n  ノード \" + g.nodes.length + \"個 / エッジ \" + g.edges.length\n    + \"個 / 環境変数 \" + d.workflow.environment_variables.length + \"個\\n  内訳: \" + parts.join(\" / \");\n  $(\"checks\").innerHTML = warnings.length\n    ? '<div class=\"warn\"><b>確認してほしいこと<\/b><ul>'\n      + warnings.map(w => \"<li>\" + esc(w) + \"<\/li>\").join(\"\") + \"<\/ul><\/div>\"\n    : '<div class=\"ok\">構造チェックで問題は見つかりませんでした。<\/div>';\n  $(\"yaml\").textContent = YAML;\n  show(\"yamlCard\", true);\n  GRAPH = g;\n  ZOOM = 0;\n  drawCanvas(true);\n  show(\"canvasCard\", true);\n}\n\nfunction drawCanvas(fit){\n  if(!GRAPH) return;\n  const box = $(\"canvas\").clientWidth || 900;\n  const probe = canvasSvg(GRAPH.nodes, GRAPH.edges, 1);\n  if(fit) ZOOM = Math.max(0.06, Math.min(1, (box - 24) / probe.w));\n  const r = canvasSvg(GRAPH.nodes, GRAPH.edges, ZOOM);\n  $(\"canvas\").innerHTML = r.svg;\n  SVG_FULL = canvasSvg(GRAPH.nodes, GRAPH.edges, 1).svg;\n  $(\"canvasInfo\").textContent = \"ノード \" + GRAPH.nodes.length + \"個 / 表示倍率 \"\n                              + Math.round(ZOOM * 100) + \"%(\" + r.w + \" x \" + r.h + \")\";\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/yaml;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  document.body.appendChild(ta);\n  ta.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(ta);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\nasync function load(file){\n  $(\"tree\").value = await file.text();\n  $(\"drop\").querySelector(\"b\").textContent = file.name;\n}\n\n$(\"drop\").onclick = () => $(\"file\").click();\n$(\"file\").onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n$(\"drop\").ondragover = e => { e.preventDefault(); $(\"drop\").classList.add(\"hot\"); };\n$(\"drop\").ondragleave = () => $(\"drop\").classList.remove(\"hot\");\n$(\"drop\").ondrop = e => {\n  e.preventDefault();\n  $(\"drop\").classList.remove(\"hot\");\n  if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n};\n$(\"run\").onclick = run;\n$(\"clear\").onclick = () => {\n  $(\"tree\").value = \"\";\n  show(\"resultCard\", false);\n  show(\"yamlCard\", false);\n  show(\"canvasCard\", false);\n};\n$(\"zoomIn\").onclick = () => { ZOOM = Math.min(2, ZOOM * 1.4); drawCanvas(false); };\n$(\"zoomOut\").onclick = () => { ZOOM = Math.max(0.04, ZOOM / 1.4); drawCanvas(false); };\n$(\"zoomFit\").onclick = () => drawCanvas(true);\n$(\"dlsvg\").onclick = () => {\n  if(!SVG_FULL) return;\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([SVG_FULL], {type: \"image/svg+xml;charset=utf-8\"}));\n  a.download = \"orchestration.svg\";\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n};\n$(\"dl\").onclick = () => YAML && save(YAML, \"contract-account-classification.yml\");\n$(\"cp\").onclick = e => YAML && copy(YAML, e.target);\n<\/script>\n"}];
var GUIDE_TEXT = "# 分類ツリーの検査(チャットAIに貼るだけ)\n\n**使い方: このファイルの中身を全部コピーしてチャットAIに貼り、続けて分類ツリーの中身を貼ってください。**\n\n**貼るツリーは①が出力した「7桁ツリー」(tree-7digit.md)を使ってください。**\n10桁ツリーは大きすぎてチャットでは全体を見きれません。10桁の深い部分は\nコードで親が決まっているため検査は7桁で足り、検査結果(昇格・定義文)は\nあとで「反映」機能が10桁ツリーへ機械的に写します。\n(小さいツリーであれば、10桁ツリーを直接貼っても同じように検査できます)\n\n---\n\nあなたは日本の企業会計に精通した経理・会計の専門家であり、\nこのツリーを使う分類AIの **監査役** です。作った本人ではなく、**粗探しをする側**として読んでください。\n\n## このツリーが何に使われるか(前提)\n\n契約書を1通ずつ読み、**上の段から順に、選択肢を1つだけ選んで下りていく**ワークフローの設計図です。\n\n- 一度選んだら**後戻りしません**。浅い段を誤ると、下流では絶対に正解に届きません\n- 判定に使えるのは、**その段の選択肢のラベル名と定義文だけ**です\n  (契約書の本文は毎回渡されますが、ツリーの他の段は見えません)\n- **あなたがこれから書く定義文が、そのまま分類AIのプロンプトになります**\n\n目標は **正答率99%** です。「たぶん大丈夫」では届きません。\n\n## 検査の姿勢(ここが一番大事)\n\n- **「問題ありません」で終わらせないでください。** 指摘ゼロの回答は、検査をしていないのと同じとみなします\n- **すべての段・すべての選択肢を1つずつ**評価し、表に書き出してください。まとめて「問題なし」は不可です\n- **少しでも迷ったら「要対処」にしてください。** 見逃す方が、直しすぎるより有害です\n- **あなたが迷う段は、契約書1通しか見えない分類AIはもっと迷います。**\n  「文脈があれば分かる」は不可です。契約書だけで決まるかを基準にしてください\n\n## ツリーの読み方\n\n    区分判定(1段目)\n    ├─ 資産\n    │   ├─ 流動資産\n    │   │   ├─ 現金・預金\n    │   │   │   ├─ 現金       [1101001001]\n    │   │   │   └─ 預金       [1101001002]\n    │   │   └─ 有価証券        [1101002001]\n    └─ 費用\n        └─ ...\n\n    ├─ / └─ … 枝。インデント1段 = 半角スペース4つ分(「│   」または「    」)\n    配下が無い行 … 最終ラベル(そこで判定が終わる)\n    [1101001001] … 勘定科目コード(そのラベルに対応する番号)\n\n次の記号が付いていることもありますが、**付いていなくても構いません**:\n\n    ★ … その段で判定が紛れたときの受け皿\n    ◆ … 最終ラベルの印(付いていなければ「配下が無い行」が最終ラベルです)\n    🔒 … 名称変更禁止 / ✏ rules_xxx … 判定基準を外部設定で管理している印\n    ラベル: 定義 … コロンの後ろはそのラベルの定義文\n\n**Excelから作ったツリーには定義文が1つも入っていません。** その場合、定義を書き起こすのが\nこの検査の最大の仕事です。ラベル名だけで判定させると、そこが精度の上限になります。\n\n## 最初にやること: 除外候補の洗い出し\n\nこのツリーは**契約書を分類する**ためのものです。ところが勘定科目マスタには、\n**契約書の主科目には決してならない科目**が混ざっていることがあります。例えば:\n\n- 中間勘定・振替用・決算整理用など、**社内の経理処理でしか使わない科目**\n- 仮払金・仮受金・未決算などの**一時的な経過勘定**\n- 本支店勘定・内部取引消去用など、**内部管理専用の科目**\n\nこうした科目は選択肢に残っているだけで誤判定の原因になります。\n**検査の最初に「除外候補」として洗い出し、理由をつけて提案してください。**\n\n- **あなたが削除してはいけません。** 提案するだけです(採否は利用者が決めます)\n- 確信が持てなくても、疑わしければ候補に挙げてください(残す判断は人がします)\n- 利用者は、確定した候補を①の「除外する科目」欄に貼ってツリーを作り直します\n\n## 見るべき4点(段ごとに、全選択肢について)\n\n**A. 所属** — その選択肢は、親ラベルの意味範囲に本当に含まれるか\n  例: 「現金・預金」の配下に「有価証券」がある → 有価証券は現金でも預金でもない → ×\n\n**B. 判定可能性(最重要)** — **契約書にどんな記述があればこれを選べるか**を、1つずつ具体的に言えるか\n  「契約書のこの条項/この語があればこれ」と言えなければ △ または ×\n  例: 「その他経費」— 何が書いてあればこれになるのか言えない → ×\n\n**C. 兄弟の境界** — 同じ段の2つ以上に当てはまりそうな契約を、1つでも思いつくか\n  思いついたら △ 以下。**思いつかない場合も、思いつこうと試みた形跡を書いてください**\n\n**D. 経路の見通し** — 上の段のラベル名だけを見て、この深いラベルにたどり着けるか\n  上の段の名前からこの中身が想像できないなら ×\n\n## 対処のしかた(4点の結果をどう直すか)\n\n1. **昇格**(1階層上へ移動) — **A が × のとき、または D が × のとき**\n   - 昇格したら、その新しい段でもう一度 A〜D を判定してください。まだ収まらなければさらに上へ。\n     **収まるまで繰り返します**(積み上げ式)\n   - **迷ったら昇格させてください。**「たぶん含まれる」は昇格の理由になります\n   - ただし、**昇格の結果その段の選択肢が20個を超える場合は昇格せず**、\n     代わりに 2. の定義を厚く書いて対処してください(選択肢が多すぎる段は、それ自体が誤判定の原因です)\n\n2. **定義を書く(原則すべてに必須)** — **B か C が「高」でないものすべて**\n   - 定義は **`ラベル [コード]: 定義文`** の形で書きます。\n     **コードは必ずコロンより前**に置いてください(コードを定義文の中に入れないこと)\n\n         誤: ├─ 現金: 手許現金。現金授受の定めがあるもの [1101001001]\n         正: ├─ 現金 [1101001001]: 手許現金。現金授受の定めがあるもの\n   - 書く内容は次の3つを1〜2行で:\n     - **契約書に現れる語・条項名**(例: 「賃貸借」「使用貸借」「月額賃料」)\n     - **典型的な契約類型**(例: 「オフィスの賃貸借契約」)\n     - **除外条件**(例: 「ただし設備の保守料は含まない → 保守料へ」)\n   - **兄弟と読み比べて、境界が一目で分かるように書き分けてください。**\n     どちらにも読める定義は書かないこと\n\n3. **受け皿(★)の指定** — その段に「どれにも当てはまらない場合の逃げ先」があるか\n   - 無ければ、いちばん近い「その他」系の選択肢に ★ を付けてください\n   - ★ は各段にちょうど1つです\n\n### やってはいけないこと(厳守)\n\n- **統合禁止** — 昇格先に似た項目・同名の項目があっても、まとめないでください。別項目として並べます\n- **削除禁止** — 最終ラベルの数は検査の前後で変わりません。昇格は「場所を移す」だけです\n- **改名禁止** — ラベル名は変えないでください(定義文を足すのは必須、名前を変えるのは禁止)\n- **別の枝への付け替え禁止** — 動かしてよいのは1階層上への昇格だけです。\n  「別の枝の方が適切」と思ったら、**指摘として書くだけ**にしてください\n- **コード `[...]` はラベルにくっついて動きます。**数字を書き換えたり消したりしないこと\n\n## 出力のしかた(2回に分けて出してください)\n\n一度に全部出すと途中で切れます。**まず1回目だけを出し、そこで止まってください。**\n\n### 1回目:除外候補と検査表(ツリーは出さない)\n\n**最初に除外候補を出してください。**\n\n    ── 除外候補(契約書の主科目にならないと思われる科目)\n\n    | ラベル | 理由 |\n    |---|---|\n    | 中間勘定 | 社内の振替処理専用で、契約書から直接発生しない |\n    | 仮払金 | 一時的な経過勘定。契約の主科目にならない |\n\n    ▼ コピー用(利用者はこのブロックを①の「除外する科目」欄に貼る)\n    中間勘定\n    仮払金\n\n    1つも無ければ「除外候補: なし(全科目が契約書の分類対象になりうる)」と明記する。\n\n続けて、検査表を出します。\n\n**最も深い段から順に**、すべての段について次の形で出してください。\n\n    ── 段: 資産/流動資産/現金・預金(選択肢 3個)\n\n    | ラベル | A所属 | B判定可能性 | C境界 | 対処 |\n    |---|---|---|---|---|\n    | 現金 | ○ | △ | 小口現金と紛れる | 定義追記 |\n    | 預金 | ○ | ○ | ○ | 定義追記 |\n    | 小口現金 | ○ | △ | 現金と紛れる | 定義追記 |\n\n    この段の総合: 中\n    紛れる契約の例: 「少額の現金支払を伴う契約」は現金と小口現金のどちらにも読める\n\n- 評価は **○ / △ / ×** の3段階。**迷ったら低い方**を付けてください\n- 「この段の総合」が **高** になるのは、全項目が ○ で、紛れる契約が1つも思いつかなかった段だけです\n- 最後にサマリーを出してください:\n\n      検査した段: n個 / 昇格が必要: n件 / 定義の追記が必要: n件 / 総合が「低」の段: n個\n\n**ここで止まって、「続けてよいか」を聞いてください。**\n\n除外候補が出た場合は、サマリーの後に\n「**除外候補を①に反映してツリーを作り直してから、この検査をやり直すことを推奨します**」と添えてください\n(除外すると段の構成が変わり、検査結果も変わるため)。\n\n### 2回目:修正後のツリー全文(「次」と言われてから)\n\n- 昇格を反映し、**すべての最終ラベルと分岐に定義文を付けた**ツリーを、コードブロックで出力します\n- **省略禁止**。「以下同様」「変更なし」は使わず、最後の行まで出し切ってください\n- 枝の記号とインデントは元のツリーと同じ書式を保ってください\n- **コード `[...]` は元のまま**残してください\n\n### ツリーが大きい場合\n\n段が多くて1回で出し切れないときは、**1段目の区分ごとに区切って**出してください\n(「流動資産の分を出します」→「次は固定資産」…)。\n**省略して縮めるのだけは絶対に避けてください。**\n\n## 出力する前の自己チェック(必ず行う)\n\n1つでも当てはまらなければ**間違いなので作り直す**こと。\n\n- [ ] **除外候補を出した**(無い場合は「なし」と明記した)\n- [ ] **すべての段について検査表を出した**(まとめて「問題なし」で飛ばした段が無い)\n- [ ] **すべての選択肢に定義文を付けた**(元から定義があるものは、書き換えずにそのまま)\n- [ ] 「紛れる契約の例」を、総合が「高」でない段すべてに書いた\n- [ ] 1行目が `区分判定(1段目)` になっている\n- [ ] `├─` `└─` `│` の罫線が使われている\n- [ ] **最終ラベルの数が、元のツリーと同じ**(勝手に減っていない)\n- [ ] **コード `[...]` が元と同じ個数だけある**(消えていない・数字が変わっていない)\n- [ ] 途中で省略していない(最後の行まで出し切っている)\n\n**「直すところが無い」という結論は、原則ありえません。**\n定義文が1つも無いツリーなら、全ラベルが「定義の追記が必要」です。\n本当に何も無いと判断した場合は、**その根拠**(全段で紛れる契約を探したが見つからなかったこと)を\n段ごとに示してください。\n\n---\n\n## 検算のしかた(利用者向け)\n\nAIが行を消していないか・名前を変えていないかは、**必ず機械で照合してください**。\n\n**いちばん確実なのは `ツリー検査.html` です**(ブラウザで開くだけ・Python不要)。\n検査に出す**前のツリー**と、AIが返してきた**修正後のツリー**の2つを入れて\n「差分をチェックする」を押すと、次を照合します。\n\n- 勘定科目コードが**消えていないか**/元に無いコードが**増えていないか**\n- **同じコードなのにラベル名が変わっていないか**(コードとラベルの対応が崩れる)\n- ラベルが**消えていないか**/**名前が書き換えられていないか**/似た項目に**統合されていないか**\n- **どこが変わったか**(行ごとの差分。消えた行は赤、増えた行は緑)\n- 位置が変わったラベル(=これが検査の成果。意図どおりか目で確認する)\n\n「そのまま使えます / 確認してから使ってください / そのまま使わないでください」の3段階で判定が出ます。\n\n検算が「そのまま使えます」になったら、同じ `ツリー検査.html` の\n**「検査結果(7桁)を10桁ツリーへ反映する」**に、検査後の7桁ツリーと①の10桁ツリーを入れてください。\n昇格と定義文が10桁ツリーへ機械的に写され、コードと葉がすべて保存されたことを照合したうえで\n「反映後の10桁ツリー」が出ます。それを③(ツリーからDify)に渡します。\n\n手元にPythonがある場合は `ツリー検査.py` でも同じ検算・反映ができます(任意)。\n\n```\npython3 ツリー検査.py 修正後の7桁.md -b 修正前の7桁.md\npython3 ツリー検査.py 修正後の7桁.md --apply-to 元の10桁.md -o 反映後の10桁.md\n```\n";
var GUIDE_TITLE = "②-1 検査の指示";
var GUIDE_HINT = "この手順書の全文を、社内のチャットAIに貼り付けてください。"
  + "続けて①で作ったツリーを貼ると、検査して修正後のツリーを返してきます。"
  + "返ってきたツリーは「②-2 検算」タブで元のツリーと照合してください。";

var nav = document.getElementById("nav");
var main = document.getElementById("main");
var step = document.getElementById("step");
var panes = [], cur = -1;

function makeGuide(){
  var d = document.createElement("div");
  d.className = "guide";
  var inner = document.createElement("div");
  inner.className = "inner";
  var card = document.createElement("div");
  card.className = "card";
  var h = document.createElement("h2");
  h.textContent = "チャットAIに貼る手順書";
  var p = document.createElement("p");
  p.textContent = GUIDE_HINT;
  var btn = document.createElement("button");
  btn.textContent = "手順書を全部コピーする";
  btn.onclick = function(){
    var ta = document.createElement("textarea");
    ta.value = GUIDE_TEXT;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    btn.textContent = "コピーしました";
    setTimeout(function(){ btn.textContent = "手順書を全部コピーする"; }, 1400);
  };
  var pre = document.createElement("pre");
  pre.textContent = GUIDE_TEXT;
  card.appendChild(h); card.appendChild(p); card.appendChild(btn); card.appendChild(pre);
  inner.appendChild(card); d.appendChild(inner);
  return d;
}

function select(i){
  if(cur === i) return;
  cur = i;
  for(var k = 0; k < panes.length; k++){
    if(panes[k]) panes[k].classList.toggle("hide", k !== i);
    nav.children[k].classList.toggle("on", k === i);
  }
  if(!panes[i]){
    var t = TOOLS[i];
    if(t.guide) panes[i] = makeGuide();
    else{
      var f = document.createElement("iframe");
      f.setAttribute("title", t.name);
      panes[i] = f;
      main.appendChild(f);
      f.srcdoc = t.html;
    }
    if(t.guide) main.appendChild(panes[i]);
    for(var k2 = 0; k2 < panes.length; k2++) if(panes[k2]) panes[k2].classList.toggle("hide", k2 !== i);
  }
  step.textContent = TOOLS[i].hint;
}

for(var i = 0; i < TOOLS.length; i++){
  panes.push(null);
  var b = document.createElement("button");
  b.textContent = TOOLS[i].name;
  b.onclick = (function(n){ return function(){ select(n); }; })(i);
  nav.appendChild(b);
}
select(0);
</script>
