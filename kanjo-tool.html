<title>勘定科目 分類ツール</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#f6f7f9; --fg:#1b1d20; --sub:#5b6169; --line:#d8dce1; --card:#ffffff;
    --accent:#2f6fed; --accent-fg:#ffffff; --code-bg:#f2f4f7;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       font-family:"Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;line-height:1.7}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 0;flex:0 0 auto}
  header h1{font-size:16px;margin:0 0 2px;font-weight:600}
  header p{margin:0 0 8px;font-size:12px;color:var(--sub)}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{padding:7px 14px;border:1px solid var(--line);border-bottom:none;
             border-radius:7px 7px 0 0;background:#eef0f3;color:var(--sub);
             font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:-1px}
  nav button:hover{background:#e4e7ec}
  nav button.on{background:var(--card);color:var(--fg);font-weight:600;
                border-bottom:1px solid var(--card)}
  .step{font-size:12px;color:var(--sub);padding:6px 16px;background:var(--card);
        border-bottom:1px solid var(--line);flex:0 0 auto}
  main{flex:1 1 auto;position:relative;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .guide{position:absolute;inset:0;overflow:auto;padding:24px 16px 60px}
  .guide .inner{max-width:1040px;margin:0 auto}
  .guide .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .guide h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .guide p{font-size:14px;margin:0 0 12px}
  .guide pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;
             overflow:auto;max-height:60vh;font-family:"BIZ UDGothic","MS Gothic","Consolas",monospace;
             font-size:12px;line-height:1.6;margin:0;white-space:pre-wrap}
  .guide button{padding:8px 16px;border:1px solid var(--accent);border-radius:6px;
                background:var(--accent);color:var(--accent-fg);font-size:14px;
                font-family:inherit;font-weight:600;cursor:pointer;margin-bottom:12px}
  .guide button:hover{filter:brightness(1.08)}
  .hide{display:none}
</style>

<header>
  <h1>勘定科目 分類ツール</h1>
  <p>Excel → 分類ツリー → 検査 → Dify の4ステップ。<b>すべてこのブラウザの中だけで処理され、どこにも送信されません</b>(通信は一切行いません)。</p>
  <nav id="nav"></nav>
</header>
<div class="step" id="step"></div>
<main id="main"></main>

<script>
"use strict";
var TOOLS = [{"name": "① Excelからツリー", "hint": "勘定科目マスタ(Excel)から分類ツリーを作ります。", "html": "<title>Excelから分類ツリー<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{\n    --bg:#f6f7f9; --fg:#1b1d20; --sub:#5b6169; --line:#d8dce1; --card:#ffffff;\n    --accent:#2f6fed; --accent-fg:#ffffff; --warn:#8a4b00; --warn-bg:#fff5e6;\n    --ok:#0f6b3f; --ok-bg:#eaf7f0; --code-bg:#f2f4f7;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:24px 16px 80px;background:var(--bg);color:var(--fg);\n       font-family:\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;line-height:1.7}\n  .wrap{max-width:1040px;margin:0 auto}\n  h1{font-size:22px;margin:0 0 4px}\n  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}\n  .card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n  #drop{border:2px dashed var(--line);border-radius:10px;padding:32px 16px;text-align:center;\n        background:var(--card);cursor:pointer;transition:.15s}\n  #drop.hot{border-color:var(--accent);background:#eef3fe}\n  #drop b{display:block;font-size:16px;margin-bottom:4px}\n  #drop span{color:var(--sub);font-size:13px}\n  .grid{display:flex;flex-wrap:wrap;gap:12px}\n  .f{display:flex;flex-direction:column;gap:4px}\n  .f label{font-size:12px;color:var(--sub)}\n  .f input,.f select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;\n                     font-size:14px;font-family:inherit;background:#fff;color:var(--fg)}\n  .f input{width:110px}\n  .f.wide input{width:220px}\n  button{padding:8px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;\n         color:var(--fg);font-size:14px;font-family:inherit;cursor:pointer}\n  button:hover{background:#f0f2f5}\n  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}\n  button.primary:hover{filter:brightness(1.08)}\n  button:disabled{opacity:.5;cursor:not-allowed}\n  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\n  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;\n      overflow-x:auto;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n      font-size:13px;line-height:1.5;margin:0;white-space:pre}\n  .log{white-space:pre-wrap;font-size:13px}\n  .warn{background:var(--warn-bg);border:1px solid #f0d6a8;color:var(--warn);\n        border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .ok{background:var(--ok-bg);border:1px solid #b8e0cb;color:var(--ok);\n      border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .warn ul,.ok ul{margin:6px 0 0;padding-left:20px}\n  table{border-collapse:collapse;font-size:12px;width:100%}\n  th,td{border:1px solid var(--line);padding:3px 6px;text-align:left;white-space:nowrap;\n        overflow:hidden;text-overflow:ellipsis;max-width:220px}\n  th{background:var(--code-bg);color:var(--sub);font-weight:600}\n  td.hit{background:#eef3fe}\n  .scroll{overflow-x:auto}\n  .hide{display:none}\n  .note{font-size:12px;color:var(--sub);margin-top:8px}\n  .tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}\n  .tabs button{border-radius:6px 6px 0 0}\n  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}\n<\/style>\n\n<div class=\"wrap\">\n<h1>Excelから分類ツリーを作る<\/h1>\n<p class=\"lead\">\n  勘定科目マスタ(.xlsx / .csv)をこのページに落とすと、分類ツリー(10桁 / 7桁)と対応表を作ります。\n  <b>ファイルはこのブラウザの中だけで処理され、どこにも送信されません<\/b>(通信は一切行いません)。\n<\/p>\n\n<div id=\"drop\">\n  <b>ここに Excel をドラッグ&amp;ドロップ<\/b>\n  <span>またはクリックしてファイルを選ぶ(.xlsx / .csv / .tsv)<\/span>\n  <input type=\"file\" id=\"file\" accept=\".xlsx,.csv,.tsv,.txt\" class=\"hide\">\n<\/div>\n\n<div class=\"card hide\" id=\"setup\">\n  <h2>1. 読み取る列を確認する<\/h2>\n  <div class=\"grid\">\n    <div class=\"f\"><label>シート<\/label><select id=\"sheet\"><\/select><\/div>\n    <div class=\"f\"><label>勘定科目区分1<\/label><input id=\"c1\" value=\"B\"><\/div>\n    <div class=\"f\"><label>勘定科目区分2<\/label><input id=\"c2\" value=\"C\"><\/div>\n    <div class=\"f\"><label>勘定科目明細<\/label><input id=\"c3\" value=\"D\"><\/div>\n    <div class=\"f\"><label>勘定科目コード<\/label><input id=\"c4\" value=\"E\"><\/div>\n    <div class=\"f\"><label>利用区分<\/label><input id=\"c5\" value=\"J\"><\/div>\n    <div class=\"f\"><label>自社で使う印<\/label><input id=\"mark\" value=\"○\"><\/div>\n    <div class=\"f\"><label>コードの桁数<\/label><input id=\"digits\" value=\"10\"><\/div>\n    <div class=\"f\"><label>共通部分の桁数<\/label><input id=\"split\" value=\"7\"><\/div>\n    <div class=\"f\"><label>データ開始行(空=自動)<\/label><input id=\"startrow\" value=\"\"><\/div>\n    <div class=\"f wide\"><label>いちばん上の見出し<\/label><input id=\"rootlabel\" value=\"区分判定\"><\/div>\n  <\/div>\n  <div style=\"margin-top:12px\">\n    <label style=\"font-size:12px;color:var(--sub)\">除外する科目(任意・1行に1つ: 科目名または勘定科目コード。②の検査で提案された除外候補をそのまま貼れます)<\/label>\n    <textarea id=\"exclude\" style=\"height:72px;margin-top:4px\" placeholder=\"中間勘定&#10;仮払金\"><\/textarea>\n  <\/div>\n  <div class=\"note\">\n    列はアルファベット(A, B, AA…)で指定します。下の表で色が付いた列が読み取り対象です。\n    利用区分での絞り込みをやめたいときは「自社で使う印」を空にしてください。\n  <\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"run\">ツリーを作る<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"previewCard\">\n  <h2>読み込んだ表(先頭20行)<\/h2>\n  <div class=\"scroll\"><div id=\"preview\"><\/div><\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"resultCard\">\n  <h2>2. 結果<\/h2>\n  <div id=\"summary\" class=\"log\"><\/div>\n  <div id=\"checks\"><\/div>\n  <div class=\"btns\">\n    <button id=\"dl10\">10桁ツリーを保存<\/button>\n    <button id=\"dl7\">7桁ツリーを保存<\/button>\n    <button id=\"dlcsv\">対応表(CSV)を保存<\/button>\n    <button id=\"cp10\">10桁ツリーをコピー<\/button>\n    <button id=\"cp7\">7桁ツリーをコピー<\/button>\n    <button id=\"cpcsv\">対応表をコピー<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"treeCard\">\n  <h2>3. できたツリー<\/h2>\n  <div class=\"tabs\">\n    <button id=\"tab10\" class=\"on\">10桁(最後まで特定)<\/button>\n    <button id=\"tab7\">7桁(共通部分)<\/button>\n  <\/div>\n  <pre id=\"tree\"><\/pre>\n<\/div>\n\n<\/div>\n\n<script>\n\"use strict\";\n\n// ============================================================ xlsx を読む\n// ブラウザ標準の DecompressionStream だけで zip を展開する(外部ライブラリ不要)\nasync function unzip(buf){\n  const u8 = new Uint8Array(buf), dv = new DataView(buf);\n  let eocd = -1;\n  for(let i = u8.length - 22; i >= 0; i--){\n    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }\n  }\n  if(eocd < 0) throw new Err('このファイルはzip形式ではありません。.xlsx か .csv を渡してください。');\n  const count = dv.getUint16(eocd + 10, true);\n  let off = dv.getUint32(eocd + 16, true);\n  const files = {};\n  for(let k = 0; k < count; k++){\n    if(dv.getUint32(off, true) !== 0x02014b50) break;\n    const nlen = dv.getUint16(off + 28, true);\n    const elen = dv.getUint16(off + 30, true);\n    const clen = dv.getUint16(off + 32, true);\n    const method = dv.getUint16(off + 10, true);\n    const csize = dv.getUint32(off + 20, true);\n    const lho = dv.getUint32(off + 42, true);\n    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen));\n    const lnlen = dv.getUint16(lho + 26, true);\n    const lelen = dv.getUint16(lho + 28, true);\n    const start = lho + 30 + lnlen + lelen;\n    const data = u8.subarray(start, start + csize);\n    let out;\n    if(method === 0){ out = data; }\n    else{\n      const st = new Blob([data]).stream().pipeThrough(new DecompressionStream(\"deflate-raw\"));\n      out = new Uint8Array(await new Response(st).arrayBuffer());\n    }\n    files[name] = new TextDecoder().decode(out);\n    off += 46 + nlen + elen + clen;\n  }\n  return files;\n}\n\nfunction Err(msg){ const e = new Error(msg); e.userFacing = true; return e; }\n\nconst XN = \"http://schemas.openxmlformats.org/spreadsheetml/2006/main\";\nconst XR = \"http://schemas.openxmlformats.org/officeDocument/2006/relationships\";\n\nfunction xml(text){\n  const d = new DOMParser().parseFromString(text, \"application/xml\");\n  if(d.querySelector(\"parsererror\")) throw new Err(\"ファイルの中身を読めませんでした(壊れている可能性があります)。\");\n  return d;\n}\n\nfunction textOf(el){\n  let s = \"\";\n  const ts = el.getElementsByTagNameNS(XN, \"t\");\n  for(let i = 0; i < ts.length; i++) s += ts[i].textContent || \"\";\n  return s;\n}\n\nfunction colIndex(ref){\n  const m = /^([A-Z]+)/.exec(ref || \"\");\n  if(!m) return -1;\n  let n = 0;\n  for(const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);\n  return n - 1;\n}\n\nfunction letter(idx){\n  let s = \"\", n = idx + 1;\n  while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }\n  return s;\n}\n\nasync function readXlsx(buf){\n  const files = await unzip(buf);\n  const shared = [];\n  if(files[\"xl/sharedStrings.xml\"]){\n    const d = xml(files[\"xl/sharedStrings.xml\"]);\n    const sis = d.getElementsByTagNameNS(XN, \"si\");\n    for(let i = 0; i < sis.length; i++) shared.push(textOf(sis[i]));\n  }\n  if(!files[\"xl/workbook.xml\"]) throw new Err(\".xlsx として読めませんでした。Excelで「.xlsx」として保存し直してください。\");\n  const wb = xml(files[\"xl/workbook.xml\"]);\n  const target = {};\n  if(files[\"xl/_rels/workbook.xml.rels\"]){\n    const rd = xml(files[\"xl/_rels/workbook.xml.rels\"]);\n    const rs = rd.getElementsByTagName(\"Relationship\");\n    for(let i = 0; i < rs.length; i++) target[rs[i].getAttribute(\"Id\")] = rs[i].getAttribute(\"Target\");\n  }\n  const sheets = [];\n  const shEls = wb.getElementsByTagNameNS(XN, \"sheet\");\n  for(let i = 0; i < shEls.length; i++){\n    const id = shEls[i].getAttributeNS(XR, \"id\");\n    let t = target[id] || (\"worksheets/sheet\" + (i + 1) + \".xml\");\n    t = t.charAt(0) === \"/\" ? t.slice(1) : (t.indexOf(\"xl/\") === 0 ? t : \"xl/\" + t);\n    sheets.push({name: shEls[i].getAttribute(\"name\"), part: t});\n  }\n  if(!sheets.length) throw new Err(\"シートが1枚もありません。別のファイルか確認してください。\");\n\n  function rowsOf(part){\n    if(!files[part]) return [];\n    const d = xml(files[part]);\n    const rowEls = d.getElementsByTagNameNS(XN, \"row\");\n    const out = [];\n    for(let i = 0; i < rowEls.length; i++){\n      const cs = rowEls[i].getElementsByTagNameNS(XN, \"c\");\n      const cells = {};\n      let maxc = -1, seq = 0;\n      for(let j = 0; j < cs.length; j++){\n        const c = cs[j];\n        const ref = c.getAttribute(\"r\"), ty = c.getAttribute(\"t\");\n        let ci = ref ? colIndex(ref) : seq;\n        if(ci < 0) ci = seq;\n        seq = ci + 1;\n        const vs = c.getElementsByTagNameNS(XN, \"v\");\n        let val = \"\";\n        if(ty === \"s\" && vs.length) val = shared[parseInt(vs[0].textContent, 10)] || \"\";\n        else if(ty === \"inlineStr\"){\n          const is = c.getElementsByTagNameNS(XN, \"is\");\n          val = is.length ? textOf(is[0]) : \"\";\n        }\n        else if(vs.length) val = vs[0].textContent || \"\";\n        cells[ci] = val.trim();\n        if(ci > maxc) maxc = ci;\n      }\n      const row = [];\n      for(let k = 0; k <= maxc; k++) row.push(cells[k] === undefined ? \"\" : cells[k]);\n      out.push(row);\n    }\n    return out;\n  }\n\n  const table = {};\n  for(const s of sheets) table[s.name] = rowsOf(s.part);\n  return {sheets: sheets.map(s => s.name), table: table};\n}\n\nfunction readCsv(text, delim){\n  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);\n  const rows = [];\n  let row = [], cell = \"\", q = false;\n  for(let i = 0; i < text.length; i++){\n    const ch = text[i];\n    if(q){\n      if(ch === '\"'){ if(text[i + 1] === '\"'){ cell += '\"'; i++; } else q = false; }\n      else cell += ch;\n    }else if(ch === '\"') q = true;\n    else if(ch === delim){ row.push(cell.trim()); cell = \"\"; }\n    else if(ch === \"\\n\"){ row.push(cell.trim()); rows.push(row); row = []; cell = \"\"; }\n    else if(ch !== \"\\r\") cell += ch;\n  }\n  if(cell !== \"\" || row.length){ row.push(cell.trim()); rows.push(row); }\n  return rows;\n}\n\n// ============================================================ 文字の扱い\nconst CIRCLES = \"○◯〇\";   // ○ ◯ 〇\nconst SKIP_WORDS = [\"合計\", \"小計\", \"総計\", \"計\", \"※\", \"備考\", \"以上\"];\n\nfunction norm(s){ return (s === undefined || s === null ? \"\" : String(s)).replace(/　/g, \" \").trim(); }\n\nfunction sameMark(a, b){\n  a = norm(a); b = norm(b);\n  // 半角空文字が「○◯〇」に含まれる判定にならないよう、必ず1文字どうしで比べる\n  if(a.length === 1 && b.length === 1 && CIRCLES.indexOf(a) >= 0 && CIRCLES.indexOf(b) >= 0) return true;\n  return a === b;\n}\n\n// 全角(W/F)は2、それ以外(Ambiguous含む)は1。罫線と桁を揃えるため Ambiguous は1にする\nconst WIDE = [\n  [0x1100,0x115F],[0x2E80,0x303E],[0x3041,0x33FF],[0x3400,0x4DBF],[0x4E00,0x9FFF],\n  [0xA000,0xA4CF],[0xAC00,0xD7A3],[0xF900,0xFAFF],[0xFE10,0xFE19],[0xFE30,0xFE6F],\n  [0xFF00,0xFF60],[0xFFE0,0xFFE6],[0x1F300,0x1F64F],[0x1F900,0x1F9FF],\n  [0x20000,0x2FFFD],[0x30000,0x3FFFD]\n];\nfunction dwidth(s){\n  let w = 0;\n  for(const ch of s){\n    const c = ch.codePointAt(0);\n    let wide = false;\n    for(const r of WIDE){ if(c >= r[0] && c <= r[1]){ wide = true; break; } }\n    w += wide ? 2 : 1;\n  }\n  return w;\n}\n\n// ============================================================ ツリー\nfunction Node(label){\n  this.label = label; this.children = []; this.index = {};\n  this.code = null; this.full = null; this.parent = null;\n}\nNode.prototype.child = function(label){\n  if(!Object.prototype.hasOwnProperty.call(this.index, label)){\n    const n = new Node(label);\n    n.parent = this;\n    this.index[label] = n;\n    this.children.push(n);\n  }\n  return this.index[label];\n};\nNode.prototype.isLeaf = function(){ return this.children.length === 0; };\nNode.prototype.path = function(){\n  const out = [];\n  let n = this;\n  while(n.parent !== null){ out.push(n.label); n = n.parent; }\n  return out.reverse();\n};\n\nfunction iterAll(n, out){\n  out = out || [];\n  for(const c of n.children){ out.push(c); iterAll(c, out); }\n  return out;\n}\n\nfunction build(records){\n  const root = new Node(\"(root)\");\n  const seen = {};\n  let dup = 0;\n  const conflict = [];\n  for(const rec of records){\n    const path = rec[0], code = rec[1];\n    let n = root;\n    for(const label of path) n = n.child(label);\n    const key = path.join(\"\u0000\");\n    if(Object.prototype.hasOwnProperty.call(seen, key)){\n      dup++;\n      if(code && seen[key] && code !== seen[key]) conflict.push([path, seen[key], code]);\n      continue;\n    }\n    seen[key] = code;\n    n.full = code || null;\n  }\n  return {root: root, dup: dup, conflict: conflict};\n}\n\n// 自分にもコードがあり、かつ配下も持つ節に「自分を表す葉」を足す\nfunction addSelfLeaves(root){\n  const added = [];\n  (function walk(n){\n    for(const c of n.children.slice()) walk(c);\n    if(n.parent !== null && n.full && n.children.length){\n      const leaf = new Node(n.label);\n      leaf.full = n.full;\n      leaf.parent = n;\n      n.children.unshift(leaf);\n      n.index[leaf.label] = leaf;\n      n.full = null;\n      added.push(n.path().join(\"/\"));\n    }\n  })(root);\n  return added;\n}\n\nfunction assignCodes(root){\n  for(const n of iterAll(root)) if(n.isLeaf() && n.full) n.code = n.full;\n}\n\n// コードの上N桁が確定する段まで遡って刈り込む\nfunction pruneToPrefix(root, split){\n  function prefixes(n){\n    if(n.isLeaf()) return (n.full && n.full.length >= split) ? new Set([n.full.slice(0, split)]) : new Set();\n    const out = new Set();\n    for(const c of n.children) for(const p of prefixes(c)) out.add(p);\n    return out;\n  }\n  function copyPruned(n){\n    const nw = new Node(n.label);\n    const ps = prefixes(n);\n    if(ps.size === 1){ nw.code = Array.from(ps)[0]; return nw; }\n    for(const c of n.children){\n      const cp = copyPruned(c);\n      if(cp === null) continue;\n      cp.parent = nw;\n      nw.children.push(cp);\n      nw.index[cp.label] = cp;\n    }\n    return nw.children.length ? nw : null;\n  }\n  const out = copyPruned(root);\n  if(out !== null) out.parent = null;\n  return out;\n}\n\n// 7桁ツリーの整理: 同じコードになる兄弟をまとめ、全部同じなら親を葉にする\nfunction mergeSameCode(n){\n  for(const c of n.children.slice()) mergeSameCode(c);\n  if(n.children.length && n.children.every(c => c.isLeaf() && c.code)\n     && new Set(n.children.map(c => c.code)).size === 1){\n    n.code = n.children[0].code;\n    n.children = []; n.index = {};\n    return;\n  }\n  const out = [], group = {};\n  for(const c of n.children){\n    if(c.isLeaf() && c.code && Object.prototype.hasOwnProperty.call(group, c.code)){\n      group[c.code].push(c.label);\n      continue;\n    }\n    out.push(c);\n    if(c.isLeaf() && c.code) group[c.code] = [c.label];\n  }\n  for(const c of out){\n    const names = group[c.code || \"\"] || [];\n    if(names.length > 1){\n      c.label = names.slice(0, 5).join(\"・\")\n              + (names.length <= 5 ? \"\" : \" ほか\" + (names.length - 5) + \"件\");\n    }\n  }\n  n.children = out;\n  n.index = {};\n  for(const c of out) n.index[c.label] = c;\n}\n\n// Difyのワークフローでは分岐名が全体で一意である必要があるため、重複を検出する\nfunction duplicateBranchNames(root){\n  const seen = {};\n  for(const n of iterAll(root)){\n    if(n.isLeaf()) continue;\n    (seen[n.label] = seen[n.label] || []).push(n.path().join(\"/\"));\n  }\n  return Object.keys(seen).filter(k => seen[k].length > 1).map(k => [k, seen[k]]);\n}\n\nfunction depthStats(root){\n  const out = {};\n  (function walk(n, d){\n    for(const c of n.children){\n      if(c.isLeaf()) out[d] = (out[d] || 0) + 1;\n      else walk(c, d + 1);\n    }\n  })(root, 1);\n  return out;\n}\n\nfunction countCodes(root){\n  const codes = iterAll(root).filter(n => n.code).map(n => n.code);\n  const byLen = {};\n  for(const c of codes) byLen[c.length] = (byLen[c.length] || 0) + 1;\n  const seen = new Set(), dup = [];\n  for(const c of codes){\n    if(seen.has(c) && dup.indexOf(c) < 0) dup.push(c);\n    seen.add(c);\n  }\n  return {total: codes.length, byLen: byLen, dup: dup};\n}\n\nfunction render(root, rootLabel){\n  const rows = [];\n  (function walk(n, prefix){\n    n.children.forEach(function(c, i){\n      const last = i === n.children.length - 1;\n      rows.push([prefix + (last ? \"└─ \" : \"├─ \") + c.label, c.code || \"\"]);\n      walk(c, prefix + (last ? \"    \" : \"│   \"));\n    });\n  })(root, \"\");\n  let width = 0;\n  for(const r of rows) if(r[1]) width = Math.max(width, dwidth(r[0]));\n  const lines = [rootLabel + \"(1段目)\"];\n  for(const r of rows){\n    lines.push(r[1] ? r[0] + \" \".repeat(width - dwidth(r[0]) + 1) + \"[\" + r[1] + \"]\" : r[0]);\n  }\n  return lines.join(\"\\n\");\n}\n\nfunction leavesOf(root){ return iterAll(root).filter(n => n.isLeaf()); }\nfunction branchesOf(root){ return iterAll(root).filter(n => !n.isLeaf()); }\n\nfunction headerText(kind){\n  return \"# 分類ツリー — \" + kind + \"\\n\"\n    + \"\\nこのツリーは勘定科目マスタ(Excel)から自動生成したものです。\\n\"\n    + \"\\n見方:\\n\"\n    + \"- **配下が無い行が最終ラベル**です(そこで判定が終わります)\\n\"\n    + \"- 右側の `[...]` が勘定科目コードです\\n\\n\";\n}\n\n// ============================================================ 変換本体\nfunction parseColSpec(v, name){\n  const s = norm(v).toUpperCase();\n  if(!/^[A-Z]+$/.test(s)) throw new Err(\"「\" + name + \"」の列指定が不正です: \" + (v || \"(空)\") + \"(A, B, AA のように指定してください)\");\n  let n = 0;\n  for(const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64);\n  return n - 1;\n}\n\nfunction findStartRow(rows, cols){\n  for(let i = 0; i < rows.length; i++){\n    const row = rows[i];\n    const code = norm(row[cols.code]), l1 = norm(row[cols.l1]);\n    if(l1 && code && /^[0-9]+$/.test(code)) return i;\n  }\n  return -1;\n}\n\nfunction convert(rows, o){\n  const cols = o.cols;\n  const start = o.startRow > 0 ? o.startRow - 1 : findStartRow(rows, cols);\n  if(start < 0) throw new Err(\n    \"データの開始行が見つかりませんでした。「区分1の列に文字があり、コードの列が数字だけ」の行がありません。\\n\"\n    + \"→ 勘定科目区分1・勘定科目コードがそれぞれ何列か、下の表で確認して指定し直してください。\");\n\n  const exclude = (o.exclude || []).map(norm).filter(x => x);\n  const exHits = {};\n  for(const e of exclude) exHits[e] = 0;\n  const records = [];\n  let skipped = 0, blank = 0, junk = 0, collapsed = 0, splitRows = 0, excluded = 0;\n  const carry = {l1: \"\", l2: \"\"};\n  for(let i = start; i < rows.length; i++){\n    const row = rows[i];\n    const get = r => norm(row[cols[r]]);\n    if(o.mark && !sameMark(get(\"use\"), o.mark)){ skipped++; continue; }\n    let l1 = get(\"l1\"), l2 = get(\"l2\");\n    const l3 = get(\"l3\"), code = get(\"code\");\n    if(l1){ carry.l1 = l1; if(!l2) carry.l2 = \"\"; }\n    else l1 = carry.l1;\n    if(l2) carry.l2 = l2; else l2 = carry.l2;\n\n    if(!l1 && !l2 && !l3){ blank++; continue; }\n    if(!l1 || (!l3 && !l2)){ junk++; continue; }\n    if(SKIP_WORDS.some(w => l3 === w || l3.indexOf(w) === 0)){ junk++; continue; }\n\n    const details = l3.split(new RegExp(\"[\" + o.detailSep.replace(/[.*+?^${}()|[\\]\\\\\\-]/g, \"\\\\$&\") + \"]\"))\n                      .map(norm).filter(x => x);\n    if(details.length > 1) splitRows++;\n    const parts = [l1, l2].concat(details);\n    const pathParts = [];\n    for(const p of parts){\n      if(p && (!pathParts.length || pathParts[pathParts.length - 1] !== p)) pathParts.push(p);\n    }\n    if(pathParts.length < parts.filter(p => p).length) collapsed++;\n    if(exclude.length){\n      const paddedCode = (/^[0-9]+$/.test(code) && o.digits > 0 && code.length < o.digits)\n        ? \"0\".repeat(o.digits - code.length) + code : code;\n      let hit = null;\n      for(const e of exclude){ if(e === code || e === paddedCode){ hit = e; break; } }\n      if(hit === null) for(const e of exclude){ if(pathParts.indexOf(e) >= 0){ hit = e; break; } }\n      if(hit !== null){ exHits[hit]++; excluded++; continue; }\n    }\n    records.push([pathParts, code]);\n  }\n\n  const totalData = rows.length - start;\n  if(!records.length) throw new Err(\n    \"使える行が1行もありませんでした(\" + totalData + \"行を見て、利用区分「\" + o.mark + \"」に一致する行がありません)。\\n\"\n    + \"→ 「自社で使う印」の値(○ / 1 / 使用 など)か、利用区分の列を確認してください。\");\n\n  let padded = 0;\n  if(o.digits > 0){\n    for(const rec of records){\n      const c = rec[1];\n      if(c && /^[0-9]+$/.test(c) && c.length < o.digits){\n        rec[1] = \"0\".repeat(o.digits - c.length) + c;\n        padded++;\n      }\n    }\n  }\n\n  const b1 = build(records), b2 = build(records);\n  const root = b1.root, root2 = b2.root;\n  const selfLeaves = addSelfLeaves(root);\n  addSelfLeaves(root2);\n  assignCodes(root);\n\n  let root7 = o.split > 0 ? pruneToPrefix(root2, o.split) : null;\n  if(root7) mergeSameCode(root7);\n\n  // ---- 集計\n  const lines = [];\n  lines.push(\"■ 読み取り: \" + records.length + \"行を採用 / 利用区分で除外 \" + skipped\n             + \"行 / 除外リスト \" + excluded + \"行 / 空行 \" + blank + \"行 / 合計・注記など \" + junk + \"行\");\n  if(excluded) lines.push(\"  ・除外リストで \" + excluded + \"行を除外しました\");\n  if(splitRows) lines.push(\"  ・\" + splitRows + \"行で、明細のスラッシュを階層に展開しました\");\n  if(collapsed) lines.push(\"  ・\" + collapsed + \"行で、同じ名前が続く階層を1段に畳みました\");\n  if(selfLeaves.length) lines.push(\"  ・\" + selfLeaves.length + \"箇所で「自分を表す葉」を足しました(例: \"\n                                   + selfLeaves.slice(0, 2).join(\"、\") + \")\");\n  if(padded) lines.push(\"  ・コード \" + padded + \"件を \" + o.digits + \"桁に揃えました(先頭の0を補完)\");\n  if(b1.dup) lines.push(\"  ・同じ経路の重複 \" + b1.dup + \"件(先に出てきた行を採用)\");\n\n  const c10 = countCodes(root);\n  const lv10 = leavesOf(root).length, br10 = branchesOf(root).length;\n  const fmtLen = by => Object.keys(by).map(Number).sort((a, b) => a - b)\n                        .map(k => k + \"桁 \" + by[k] + \"個\").join(\"、\");\n  lines.push(\"\");\n  lines.push(\"■ 10桁ツリー: 最終ラベル \" + lv10 + \"個 / 判定の段 \" + br10\n             + \"個 / 1段目 \" + root.children.length + \"個\");\n  lines.push(\"  コード \" + c10.total + \"個(\" + fmtLen(c10.byLen) + \")\");\n\n  const warn = [];\n  let c7 = null;\n  if(root7){\n    c7 = countCodes(root7);\n    const d7 = depthStats(root7);\n    lines.push(\"■ \" + o.split + \"桁ツリー: 最終ラベル \" + leavesOf(root7).length\n               + \"個 / 判定の段 \" + branchesOf(root7).length + \"個\");\n    lines.push(\"  コード \" + c7.total + \"個(\" + fmtLen(c7.byLen) + \")\");\n    lines.push(\"  最終ラベルの深さ: \" + Object.keys(d7).map(Number).sort((a, b) => a - b)\n                                        .map(k => k + \"段目 \" + d7[k] + \"個\").join(\"、\"));\n    const depths = Object.keys(d7).map(Number);\n    if(!depths.length)\n      warn.push(o.split + \"桁ツリーが作れませんでした(全コードの上\" + o.split\n                + \"桁が同じ値です)。コードの列か、共通部分の桁数を確認してください\");\n    else if(Math.max.apply(null, depths) <= 1)\n      warn.push(o.split + \"桁ツリーが階層構造になっていません(すべて1段目)。\"\n                + \"ツリーではなく一覧になっているので、列の指定かコードの体系を確認してください\");\n    if(c7.dup.length) warn.push(o.split + \"桁ツリーで同じコードが複数の場所にあります(\"\n                                + c7.dup.length + \"種類。例: \" + c7.dup.slice(0, 3).join(\"、\") + \")\");\n  }\n\n  if(c10.total !== records.length)\n    warn.push(\"採用した \" + records.length + \"行に対してコードが \" + c10.total\n              + \"個しかありません(コードが空の行がある可能性)\");\n  if(Object.keys(c10.byLen).length > 1)\n    warn.push(\"コードの桁数がそろっていません(\" + fmtLen(c10.byLen) + \")。「コードの桁数」で揃えられます\");\n  if(c10.dup.length)\n    warn.push(\"同じコードが複数の場所にあります(\" + c10.dup.length + \"種類。例: \"\n              + c10.dup.slice(0, 3).join(\"、\") + \")\");\n  if(root.children.length <= 1)\n    warn.push(\"1段目(いちばん上の分類)が \" + root.children.length + \"個しかありません。列の指定が違う可能性があります\");\n  if(root.children.length >= 30)\n    warn.push(\"1段目が \" + root.children.length + \"個もあります。区分1ではなく別の列を読んでいる可能性があります\");\n  if(exclude.length){\n    const miss = exclude.filter(e => !exHits[e]);\n    if(miss.length)\n      warn.push(\"除外リストの \" + miss.slice(0, 5).map(e => \"「\" + e + \"」\").join(\"、\")\n                + \" に一致する行がありません(書き間違いの可能性)\");\n  }\n  if(totalData >= 50 && lv10 < totalData * 0.2)\n    warn.push(\"データ \" + totalData + \"行に対して最終ラベルが \" + lv10\n              + \"個しかありません(明らかに少なすぎます)。利用区分の値か、列の指定が違う可能性があります\");\n  for(const cf of b1.conflict.slice(0, 3))\n    warn.push(\"経路「\" + cf[0].join(o.sep) + \"」に別のコードが付いています(\" + cf[1] + \" と \" + cf[2] + \")\");\n\n  const dupname = duplicateBranchNames(root);\n  if(dupname.length){\n    lines.push(\"\");\n    lines.push(\"■ 参考: 同じ名前の中間段階が \" + dupname.length\n               + \"件あります(別のものとして扱うので問題ありません)\");\n    for(const d of dupname.slice(0, 5)) lines.push(\"   ・\" + d[0] + \" … \" + d[1].slice(0, 3).join(\" / \"));\n  }\n\n  const wide = branchesOf(root).map(b => [b.children.length, b.path().join(\"/\")])\n                               .filter(x => x[0] > 20).sort((a, b) => b[0] - a[0]);\n  if(wide.length){\n    lines.push(\"\");\n    lines.push(\"■ 参考: 選択肢が20を超える段があります(1回の判定で選ぶ数が多いと精度が落ちやすい)\");\n    for(const w of wide.slice(0, 5)) lines.push(\"   ・\" + w[1] + \" … \" + w[0] + \"択\");\n  }\n\n  const csvLines = [\"経路,勘定科目コード\"];\n  const q = s => /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n  for(const rec of records) csvLines.push(q(rec[0].join(o.sep)) + \",\" + q(rec[1] || \"\"));\n\n  return {\n    log: lines.join(\"\\n\"),\n    warn: warn,\n    tree10: headerText(\"10桁(勘定科目コードを最後まで特定する)\")\n            + \"```\\n\" + render(root, o.rootLabel) + \"\\n```\\n\",\n    tree7: root7 ? headerText(o.split + \"桁(共通部分だけを特定する)\")\n            + \"```\\n\" + render(root7, o.rootLabel) + \"\\n```\\n\" : null,\n    csv: \"﻿\" + csvLines.join(\"\\r\\n\") + \"\\r\\n\"\n  };\n}\n\n// ============================================================ 画面\nconst $ = id => document.getElementById(id);\nlet DATA = null, RESULT = null, SHOW7 = false;\n\nfunction show(id, on){ $(id).classList.toggle(\"hide\", !on); }\n\nfunction fail(msg){\n  show(\"resultCard\", true);\n  $(\"summary\").textContent = \"\";\n  $(\"checks\").innerHTML = '<div class=\"warn\"><b>できませんでした<\/b><br>'\n    + String(msg).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/\\n/g, \"<br>\") + \"<\/div>\";\n  show(\"treeCard\", false);\n}\n\nfunction currentCols(){\n  return {\n    l1: parseColSpec($(\"c1\").value, \"勘定科目区分1\"),\n    l2: parseColSpec($(\"c2\").value, \"勘定科目区分2\"),\n    l3: parseColSpec($(\"c3\").value, \"勘定科目明細\"),\n    code: parseColSpec($(\"c4\").value, \"勘定科目コード\"),\n    use: parseColSpec($(\"c5\").value, \"利用区分\")\n  };\n}\n\nfunction drawPreview(){\n  if(!DATA) return;\n  const rows = DATA.table[$(\"sheet\").value] || [];\n  let cols = null;\n  try{ cols = currentCols(); }catch(e){ cols = null; }\n  const hit = cols ? new Set(Object.keys(cols).map(k => cols[k])) : new Set();\n  let maxc = 0;\n  for(const r of rows.slice(0, 20)) maxc = Math.max(maxc, r.length);\n  if(cols) for(const k of Object.keys(cols)) maxc = Math.max(maxc, cols[k] + 1);\n  maxc = Math.min(maxc, 26);\n\n  let h = \"<table><tr><th><\/th>\";\n  for(let c = 0; c < maxc; c++) h += \"<th\" + (hit.has(c) ? ' class=\"hit\"' : \"\") + \">\" + letter(c) + \"<\/th>\";\n  h += \"<\/tr>\";\n  rows.slice(0, 20).forEach(function(r, i){\n    h += \"<tr><th>\" + (i + 1) + \"<\/th>\";\n    for(let c = 0; c < maxc; c++){\n      const v = (r[c] === undefined ? \"\" : r[c]).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\");\n      h += \"<td\" + (hit.has(c) ? ' class=\"hit\"' : \"\") + \">\" + v + \"<\/td>\";\n    }\n    h += \"<\/tr>\";\n  });\n  h += \"<\/table>\";\n  $(\"preview\").innerHTML = h;\n  show(\"previewCard\", true);\n}\n\nasync function load(file){\n  try{\n    show(\"resultCard\", false); show(\"treeCard\", false);\n    const name = file.name.toLowerCase();\n    if(/\\.(csv|tsv|txt)$/.test(name)){\n      const text = await file.text();\n      const rows = readCsv(text, name.endsWith(\".tsv\") ? \"\\t\" : \",\");\n      DATA = {sheets: [file.name], table: {}};\n      DATA.table[file.name] = rows;\n    }else if(name.endsWith(\".xlsx\")){\n      DATA = await readXlsx(await file.arrayBuffer());\n    }else{\n      throw new Err(\".xlsx か .csv を渡してください。.xls の場合はExcelで .xlsx として保存し直してください。\");\n    }\n    const sel = $(\"sheet\");\n    sel.innerHTML = \"\";\n    for(const s of DATA.sheets){\n      const o = document.createElement(\"option\");\n      o.value = s;\n      o.textContent = s + \"(\" + (DATA.table[s] || []).length + \"行)\";\n      sel.appendChild(o);\n    }\n    $(\"drop\").querySelector(\"b\").textContent = file.name;\n    show(\"setup\", true);\n    drawPreview();\n  }catch(e){ fail(e.userFacing ? e.message : \"読み込みに失敗しました: \" + e.message); }\n}\n\nfunction run(){\n  if(!DATA) return;\n  try{\n    const o = {\n      cols: currentCols(),\n      mark: norm($(\"mark\").value),\n      digits: parseInt($(\"digits\").value, 10) || 0,\n      split: parseInt($(\"split\").value, 10) || 0,\n      startRow: parseInt($(\"startrow\").value, 10) || 0,\n      rootLabel: norm($(\"rootlabel\").value) || \"区分判定\",\n      sep: \"／\",\n      detailSep: \"/／\",\n      exclude: $(\"exclude\").value.split(\"\\n\")\n    };\n    const rows = DATA.table[$(\"sheet\").value] || [];\n    RESULT = convert(rows, o);\n    show(\"resultCard\", true);\n    $(\"summary\").textContent = \"■ シート「\" + $(\"sheet\").value + \"」\\n\"\n      + \"  読む列: 区分1=\" + letter(o.cols.l1) + \"列 / 区分2=\" + letter(o.cols.l2)\n      + \"列 / 明細=\" + letter(o.cols.l3) + \"列 / コード=\" + letter(o.cols.code)\n      + \"列 / 利用区分=\" + letter(o.cols.use) + \"列\\n\\n\" + RESULT.log;\n    if(RESULT.warn.length){\n      $(\"checks\").innerHTML = '<div class=\"warn\"><b>確認してほしいこと(このまま次へ進まないでください)<\/b><ul>'\n        + RESULT.warn.map(w => \"<li>\" + w.replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\") + \"<\/li>\").join(\"\")\n        + \"<\/ul><\/div>\";\n    }else{\n      $(\"checks\").innerHTML = '<div class=\"ok\">検算: 数字に不自然な点はありません(採用行数とコード数が一致しています)<\/div>';\n    }\n    $(\"dl7\").disabled = !RESULT.tree7;\n    $(\"cp7\").disabled = !RESULT.tree7;\n    show(\"treeCard\", true);\n    drawTree();\n  }catch(e){ fail(e.userFacing ? e.message : \"変換に失敗しました: \" + e.message); }\n}\n\nfunction drawTree(){\n  if(!RESULT) return;\n  $(\"tree\").textContent = SHOW7 && RESULT.tree7 ? RESULT.tree7 : RESULT.tree10;\n  $(\"tab10\").classList.toggle(\"on\", !SHOW7);\n  $(\"tab7\").classList.toggle(\"on\", SHOW7);\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/plain;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  document.body.appendChild(ta);\n  ta.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(ta);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\n$(\"drop\").onclick = () => $(\"file\").click();\n$(\"file\").onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n$(\"drop\").ondragover = e => { e.preventDefault(); $(\"drop\").classList.add(\"hot\"); };\n$(\"drop\").ondragleave = () => $(\"drop\").classList.remove(\"hot\");\n$(\"drop\").ondrop = e => {\n  e.preventDefault();\n  $(\"drop\").classList.remove(\"hot\");\n  if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n};\n$(\"sheet\").onchange = drawPreview;\nfor(const id of [\"c1\", \"c2\", \"c3\", \"c4\", \"c5\"]) $(id).oninput = drawPreview;\n$(\"run\").onclick = run;\n$(\"tab10\").onclick = () => { SHOW7 = false; drawTree(); };\n$(\"tab7\").onclick = () => { if(RESULT && RESULT.tree7){ SHOW7 = true; drawTree(); } };\n$(\"dl10\").onclick = () => RESULT && save(RESULT.tree10, \"tree-10digit.md\");\n$(\"dl7\").onclick = () => RESULT && RESULT.tree7 && save(RESULT.tree7, \"tree-7digit.md\");\n$(\"dlcsv\").onclick = () => RESULT && save(RESULT.csv, \"path-code-map.csv\");\n$(\"cp10\").onclick = e => RESULT && copy(RESULT.tree10, e.target);\n$(\"cp7\").onclick = e => RESULT && RESULT.tree7 && copy(RESULT.tree7, e.target);\n$(\"cpcsv\").onclick = e => RESULT && copy(RESULT.csv, e.target);\n<\/script>\n"}, {"name": "②-1 検査の指示", "guide": true, "hint": "この手順書をチャットAIに貼り、続けて①のツリーを貼ってください。"}, {"name": "②-2 検算(差分チェック)", "hint": "AIが返してきた修正後のツリーが壊れていないかを、元のツリーと照合します。", "html": "<title>ツリー検査(修正前後の差分チェック)<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{\n    --bg:#f6f7f9; --fg:#1b1d20; --sub:#5b6169; --line:#d8dce1; --card:#ffffff;\n    --accent:#2f6fed; --accent-fg:#ffffff;\n    --bad:#8a1c1c; --bad-bg:#fdecec; --bad-line:#f3c4c4;\n    --warn:#8a4b00; --warn-bg:#fff5e6; --warn-line:#f0d6a8;\n    --ok:#0f6b3f; --ok-bg:#eaf7f0; --ok-line:#b8e0cb;\n    --info:#274b8a; --info-bg:#eef3fe; --info-line:#c6d5f5;\n    --code-bg:#f2f4f7;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:24px 16px 80px;background:var(--bg);color:var(--fg);\n       font-family:\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;line-height:1.7}\n  .wrap{max-width:1100px;margin:0 auto}\n  h1{font-size:22px;margin:0 0 4px}\n  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}\n  .card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n  .cols{display:flex;gap:16px;flex-wrap:wrap}\n  .col{flex:1 1 340px;min-width:300px}\n  .col h3{font-size:14px;margin:0 0 8px}\n  .col h3 small{font-weight:400;color:var(--sub);font-size:12px}\n  .drop{border:2px dashed var(--line);border-radius:8px;padding:14px 12px;text-align:center;\n        background:var(--card);cursor:pointer;transition:.15s;margin-bottom:8px}\n  .drop.hot{border-color:var(--accent);background:var(--info-bg)}\n  .drop b{display:block;font-size:14px;margin-bottom:2px}\n  .drop span{color:var(--sub);font-size:12px}\n  textarea{width:100%;height:230px;padding:10px;border:1px solid var(--line);border-radius:6px;\n           font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;font-size:12px;\n           line-height:1.5;background:#fff;color:var(--fg);white-space:pre;overflow-wrap:normal}\n  button{padding:8px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;\n         color:var(--fg);font-size:14px;font-family:inherit;cursor:pointer}\n  button:hover{background:#f0f2f5}\n  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}\n  button.primary:hover{filter:brightness(1.08)}\n  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\n  .verdict{border-radius:8px;padding:14px 16px;font-size:16px;font-weight:600;margin-bottom:12px}\n  .verdict.good{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}\n  .verdict.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}\n  .verdict.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}\n  .verdict small{display:block;font-weight:400;font-size:13px;margin-top:4px}\n  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}\n  .stat{flex:1 1 150px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}\n  .stat .k{font-size:12px;color:var(--sub)}\n  .stat .v{font-size:18px;font-weight:600}\n  .stat .v .arw{color:var(--sub);font-weight:400;font-size:14px}\n  .stat.changed{border-color:var(--warn-line);background:var(--warn-bg)}\n  .stat.dropped{border-color:var(--bad-line);background:var(--bad-bg)}\n  .sec{border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:14px}\n  .sec h4{margin:0 0 6px;font-size:14px}\n  .sec ul{margin:0;padding-left:20px}\n  .sec li{margin:2px 0}\n  .sec.bad{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}\n  .sec.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}\n  .sec.info{background:var(--info-bg);border:1px solid var(--info-line);color:var(--info)}\n  .sec.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}\n  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;\n      overflow:auto;max-height:560px;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n      font-size:12px;line-height:1.55;margin:0;white-space:pre}\n  pre .del{background:#fdecec;color:#8a1c1c;display:block}\n  pre .add{background:#e8f6ed;color:#0f6b3f;display:block}\n  pre .chg{background:#eef3fe;color:#274b8a;display:block}\n  pre .same{display:block}\n  pre .skip{color:var(--sub);display:block;background:#e9ecf0}\n  .hide{display:none}\n  .note{font-size:12px;color:var(--sub);margin-top:8px}\n  .legend{font-size:12px;color:var(--sub);margin-bottom:8px}\n  .legend b.d{color:#8a1c1c}\n  .legend b.a{color:#0f6b3f}\n  .legend b.c{color:#274b8a}\n<\/style>\n\n<div class=\"wrap\">\n<h1>ツリー検査(修正前後の差分チェック)<\/h1>\n<p class=\"lead\">\n  検査に出す前のツリーと、AIが返してきた修正後のツリーを入れると、\n  <b>勘定科目コードが消えていないか・値が変わっていないか・ラベル名が勝手に変わっていないか<\/b>を照合します。\n  <b>ファイルはこのブラウザの中だけで処理され、どこにも送信されません<\/b>(通信は一切行いません)。\n<\/p>\n\n<div class=\"card\">\n  <h2>1. 2つのツリーを入れる<\/h2>\n  <div class=\"cols\">\n    <div class=\"col\">\n      <h3>元のツリー <small>(検査に出す前)<\/small><\/h3>\n      <div class=\"drop\" id=\"dropA\">\n        <b>ここにドラッグ&amp;ドロップ<\/b>\n        <span>またはクリックしてファイルを選ぶ / 下に貼り付け<\/span>\n        <input type=\"file\" id=\"fileA\" accept=\".md,.txt\" class=\"hide\">\n      <\/div>\n      <textarea id=\"taA\" placeholder=\"区分判定(1段目)&#10;├─ 資産&#10;│   ├─ 流動資産&#10;…\"><\/textarea>\n    <\/div>\n    <div class=\"col\">\n      <h3>修正後のツリー <small>(AIが返してきたもの)<\/small><\/h3>\n      <div class=\"drop\" id=\"dropB\">\n        <b>ここにドラッグ&amp;ドロップ<\/b>\n        <span>またはクリックしてファイルを選ぶ / 下に貼り付け<\/span>\n        <input type=\"file\" id=\"fileB\" accept=\".md,.txt\" class=\"hide\">\n      <\/div>\n      <textarea id=\"taB\" placeholder=\"AIの返事をそのまま貼ってもOK(説明文が混ざっていてもツリー部分だけ拾います)\"><\/textarea>\n    <\/div>\n  <\/div>\n  <div class=\"note\">\n    AIの返事に前置きや解説が混ざっていても、ツリーの部分だけを自動で拾います。\n    ```で囲まれたコードブロックのままでも大丈夫です。\n  <\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"run\">差分をチェックする<\/button>\n    <button id=\"clear\">入力を消す<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"resultCard\">\n  <h2>2. 検査結果<\/h2>\n  <div id=\"verdict\"><\/div>\n  <div id=\"stats\" class=\"stats\"><\/div>\n  <div id=\"secs\"><\/div>\n  <div class=\"btns\">\n    <button id=\"cp\">レポートをコピー<\/button>\n    <button id=\"dl\">レポートを保存<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"diffCard\">\n  <h2>3. 行ごとの差分<\/h2>\n  <div class=\"legend\">\n    <b class=\"d\">− 赤<\/b> = 元のツリーにあって修正後に無い行 /\n    <b class=\"a\">＋ 緑<\/b> = 修正後に増えた行 /\n    <b class=\"c\">≡ 青<\/b> = 定義文だけが変わった行 /\n    灰色 = 変わっていない行(長い場合は省略表示)\n  <\/div>\n  <div class=\"btns\" style=\"margin:0 0 10px\">\n    <button id=\"toggleAll\">変更のない行も全部表示する<\/button>\n  <\/div>\n  <pre id=\"diff\"><\/pre>\n<\/div>\n\n<div class=\"card\" id=\"mergeCard\">\n  <h2>4. 検査結果(7桁)を10桁ツリーへ反映する<\/h2>\n  <p class=\"lead\" style=\"margin:0 0 12px\">\n    検査は小さい<b>7桁ツリー<\/b>で行い、その結果(昇格・定義文)をここで<b>10桁ツリーへ機械的に反映<\/b>します。\n    コードと葉はすべて保存されます(照合結果を下に表示)。\n  <\/p>\n  <div class=\"cols\">\n    <div class=\"col\">\n      <h3>検査後の7桁ツリー <small>(上の「修正後のツリー」と同じもの)<\/small><\/h3>\n      <div class=\"drop\" id=\"dropM7\">\n        <b>ここにドラッグ&amp;ドロップ<\/b>\n        <span>またはクリックしてファイルを選ぶ / 下に貼り付け<\/span>\n        <input type=\"file\" id=\"fileM7\" accept=\".md,.txt\" class=\"hide\">\n      <\/div>\n      <textarea id=\"taM7\"><\/textarea>\n    <\/div>\n    <div class=\"col\">\n      <h3>元の10桁ツリー <small>(①で作ったもの)<\/small><\/h3>\n      <div class=\"drop\" id=\"dropM10\">\n        <b>ここにドラッグ&amp;ドロップ<\/b>\n        <span>またはクリックしてファイルを選ぶ / 下に貼り付け<\/span>\n        <input type=\"file\" id=\"fileM10\" accept=\".md,.txt\" class=\"hide\">\n      <\/div>\n      <textarea id=\"taM10\"><\/textarea>\n    <\/div>\n  <\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"runMerge\">10桁ツリーへ反映する<\/button>\n  <\/div>\n  <div id=\"mergeVerdict\"><\/div>\n  <div id=\"mergeReport\"><\/div>\n  <div class=\"btns hide\" id=\"mergeBtns\">\n    <button id=\"dlMerged\">反映後の10桁ツリーを保存<\/button>\n    <button id=\"cpMerged\">反映後の10桁ツリーをコピー<\/button>\n  <\/div>\n  <pre id=\"mergedOut\" class=\"hide\" style=\"margin-top:10px\"><\/pre>\n<\/div>\n\n<\/div>\n\n<script>\n\"use strict\";\n\n// ============================================================ ツリーのパース\nconst LINE_RE = /^((?:│   |    )*)(?:├─|└─) (.+)$/;\n\nfunction TNode(label){\n  this.label = label || \"\";\n  this.leaf = false; this.star = false; this.lock = false; this.code = null;\n  this.definition = \"\";\n  this.children = []; this.parent = null;\n}\nObject.defineProperty(TNode.prototype, \"isBranch\", {get: function(){ return this.children.length > 0; }});\nTNode.prototype.path = function(){\n  const out = [];\n  let n = this;\n  while(n.parent !== null){ out.push(n.label); n = n.parent; }\n  return out.reverse().join(\"/\");\n};\n\nfunction treeBlock(text){\n  // ```で囲まれている場合は「枝の行がいちばん多いブロック」をツリーとみなす\n  // (AIの返事に説明文が混ざっていても拾える)\n  if(text.indexOf(\"```\") < 0) return text;\n  const blocks = text.split(\"```\");\n  let best = blocks[0], bestN = -1;\n  for(const b of blocks){\n    let n = 0;\n    for(const l of b.split(\"\\n\")) if(LINE_RE.test(l.replace(/\\s+$/, \"\"))) n++;\n    if(n > bestN){ bestN = n; best = b; }\n  }\n  return best;\n}\n\nfunction normLine(raw){\n  // 定義文や注記を除いた「骨格」。定義を書き足しただけの行を「変更」と見なさないため\n  const m = LINE_RE.exec(raw);\n  if(!m) return raw;\n  let c = m[2];\n  const i = c.indexOf(\" …\");\n  if(i >= 0) c = c.slice(0, i);\n  const k = c.indexOf(\": \");\n  if(k >= 0) c = c.slice(0, k);\n  return m[1] + \"|\" + c.replace(/\\s+/g, \" \").trim();\n}\n\nfunction parse(text){\n  const tree = treeBlock(text);\n  const root = new TNode(\"(最上位)\");\n  const stack = [root];\n  const errors = [];\n  const lines = [];\n  for(let raw of tree.split(\"\\n\")){\n    raw = raw.replace(/\\s+$/, \"\");\n    const t = raw.replace(/^\\s+/, \"\");\n    if(!raw || !(t.indexOf(\"├─\") === 0 || t.indexOf(\"└─\") === 0 || t.indexOf(\"│\") === 0)) continue;\n    const m = LINE_RE.exec(raw);\n    if(!m){\n      errors.push(\"行の書式が読めません(字下げは半角スペース4つ単位): \" + JSON.stringify(raw));\n      continue;\n    }\n    lines.push(raw);\n    const depth = m[1].length / 4;\n    if(depth >= stack.length){\n      errors.push(\"インデントが飛んでいます: \" + JSON.stringify(raw));\n      continue;\n    }\n    let content = m[2];\n    const n = new TNode();\n    n.leaf = content.indexOf(\"◆ \") === 0;\n    if(n.leaf) content = content.slice(2);\n    const i = content.indexOf(\" …\");\n    if(i >= 0) content = content.slice(0, i);\n    const k = content.indexOf(\": \");\n    if(k >= 0){ n.definition = content.slice(k + 2).trim(); content = content.slice(0, k); }\n    const mc = / \\[(\\d+)\\]/.exec(content);\n    if(mc){ n.code = mc[1]; content = content.replace(mc[0], \"\"); }\n    else if(n.definition){\n      // 「ラベル: 定義 [1234]」のように定義文側にコードが紛れ込んでも拾う\n      const m2 = /\\s*\\[(\\d+)\\]\\s*$/.exec(n.definition) || /^\\[(\\d+)\\]\\s*/.exec(n.definition);\n      if(m2){\n        n.code = m2[1];\n        n.definition = (n.definition.slice(0, m2.index) + n.definition.slice(m2.index + m2[0].length)).trim();\n      }\n    }\n    if(content.indexOf(\"🔒\") >= 0){ n.lock = true; content = content.split(\"🔒\").join(\"\"); }\n    const j = content.indexOf(\"★\");\n    if(j >= 0){ n.star = true; content = content.slice(0, j); }\n    n.label = content.trim();\n    if(!n.label){ errors.push(\"ラベルが空の行があります: \" + JSON.stringify(raw)); continue; }\n    n.parent = stack[depth];\n    stack[depth].children.push(n);\n    stack.length = depth + 1;\n    stack.push(n);\n  }\n  return {root: root, errors: errors, lines: lines};\n}\n\nfunction all(n, out){\n  out = out || [];\n  for(const c of n.children){ out.push(c); all(c, out); }\n  return out;\n}\nfunction leavesOf(root){ return all(root).filter(n => !n.children.length); }\nfunction branchesOf(root){ return all(root).filter(n => n.children.length); }\n\n// ============================================================ 構造チェック\nfunction structureCheck(root){\n  const problems = [];\n  const branchNames = [];\n  (function walk(n, seven){\n    const stars = n.children.filter(c => c.star);\n    if(n.children.length && stars.length > 1)\n      problems.push(\"「\" + n.label + \"」の配下の ★(受け皿)が \" + stars.length + \"個あります。1つにしてください\");\n    for(const b of n.children.filter(c => c.isBranch)){\n      for(const c of n.children){\n        if(c !== b && !c.isBranch && c.label.indexOf(b.label) === 0)\n          problems.push(\"「\" + n.label + \"」の配下で名前が衝突します: 分岐「\" + b.label + \"」と葉「\" + c.label + \"」\");\n      }\n    }\n    for(const c of n.children){\n      if(c.leaf && c.children.length) problems.push(\"◆ の行に配下があります: \" + c.path());\n      if(c.label.indexOf(\"質問\") === 0) problems.push(\"「質問」で始まるラベルは使えません: \" + c.path());\n      if(c.isBranch) branchNames.push(c.label);\n      let s = seven;\n      if(c.code !== null){\n        if(c.code.length === 7){\n          if(s) problems.push(\"[7桁]の配下に再度[7桁]があります: \" + c.path());\n          s = c.code;\n        }else if(c.code.length === 3){\n          if(!s) problems.push(\"[3桁]の上位に[7桁]がありません: \" + c.path());\n        }else if(s && c.code.indexOf(s) !== 0){\n          problems.push(\"[7桁]の配下のコードは、[3桁]か、その7桁で始まるフルコードにしてください: \"\n                        + c.path() + \" [\" + c.code + \"]\");\n        }else if(!s && c.children.length){\n          problems.push(\"途中の段に付けるコードは[7桁]にしてください: \" + c.path() + \" [\" + c.code + \"]\");\n        }\n      }\n      walk(c, s);\n    }\n  })(root, null);\n  return problems;\n}\n\n// ============================================================ 前後の照合\nfunction codeMap(root){\n  const m = new Map();   // コード -> [{label, path}]\n  for(const n of all(root)) if(n.code !== null){\n    if(!m.has(n.code)) m.set(n.code, []);\n    m.get(n.code).push({label: n.label, path: n.path()});\n  }\n  return m;\n}\n\nfunction labelMap(root){\n  const m = new Map();   // ラベル -> [親のパス]\n  for(const n of all(root)){\n    const p = n.parent.path() || \"(最上位)\";\n    if(!m.has(n.label)) m.set(n.label, []);\n    m.get(n.label).push(p);\n  }\n  return m;\n}\n\nfunction defMap(root){\n  const m = new Map();\n  for(const n of all(root)) m.set(n.path(), n.definition || \"\");\n  return m;\n}\n\nfunction lev(a, b){\n  if(a === b) return 0;\n  if(a.length > 40 || b.length > 40) return Math.abs(a.length - b.length) + 99;\n  let prev = [];\n  for(let j = 0; j <= b.length; j++) prev.push(j);\n  for(let i = 1; i <= a.length; i++){\n    const cur = [i];\n    for(let j = 1; j <= b.length; j++){\n      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));\n    }\n    prev = cur;\n  }\n  return prev[b.length];\n}\n\nfunction similar(a, b){\n  if(a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;\n  const d = lev(a, b);\n  return d <= Math.max(1, Math.floor(Math.max(a.length, b.length) * 0.34));\n}\n\nfunction compare(A, B){\n  const bad = [], warn = [], info = [];\n\n  // ---- コードの照合(いちばん大事)\n  const ca = codeMap(A.root), cb = codeMap(B.root);\n  const lost = [], added = [], relabeled = [];\n  for(const [code, xs] of ca){\n    if(!cb.has(code)){ lost.push({code: code, label: xs[0].label, path: xs[0].path}); continue; }\n    const before = xs.map(x => x.label).join(\"・\");\n    const after = cb.get(code).map(x => x.label).join(\"・\");\n    if(before !== after) relabeled.push({code: code, before: before, after: after});\n  }\n  for(const [code, xs] of cb) if(!ca.has(code)) added.push({code: code, label: xs[0].label, path: xs[0].path});\n\n  if(lost.length)\n    bad.push({t: \"勘定科目コードが \" + lost.length + \"個 消えています(検査でコードを消してはいけません)\",\n              items: lost.slice(0, 30).map(x => \"[\" + x.code + \"] \" + x.label + \"  (元の位置: \" + x.path + \")\"),\n              more: lost.length - 30});\n  if(relabeled.length)\n    bad.push({t: \"同じコードなのにラベル名が変わっています \" + relabeled.length + \"件(コードとラベルの対応が崩れます)\",\n              items: relabeled.slice(0, 30).map(x => \"[\" + x.code + \"] 「\" + x.before + \"」 → 「\" + x.after + \"」\"),\n              more: relabeled.length - 30});\n  if(added.length)\n    warn.push({t: \"元のツリーに無いコードが \" + added.length + \"個 増えています(AIが数字を作った可能性)\",\n               items: added.slice(0, 30).map(x => \"[\" + x.code + \"] \" + x.label + \"  (位置: \" + x.path + \")\"),\n               more: added.length - 30});\n\n  // ---- ラベルの照合\n  const la = labelMap(A.root), lb = labelMap(B.root);\n  const removedLabels = [], addedLabels = [], moved = [];\n  for(const [label, parents] of lb){\n    if(!la.has(label)) addedLabels.push(label);\n    else if(parents.slice().sort().join(\"\u0001\") !== la.get(label).slice().sort().join(\"\u0001\"))\n      moved.push({label: label, before: la.get(label), after: parents});\n  }\n  for(const label of la.keys()) if(!lb.has(label)) removedLabels.push(label);\n\n  // 消えたラベルと増えたラベルが似ていれば「名前の書き換え」とみなす\n  const renamed = [], usedAdd = new Set();\n  const trulyRemoved = [];\n  for(const r of removedLabels){\n    let hit = null;\n    for(const a of addedLabels){\n      if(usedAdd.has(a)) continue;\n      if(similar(r, a)){ hit = a; break; }\n    }\n    if(hit){ usedAdd.add(hit); renamed.push([r, hit]); }\n    else trulyRemoved.push(r);\n  }\n  const trulyAdded = addedLabels.filter(a => !usedAdd.has(a));\n\n  if(trulyRemoved.length)\n    bad.push({t: \"ラベルが \" + trulyRemoved.length + \"個 消えています(検査で行を減らしてはいけません)\",\n              items: trulyRemoved.slice(0, 30).map(x => \"「\" + x + \"」  (元の位置: \"\n                     + la.get(x).map(p => p).join(\"」「\") + \" の配下)\"),\n              more: trulyRemoved.length - 30});\n  if(renamed.length)\n    warn.push({t: \"ラベル名が書き換えられています \" + renamed.length + \"件(名前は変えない約束です)\",\n               items: renamed.slice(0, 30).map(p => \"「\" + p[0] + \"」 → 「\" + p[1] + \"」\"),\n               more: renamed.length - 30});\n  if(trulyAdded.length)\n    warn.push({t: \"元のツリーに無いラベルが \" + trulyAdded.length + \"個 増えています\",\n               items: trulyAdded.slice(0, 30).map(x => \"「\" + x + \"」  (位置: \"\n                      + lb.get(x).join(\"」「\") + \" の配下)\"),\n               more: trulyAdded.length - 30});\n\n  // 統合の疑い: 消えたラベルが、修正後の別ラベルの中に文字列として含まれている\n  const mergedInto = [];\n  const afterLabels = Array.from(lb.keys());\n  for(const r of trulyRemoved){\n    for(const a of afterLabels){\n      if(a !== r && a.indexOf(r) >= 0){ mergedInto.push([r, a]); break; }\n    }\n  }\n  if(mergedInto.length)\n    bad.push({t: \"似た項目に統合された疑いがあります \" + mergedInto.length + \"件(統合は禁止・別項目のまま残してください)\",\n              items: mergedInto.slice(0, 20).map(p => \"「\" + p[0] + \"」 が 「\" + p[1] + \"」 に吸収されている可能性\"),\n              more: mergedInto.length - 20});\n\n  // ---- 定義文の増減(検査の主目的のひとつ)\n  const da = defMap(A.root), db = defMap(B.root);\n  let defAdded = 0;\n  const defLost = [], defChanged = [];\n  for(const [p, d] of db){\n    if(!da.has(p)) continue;\n    const was = da.get(p);\n    if(!was && d) defAdded++;\n    else if(was && !d) defLost.push(p);\n    else if(was && d && was !== d) defChanged.push(p);\n  }\n  if(defLost.length)\n    warn.push({t: \"定義文が \" + defLost.length + \"件 消えています(元からあった定義は残してください)\",\n               items: defLost.slice(0, 20), more: defLost.length - 20});\n  if(defChanged.length)\n    info.push({t: \"定義文が書き換えられたラベル \" + defChanged.length + \"件(意図した書き分けか確認してください)\",\n               items: defChanged.slice(0, 20), more: defChanged.length - 20});\n  if(defAdded)\n    info.push({t: \"定義文が \" + defAdded + \"件 追記されました(これが検査の成果です)\", items: [], more: 0});\n  const noDef = Array.from(db.values()).filter(d => !d).length;\n  if(noDef)\n    info.push({t: \"定義文が付いていないラベルが \" + noDef + \"個 あります\"\n               + \"(ラベル名だけで判定させると精度が落ちます。②で定義を書かせてください)\",\n               items: [], more: 0});\n\n  if(moved.length)\n    info.push({t: \"位置が変わったラベル \" + moved.length + \"件(これが検査の成果です。意図どおりか確認してください)\",\n               items: moved.slice(0, 40).map(m => \"「\" + m.label + \"」: 「\" + m.before.join(\"」「\")\n                      + \"」の配下 → 「\" + m.after.join(\"」「\") + \"」の配下\"),\n               more: moved.length - 40});\n\n  return {bad: bad, warn: warn, info: info, noDef: noDef,\n          counts: {\n            leafA: leavesOf(A.root).length, leafB: leavesOf(B.root).length,\n            brA: branchesOf(A.root).length, brB: branchesOf(B.root).length,\n            codeA: all(A.root).filter(n => n.code !== null).length,\n            codeB: all(B.root).filter(n => n.code !== null).length,\n            uniqA: ca.size, uniqB: cb.size\n          }};\n}\n\n// ============================================================ 行の差分(LCS)\nfunction diffLines(rawA, rawB){\n  const a = rawA.map(normLine), b = rawB.map(normLine);\n  const n = a.length, m = b.length;\n  // 大きすぎる場合の保険\n  if(n * m > 4000000) return null;\n  const dp = [];\n  for(let i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));\n  for(let i = n - 1; i >= 0; i--){\n    for(let j = m - 1; j >= 0; j--){\n      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);\n    }\n  }\n  const out = [];\n  let i = 0, j = 0;\n  while(i < n && j < m){\n    if(a[i] === b[j]){\n      out.push([rawA[i] === rawB[j] ? \"=\" : \"~\", rawB[j]]);\n      i++; j++;\n    }\n    else if(dp[i + 1][j] >= dp[i][j + 1]){ out.push([\"-\", rawA[i]]); i++; }\n    else { out.push([\"+\", rawB[j]]); j++; }\n  }\n  while(i < n){ out.push([\"-\", rawA[i]]); i++; }\n  while(j < m){ out.push([\"+\", rawB[j]]); j++; }\n  return out;\n}\n\n// ============================================================ 反映(7桁の検査結果 → 10桁ツリー)\nfunction treeTitleOf(text){\n  for(let line of treeBlock(text).split(\"\\n\")){\n    line = line.trim();\n    if(/^.+(1段目)$/.test(line)) return line;\n  }\n  return \"区分判定(1段目)\";\n}\n\nfunction copySubtree(n){\n  const c = new TNode(n.label);\n  c.leaf = n.leaf; c.star = n.star; c.lock = n.lock;\n  c.code = n.code; c.definition = n.definition;\n  for(const ch of n.children){\n    const cc = copySubtree(ch);\n    cc.parent = c;\n    c.children.push(cc);\n  }\n  return c;\n}\n\nfunction labelPathOf(n){\n  const out = [];\n  while(n !== null && n.parent !== null){ out.push(n.label); n = n.parent; }\n  return out.reverse();\n}\n\nfunction mergeApply(bRoot, aRoot){\n  const aCodes = [];\n  (function collect(n){\n    if(n.code) aCodes.push(n.code);\n    for(const c of n.children) collect(c);\n  })(aRoot);\n  if(!aCodes.length) throw Err(\"元のツリーにコードがありません(反映には ①が出力した10桁ツリーを使ってください)\");\n  const bLens = new Set();\n  (function blens(n){\n    if(n.code) bLens.add(n.code.length);\n    for(const c of n.children) blens(c);\n  })(bRoot);\n  if(!bLens.size) throw Err(\"検査後のツリーにコードがありません(反映には [コード] 付きのツリーが必要です)\");\n  const maxL = Math.max.apply(null, Array.from(bLens));\n  if(aCodes.some(c => c.length < maxL))\n    throw Err(\"元のツリー側にコードの短い行があります。反映機能は「葉に完全なコード」を持つツリー(①の出力する10桁ツリー)を元にしてください\");\n\n  const memo = new Map();\n  function prefset(n, L){\n    const key = String(L);\n    let m = memo.get(n);\n    if(!m){ m = {}; memo.set(n, m); }\n    if(m[key]) return m[key];\n    const out = new Set();\n    if(n.code && n.code.length >= L) out.add(n.code.slice(0, L));\n    for(const c of n.children) for(const x of prefset(c, L)) out.add(x);\n    m[key] = out;\n    return out;\n  }\n  const anchorMaps = {};\n  for(const L of bLens){\n    const out = {};\n    for(const c of aRoot.children){\n      (function walk(n, covered){\n        let here = covered;\n        if(!covered){\n          const ps = prefset(n, L);\n          if(ps.size === 1){\n            const P = Array.from(ps)[0];\n            (out[P] = out[P] || []).push(n);\n            here = true;\n          }\n        }\n        for(const cc of n.children) walk(cc, here);\n      })(c, false);\n    }\n    anchorMaps[L] = out;\n  }\n\n  const aDefs = {};\n  (function cdefs(n, path){\n    for(const c of n.children){\n      const key = path.concat([c.label]).join(\"\\u0000\");\n      if(c.definition) aDefs[key] = c.definition;\n      cdefs(c, path.concat([c.label]));\n    }\n  })(aRoot, []);\n\n  const report = {defs: 0, moves: [], notes: [], multi: []};\n  const used = new Set();\n  const newRoot = new TNode(aRoot.label);\n\n  function conv(bnode, parentNew, bpath){\n    if(bnode.code && !bnode.children.length){\n      const amap = anchorMaps[bnode.code.length] || {};\n      const targets = (amap[bnode.code] || []).filter(t => !used.has(t));\n      if(!targets.length){\n        report.notes.push(\"コード [\" + bnode.code + \"](\" + bnode.label\n                          + \")に対応する枝が元のツリーに見つかりません(そのまま新しい葉として置きます)\");\n        const nn = copySubtree(bnode);\n        nn.parent = parentNew;\n        parentNew.children.push(nn);\n        return;\n      }\n      if(targets.length > 1)\n        report.multi.push(\"[\" + bnode.code + \"] \" + bnode.label + \" … 同じコードの枝が\"\n                          + targets.length + \"箇所あり、全部を同じ場所へ移します\");\n      for(const t of targets){\n        used.add(t);\n        const oldParent = labelPathOf(t).slice(0, -1);\n        if(oldParent.join(\"\\u0000\") !== bpath.join(\"\\u0000\"))\n          report.moves.push(\"「\" + t.label + \"」: 「\" + (oldParent.join(\"/\") || \"(最上位)\")\n                            + \"」の配下 → 「\" + (bpath.join(\"/\") || \"(最上位)\") + \"」の配下\");\n        const nn = copySubtree(t);\n        if(bnode.definition){ nn.definition = bnode.definition; report.defs++; }\n        if(bnode.star) nn.star = true;\n        nn.parent = parentNew;\n        parentNew.children.push(nn);\n      }\n      return;\n    }\n    if(bnode.code && bnode.children.length)\n      report.notes.push(\"「\" + bnode.label + \"」はコードと配下の両方を持つため、枝として扱います\");\n    const nn = new TNode(bnode.label);\n    nn.star = bnode.star; nn.lock = bnode.lock;\n    nn.definition = bnode.definition || aDefs[bpath.concat([bnode.label]).join(\"\\u0000\")] || \"\";\n    if(bnode.definition) report.defs++;\n    nn.parent = parentNew;\n    parentNew.children.push(nn);\n    for(const c of bnode.children) conv(c, nn, bpath.concat([bnode.label]));\n  }\n  for(const c of bRoot.children) conv(c, newRoot, []);\n\n  for(const L of Object.keys(anchorMaps)){\n    const amap = anchorMaps[L];\n    for(const P of Object.keys(amap).sort()){\n      for(const t of amap[P]){\n        if(used.has(t)) continue;\n        used.add(t);\n        const chain = labelPathOf(t).slice(0, -1);\n        let cur = newRoot;\n        for(const lab of chain){\n          const nxt = cur.children.find(c => c.label === lab);\n          if(!nxt) break;\n          cur = nxt;\n        }\n        const nn = copySubtree(t);\n        nn.parent = cur;\n        cur.children.push(nn);\n        report.notes.push(\"「\" + t.label + \"」は検査後のツリーに無かったため、元の位置(\"\n                          + (chain.join(\"/\") || \"最上位\") + \")に残しました\");\n      }\n    }\n  }\n  return {root: newRoot, report: report};\n}\n\nfunction renderTree(root, titleLine){\n  const lines = [titleLine];\n  function fmt(n){\n    let s = n.label;\n    if(n.lock) s += \" 🔒\";\n    if(n.star) s += \" ★\";\n    if(n.code) s += \" [\" + n.code + \"]\";\n    if(n.definition) s += \": \" + n.definition;\n    return s;\n  }\n  (function walk(n, prefix){\n    n.children.forEach(function(c, i){\n      const last = i === n.children.length - 1;\n      lines.push(prefix + (last ? \"└─ \" : \"├─ \") + fmt(c));\n      walk(c, prefix + (last ? \"    \" : \"│   \"));\n    });\n  })(root, \"\");\n  return lines.join(\"\\n\") + \"\\n\";\n}\n\nfunction codesSorted(root){\n  const out = [];\n  for(const n of all(root)) if(n.code) out.push(n.code);\n  return out.sort();\n}\n\n// ============================================================ 画面\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\");\nlet REPORT = \"\", DIFF = null, SHOW_ALL = false;\n\nfunction show(id, on){ $(id).classList.toggle(\"hide\", !on); }\n\nfunction statHtml(k, a, b){\n  const cls = a === b ? \"\" : (b < a ? \" dropped\" : \" changed\");\n  const v = a === b ? String(a) : (a + ' <span class=\"arw\">→<\/span> ' + b);\n  return '<div class=\"stat' + cls + '\"><div class=\"k\">' + k + '<\/div><div class=\"v\">' + v + \"<\/div><\/div>\";\n}\n\nfunction secHtml(kind, list){\n  let h = \"\";\n  for(const s of list){\n    h += '<div class=\"sec ' + kind + '\"><h4>' + esc(s.t) + \"<\/h4><ul>\";\n    for(const it of s.items) h += \"<li>\" + esc(it) + \"<\/li>\";\n    if(s.more > 0) h += \"<li>…ほか \" + s.more + \"件<\/li>\";\n    h += \"<\/ul><\/div>\";\n  }\n  return h;\n}\n\nfunction textReport(r, structA, structB){\n  const c = r.counts, L = [];\n  L.push(\"■ 数の比較(元 → 修正後)\");\n  L.push(\"  最終ラベル \" + c.leafA + \" → \" + c.leafB\n         + \" / 判定の段 \" + c.brA + \" → \" + c.brB\n         + \" / コード \" + c.codeA + \" → \" + c.codeB + \"(種類 \" + c.uniqA + \" → \" + c.uniqB + \")\");\n  const groups = [[\"重大\", r.bad], [\"注意\", r.warn], [\"参考\", r.info]];\n  for(const g of groups){\n    for(const s of g[1]){\n      L.push(\"\");\n      L.push(\"【\" + g[0] + \"】\" + s.t);\n      for(const it of s.items) L.push(\"  ・\" + it);\n      if(s.more > 0) L.push(\"  …ほか \" + s.more + \"件\");\n    }\n  }\n  if(structB.length){\n    L.push(\"\");\n    L.push(\"【重大】修正後のツリー自体の構造に問題があります \" + structB.length + \"件\");\n    for(const p of structB) L.push(\"  ・\" + p);\n  }\n  if(structA.length){\n    L.push(\"\");\n    L.push(\"(参考)元のツリーにも構造の問題が \" + structA.length + \"件ありました\");\n    for(const p of structA) L.push(\"  ・\" + p);\n  }\n  return L.join(\"\\n\");\n}\n\nfunction renderDiff(){\n  if(!DIFF){ $(\"diff\").textContent = \"(差分が大きすぎるため表示を省略しました)\"; return; }\n  const keep = new Set();\n  if(!SHOW_ALL){\n    DIFF.forEach(function(d, i){\n      if(d[0] !== \"=\"){ for(let k = i - 2; k <= i + 2; k++) keep.add(k); }\n    });\n  }\n  let h = \"\", skipped = 0;\n  DIFF.forEach(function(d, i){\n    if(!SHOW_ALL && d[0] === \"=\" && !keep.has(i)){ skipped++; return; }\n    if(skipped){ h += '<span class=\"skip\">   … 変更のない ' + skipped + \"行 …<\/span>\"; skipped = 0; }\n    const mark = d[0] === \"-\" ? \"− \" : (d[0] === \"+\" ? \"＋ \" : (d[0] === \"~\" ? \"≡ \" : \"  \"));\n    const cls = d[0] === \"-\" ? \"del\" : (d[0] === \"+\" ? \"add\" : (d[0] === \"~\" ? \"chg\" : \"same\"));\n    h += '<span class=\"' + cls + '\">' + esc(mark + d[1]) + \"<\/span>\";\n  });\n  if(skipped) h += '<span class=\"skip\">   … 変更のない ' + skipped + \"行 …<\/span>\";\n  $(\"diff\").innerHTML = h || \"(差分はありません)\";\n  $(\"toggleAll\").textContent = SHOW_ALL ? \"変更のあった行だけ表示する\" : \"変更のない行も全部表示する\";\n}\n\nfunction run(){\n  const ta = $(\"taA\").value, tb = $(\"taB\").value;\n  show(\"resultCard\", true);\n  if(!ta.trim() || !tb.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">2つのツリーを両方とも入れてください<\/div>';\n    $(\"stats\").innerHTML = \"\"; $(\"secs\").innerHTML = \"\";\n    show(\"diffCard\", false);\n    REPORT = \"\";\n    return;\n  }\n  const A = parse(ta), B = parse(tb);\n  const structA = A.errors.concat(structureCheck(A.root));\n  const structB = B.errors.concat(structureCheck(B.root));\n  const r = compare(A, B);\n\n  const c = r.counts;\n  $(\"stats\").innerHTML = statHtml(\"最終ラベル\", c.leafA, c.leafB)\n    + statHtml(\"判定の段\", c.brA, c.brB)\n    + statHtml(\"コードの数\", c.codeA, c.codeB)\n    + statHtml(\"コードの種類\", c.uniqA, c.uniqB);\n\n  let secs = secHtml(\"bad\", r.bad);\n  if(structB.length)\n    secs += secHtml(\"bad\", [{t: \"修正後のツリー自体の構造に問題があります \" + structB.length + \"件\",\n                             items: structB.slice(0, 30), more: structB.length - 30}]);\n  secs += secHtml(\"warn\", r.warn);\n  secs += secHtml(\"info\", r.info);\n  if(structA.length)\n    secs += secHtml(\"info\", [{t: \"(参考)元のツリーにも構造の問題が \" + structA.length + \"件ありました\",\n                              items: structA.slice(0, 20), more: structA.length - 20}]);\n  const nBad = r.bad.length + (structB.length ? 1 : 0);\n  const nWarn = r.warn.length;\n  if(!nBad && !nWarn && !r.info.length)\n    secs += '<div class=\"sec ok\"><h4>違いはありませんでした<\/h4>'\n          + \"<ul><li>2つのツリーは(記号や定義文を除いて)同じ内容です。<\/li><\/ul><\/div>\";\n  $(\"secs\").innerHTML = secs;\n\n  const defNote = r.noDef ? \"　定義文が \" + r.noDef + \"個 未記入です(精度を上げるには②で定義を書かせてください)。\" : \"\";\n  let v;\n  if(nBad) v = '<div class=\"verdict bad\">そのまま使わないでください（重大な指摘 ' + nBad\n             + \"件）<small>コードやラベルが失われている可能性があります。下の内容をAIに戻して直してもらってください。\"\n             + defNote + \"<\/small><\/div>\";\n  else if(nWarn) v = '<div class=\"verdict warn\">確認してから使ってください（注意 ' + nWarn\n             + \"件）<small>名前の書き換えや項目の増減があります。意図した変更かどうか目で確かめてください。\"\n             + defNote + \"<\/small><\/div>\";\n  else v = '<div class=\"verdict good\">そのまま使えます<small>コードもラベルも失われていません'\n         + (r.info.length ? \"(位置の変更や定義の追記は検査の成果です)。\" : \"。\") + defNote + \"<\/small><\/div>\";\n  $(\"verdict\").innerHTML = v;\n\n  REPORT = textReport(r, structA, structB);\n  DIFF = diffLines(A.lines, B.lines);\n  SHOW_ALL = false;\n  show(\"diffCard\", true);\n  renderDiff();\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/plain;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const t = document.createElement(\"textarea\");\n  t.value = text;\n  document.body.appendChild(t);\n  t.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(t);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\nfunction wire(dropId, fileId, taId){\n  const drop = $(dropId);\n  const load = async f => {\n    $(taId).value = await f.text();\n    drop.querySelector(\"b\").textContent = f.name;\n  };\n  drop.onclick = () => $(fileId).click();\n  $(fileId).onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n  drop.ondragover = e => { e.preventDefault(); drop.classList.add(\"hot\"); };\n  drop.ondragleave = () => drop.classList.remove(\"hot\");\n  drop.ondrop = e => {\n    e.preventDefault();\n    drop.classList.remove(\"hot\");\n    if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n  };\n}\nwire(\"dropA\", \"fileA\", \"taA\");\nwire(\"dropB\", \"fileB\", \"taB\");\nwire(\"dropM7\", \"fileM7\", \"taM7\");\nwire(\"dropM10\", \"fileM10\", \"taM10\");\n\nlet MERGED = \"\";\n$(\"runMerge\").onclick = () => {\n  const b7 = $(\"taM7\").value, a10 = $(\"taM10\").value;\n  const V = $(\"mergeVerdict\"), R = $(\"mergeReport\");\n  MERGED = \"\";\n  $(\"mergeBtns\").classList.add(\"hide\");\n  $(\"mergedOut\").classList.add(\"hide\");\n  if(!b7.trim() || !a10.trim()){\n    V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">2つのツリーを両方とも入れてください<\/div>';\n    R.innerHTML = \"\";\n    return;\n  }\n  try{\n    const B = parse(b7), A = parse(a10);\n    const r = mergeApply(B.root, A.root);\n    const ca = codesSorted(A.root), cm = codesSorted(r.root);\n    const ok = ca.join(\",\") === cm.join(\",\");\n    MERGED = renderTree(r.root, treeTitleOf(a10));\n    const rep = r.report;\n    let h = \"\";\n    const sec = (cls, title, items) => items.length\n      ? '<div class=\"sec ' + cls + '\"><h4>' + esc(title) + \"<\/h4><ul>\"\n        + items.slice(0, 30).map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\")\n        + (items.length > 30 ? \"<li>…ほか \" + (items.length - 30) + \"件<\/li>\" : \"\") + \"<\/ul><\/div>\"\n      : \"\";\n    if(ok)\n      V.innerHTML = '<div class=\"verdict good\" style=\"margin-top:12px\">反映しました'\n        + \"<small>コード \" + cm.length + \"個がすべて保存されています。定義文 \"\n        + rep.defs + \"件を反映しました。<\/small><\/div>\";\n    else\n      V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">反映でコードが変化しました('\n        + ca.length + \"個 → \" + cm.length + \"個)<small>この出力は使わないでください。入れたツリーの組み合わせを確認してください。<\/small><\/div>\";\n    h += sec(\"info\", \"移動した枝(検査の成果)\", rep.moves);\n    h += sec(\"info\", \"同じコードが複数箇所にある枝\", rep.multi);\n    h += sec(\"warn\", \"注意\", rep.notes);\n    R.innerHTML = h;\n    if(ok){\n      $(\"mergeBtns\").classList.remove(\"hide\");\n      $(\"mergedOut\").classList.remove(\"hide\");\n      $(\"mergedOut\").textContent = MERGED;\n    }\n  }catch(e){\n    V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">反映できませんでした<small>'\n      + esc(e.message) + \"<\/small><\/div>\";\n    R.innerHTML = \"\";\n  }\n};\n$(\"dlMerged\").onclick = () => MERGED && save(MERGED, \"tree-10digit-merged.md\");\n$(\"cpMerged\").onclick = e => MERGED && copy(MERGED, e.target);\n\n$(\"run\").onclick = run;\n$(\"clear\").onclick = () => {\n  $(\"taA\").value = \"\"; $(\"taB\").value = \"\";\n  show(\"resultCard\", false); show(\"diffCard\", false);\n};\n$(\"toggleAll\").onclick = () => { SHOW_ALL = !SHOW_ALL; renderDiff(); };\n$(\"cp\").onclick = e => REPORT && copy(REPORT, e.target);\n$(\"dl\").onclick = () => REPORT && save(REPORT, \"tree-check-report.txt\");\n<\/script>\n"}, {"name": "③ ツリーからDify", "hint": "分類ツリーから、Difyにインポートする DSL(YAML)を作ります。", "html": "<title>ツリーからDifyワークフロー<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{\n    --bg:#f6f7f9; --fg:#1b1d20; --sub:#5b6169; --line:#d8dce1; --card:#ffffff;\n    --accent:#2f6fed; --accent-fg:#ffffff; --warn:#8a4b00; --warn-bg:#fff5e6;\n    --ok:#0f6b3f; --ok-bg:#eaf7f0; --code-bg:#f2f4f7;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:24px 16px 80px;background:var(--bg);color:var(--fg);\n       font-family:\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;line-height:1.7}\n  .wrap{max-width:1040px;margin:0 auto}\n  h1{font-size:22px;margin:0 0 4px}\n  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}\n  .card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n  #drop{border:2px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;\n        background:var(--card);cursor:pointer;transition:.15s;margin-bottom:12px}\n  #drop.hot{border-color:var(--accent);background:#eef3fe}\n  #drop b{display:block;font-size:15px;margin-bottom:2px}\n  #drop span{color:var(--sub);font-size:13px}\n  textarea{width:100%;height:240px;padding:10px;border:1px solid var(--line);border-radius:6px;\n           font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;font-size:13px;\n           line-height:1.5;background:#fff;color:var(--fg);white-space:pre;overflow-wrap:normal}\n  button{padding:8px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;\n         color:var(--fg);font-size:14px;font-family:inherit;cursor:pointer}\n  button:hover{background:#f0f2f5}\n  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}\n  button.primary:hover{filter:brightness(1.08)}\n  button:disabled{opacity:.5;cursor:not-allowed}\n  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\n  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;\n      overflow:auto;max-height:520px;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n      font-size:12px;line-height:1.5;margin:0;white-space:pre}\n  .log{white-space:pre-wrap;font-size:13px}\n  .warn{background:var(--warn-bg);border:1px solid #f0d6a8;color:var(--warn);\n        border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .ok{background:var(--ok-bg);border:1px solid #b8e0cb;color:var(--ok);\n      border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .warn ul,.ok ul{margin:6px 0 0;padding-left:20px}\n  .hide{display:none}\n  .note{font-size:12px;color:var(--sub);margin-top:8px}\n<\/style>\n\n<div class=\"wrap\">\n<h1>分類ツリーから Dify ワークフローを作る<\/h1>\n<p class=\"lead\">\n  分類ツリー(.md)を貼るか落とすと、Difyにインポートできる DSL(YAML)を作ります。\n  <b>ファイルはこのブラウザの中だけで処理され、どこにも送信されません<\/b>(通信は一切行いません)。\n<\/p>\n\n<div class=\"card\">\n  <h2>1. 分類ツリーを入れる<\/h2>\n  <div id=\"drop\">\n    <b>ここに分類ツリー(.md / .txt)をドラッグ&amp;ドロップ<\/b>\n    <span>またはクリックしてファイルを選ぶ / 下の欄に直接貼り付けてもOK<\/span>\n    <input type=\"file\" id=\"file\" accept=\".md,.txt\" class=\"hide\">\n  <\/div>\n  <textarea id=\"tree\" placeholder=\"区分判定(1段目)&#10;├─ 資産&#10;│   ├─ 流動資産&#10;│   │   ├─ 現金&#10;…\"><\/textarea>\n  <div class=\"note\">\n    「Excelからツリー.html」で作ったツリー、または検査後のツリーをそのまま貼ってください\n    (```で囲まれたコードブロックが入っていても、そのまま貼って大丈夫です)。\n  <\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"run\">DSLを作る<\/button>\n    <button id=\"clear\">入力を消す<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"resultCard\">\n  <h2>2. 結果<\/h2>\n  <div id=\"summary\" class=\"log\"><\/div>\n  <div id=\"checks\"><\/div>\n  <div class=\"btns\">\n    <button id=\"dl\">DSL(YAML)を保存<\/button>\n    <button id=\"cp\">DSLをコピー<\/button>\n  <\/div>\n  <div class=\"note\">\n    次: Dify の「アプリを作成 → DSLファイルをインポート」で取り込んでください。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"canvasCard\">\n  <h2>3. Difyでの見え方(オーケストレーション)<\/h2>\n  <div class=\"btns\" style=\"margin:0 0 10px\">\n    <button id=\"zoomOut\">縮小<\/button>\n    <button id=\"zoomIn\">拡大<\/button>\n    <button id=\"zoomFit\">全体を表示<\/button>\n    <button id=\"dlsvg\">図を保存(SVG)<\/button>\n    <span class=\"note\" id=\"canvasInfo\" style=\"margin:0 0 0 8px;align-self:center\"><\/span>\n  <\/div>\n  <div id=\"canvas\" style=\"overflow:auto;max-height:70vh;border:1px solid var(--line);\n       border-radius:6px;background:#f7f8fa\"><\/div>\n  <div class=\"note\">\n    この図はDSLに書かれたノードの座標をそのまま描いたものです。Difyに取り込むと同じ配置で表示されます\n    (図の生成もこのブラウザの中だけで行っています)。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"yamlCard\">\n  <h2>3. できたDSL<\/h2>\n  <pre id=\"yaml\"><\/pre>\n<\/div>\n\n<\/div>\n\n<scri
