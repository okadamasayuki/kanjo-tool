 + c.brA + \" → \" + c.brB\n         + \" / コード \" + c.codeA + \" → \" + c.codeB + \"(種類 \" + c.uniqA + \" → \" + c.uniqB + \")\");\n  const groups = [[\"重大\", r.bad], [\"注意\", r.warn], [\"参考\", r.info]];\n  for(const g of groups){\n    for(const s of g[1]){\n      L.push(\"\");\n      L.push(\"【\" + g[0] + \"】\" + s.t);\n      for(const it of s.items) L.push(\"  ・\" + it);\n      if(s.more > 0) L.push(\"  …ほか \" + s.more + \"件\");\n    }\n  }\n  if(structB.length){\n    L.push(\"\");\n    L.push(\"【重大】修正後のツリー自体の構造に問題があります \" + structB.length + \"件\");\n    for(const p of structB) L.push(\"  ・\" + p);\n  }\n  if(structA.length){\n    L.push(\"\");\n    L.push(\"(参考)元のツリーにも構造の問題が \" + structA.length + \"件ありました\");\n    for(const p of structA) L.push(\"  ・\" + p);\n  }\n  return L.join(\"\\n\");\n}\n\nfunction renderDiff(){\n  if(!DIFF){ $(\"diff\").textContent = \"(差分が大きすぎるため表示を省略しました)\"; return; }\n  const keep = new Set();\n  if(!SHOW_ALL){\n    DIFF.forEach(function(d, i){\n      if(d[0] !== \"=\"){ for(let k = i - 2; k <= i + 2; k++) keep.add(k); }\n    });\n  }\n  let h = \"\", skipped = 0;\n  DIFF.forEach(function(d, i){\n    if(!SHOW_ALL && d[0] === \"=\" && !keep.has(i)){ skipped++; return; }\n    if(skipped){ h += '<span class=\"skip\">   … 変更のない ' + skipped + \"行 …<\/span>\"; skipped = 0; }\n    const mark = d[0] === \"-\" ? \"− \" : (d[0] === \"+\" ? \"＋ \" : (d[0] === \"~\" ? \"≡ \" : \"  \"));\n    const cls = d[0] === \"-\" ? \"del\" : (d[0] === \"+\" ? \"add\" : (d[0] === \"~\" ? \"chg\" : \"same\"));\n    h += '<span class=\"' + cls + '\">' + esc(mark + d[1]) + \"<\/span>\";\n  });\n  if(skipped) h += '<span class=\"skip\">   … 変更のない ' + skipped + \"行 …<\/span>\";\n  $(\"diff\").innerHTML = h || \"(差分はありません)\";\n  $(\"toggleAll\").textContent = SHOW_ALL ? \"変更のあった行だけ表示する\" : \"変更のない行も全部表示する\";\n}\n\nlet OPS_TREE = \"\";\n\nfunction treeLineCount(text){\n  let n = 0;\n  for(const l of (text || \"\").split(\"\\n\")) if(LINE_RE.test(l.replace(/\\s+$/, \"\"))) n++;\n  return n;\n}\n\nfunction runOps(ta, tb){\n  const A = parse(ta);\n  const {ops, notes, bad, replies, minority} = voteOps(tb);\n  const nCode0 = all(A.root).filter(n => n.code).length;\n  const nLeaf0 = leavesOf(A.root).length;\n  const r = applyOps(A.root, ops);\n  const nCode1 = all(A.root).filter(n => n.code).length;\n  const errs = A.errors.concat(bad.map(x => \"指示の形をしていますが読めませんでした: \" + x)).concat(r.errors);\n  const excludedCodes = r.excludedLines.filter(l => l.indexOf(\"[\") >= 0).length;\n  const balance = nCode0 === nCode1 + excludedCodes;\n  if(!balance) errs.push(\"コードの数が合いません(元 \" + nCode0 + \"・適用後 \" + nCode1 + \"・除外 \" + excludedCodes + \")\");\n  OPS_TREE = renderLikeSource(A.root, treeTitleOf(ta));\n\n  $(\"stats\").innerHTML = statHtml(replies > 1 ? \"回答数(多数決)\" : \"読み取った指示\",\n                                  replies > 1 ? replies : ops.length,\n                                  replies > 1 ? replies : ops.length)\n    + (replies > 1 ? statHtml(\"採用した指示\", ops.length, ops.length) : \"\")\n    + statHtml(\"最終ラベル\", nLeaf0, leavesOf(A.root).length)\n    + statHtml(\"コードの数\", nCode0, nCode1)\n    + statHtml(\"除外\", 0, excludedCodes);\n  let secs = \"\";\n  const sec = (cls, title, items) => items.length\n    ? '<div class=\"sec ' + cls + '\"><h4>' + esc(title) + \"<\/h4><ul>\"\n      + items.slice(0, 40).map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\")\n      + (items.length > 40 ? \"<li>…ほか \" + (items.length - 40) + \"件<\/li>\" : \"\") + \"<\/ul><\/div>\" : \"\";\n  secs += sec(\"bad\", \"対応が必要な指示(AIに聞き直すか、行を直して再実行)\", errs);\n  if(replies > 1)\n    secs += sec(\"info\", \"多数決: 回答 \" + replies + \"件のうち過半数が一致した指示だけを適用しました\", []);\n  secs += sec(\"warn\", \"多数決で見送った指示(過半数に届かず・参考)\", minority);\n  secs += sec(\"info\", \"適用した指示\", r.applied);\n  secs += sec(\"info\", \"除外した科目(反映カードに自動で引き継ぎます)\", r.excludedLines);\n  secs += sec(\"warn\", \"AIからの指摘(参考)\", notes);\n  $(\"secs\").innerHTML = secs;\n\n  if(errs.length)\n    $(\"verdict\").innerHTML = '<div class=\"verdict warn\">一部の指示を適用できませんでした('\n      + errs.length + \"件)<small>適用できた分は反映済みです。下のエラー行だけAIに聞き直すか、手で直して再実行してください。<\/small><\/div>\";\n  else\n    $(\"verdict\").innerHTML = '<div class=\"verdict good\">指示を適用しました<small>コード '\n      + nCode0 + \"個 = 適用後 \" + nCode1 + \"個 + 除外 \" + excludedCodes\n      + \"個。機械適用なので、これ以外の変化はありません。<\/small><\/div>\";\n\n  $(\"opsBtns\").classList.remove(\"hide\");\n  $(\"opsOut\").classList.remove(\"hide\");\n  $(\"opsNote\").classList.remove(\"hide\");\n  $(\"opsOut\").textContent = OPS_TREE;\n  $(\"taM7\").value = OPS_TREE;\n  if(r.excludedLines.length) $(\"taEx\").value = r.excludedLines.join(\"\\n\");\n  REPORT = [\"■ 指示の適用: \" + ops.length + \"件\"].concat(r.applied.map(x => \"  ・\" + x))\n    .concat(notes.map(x => \"  (指摘) \" + x))\n    .concat(errs.map(x => \"  × \" + x))\n    .concat([\"  検算: コード \" + nCode0 + \" = 適用後 \" + nCode1 + \" + 除外 \" + excludedCodes]).join(\"\\n\");\n  // 差分表示: 元 vs 適用後\n  DIFF = diffLines(parse(ta).lines, parse(OPS_TREE).lines);\n  SHOW_ALL = false;\n  show(\"diffCard\", true);\n  renderDiff();\n}\n\nfunction run(){\n  const ta = $(\"taA\").value, tb = $(\"taB\").value;\n  show(\"resultCard\", true);\n  $(\"opsBtns\").classList.add(\"hide\");\n  $(\"opsOut\").classList.add(\"hide\");\n  $(\"opsNote\").classList.add(\"hide\");\n  if(!ta.trim() || !tb.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">左に元の7桁ツリー、右にAIの回答を入れてください<\/div>';\n    $(\"stats\").innerHTML = \"\"; $(\"secs\").innerHTML = \"\";\n    show(\"diffCard\", false);\n    REPORT = \"\";\n    return;\n  }\n  // AIの回答が「指示リスト」か「ツリー全文」かを自動判別\n  const opsParsed = parseOps(tb);\n  if(treeLineCount(tb) < 3 && (opsParsed.ops.length || opsParsed.notes.length || opsParsed.bad.length)){\n    runOps(ta, tb);\n    return;\n  }\n  if(treeLineCount(tb) < 3){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">AIの回答を読み取れませんでした<small>「除外:」「昇格:」「移動:」の指示リストか、ツリー全文を貼ってください。<\/small><\/div>';\n    $(\"stats\").innerHTML = \"\"; $(\"secs\").innerHTML = \"\";\n    show(\"diffCard\", false);\n    return;\n  }\n  // ツリー全文が返ってきた場合: 従来の差分チェック。「除外した科目」行が混ざっていれば除外欄へ自動転記\n  if(!$(\"taEx\").value.trim()){\n    const exLines = [];\n    for(const l of tb.split(\"\\n\")){\n      const m = /^\\s*[・\\-*]?\\s*除外\\s*[::]\\s*(.+)$/.exec(l);\n      if(m) exLines.push(m[1].trim());\n    }\n    if(exLines.length) $(\"taEx\").value = exLines.join(\"\\n\");\n  }\n  const A = parse(ta), B = parse(tb);\n  const structA = A.errors.concat(structureCheck(A.root));\n  const structB = B.errors.concat(structureCheck(B.root));\n  const r = compare(A, B, parseExcluded($(\"taEx\").value));\n\n  const c = r.counts;\n  $(\"stats\").innerHTML = statHtml(\"最終ラベル\", c.leafA, c.leafB)\n    + statHtml(\"判定の段\", c.brA, c.brB)\n    + statHtml(\"コードの数\", c.codeA, c.codeB)\n    + statHtml(\"コードの種類\", c.uniqA, c.uniqB);\n\n  let secs = secHtml(\"bad\", r.bad);\n  if(structB.length)\n    secs += secHtml(\"bad\", [{t: \"修正後のツリー自体の構造に問題があります \" + structB.length + \"件\",\n                             items: structB.slice(0, 30), more: structB.length - 30}]);\n  secs += secHtml(\"warn\", r.warn);\n  secs += secHtml(\"info\", r.info);\n  if(structA.length)\n    secs += secHtml(\"info\", [{t: \"(参考)元のツリーにも構造の問題が \" + structA.length + \"件ありました\",\n                              items: structA.slice(0, 20), more: structA.length - 20}]);\n  const nBad = r.bad.length + (structB.length ? 1 : 0);\n  const nWarn = r.warn.length;\n  if(!nBad && !nWarn && !r.info.length)\n    secs += '<div class=\"sec ok\"><h4>違いはありませんでした<\/h4>'\n          + \"<ul><li>2つのツリーは(記号や定義文を除いて)同じ内容です。<\/li><\/ul><\/div>\";\n  $(\"secs\").innerHTML = secs;\n\n  const defNote = \"\";\n  let v;\n  if(nBad) v = '<div class=\"verdict bad\">そのまま使わないでください（重大な指摘 ' + nBad\n             + \"件）<small>コードやラベルが失われている可能性があります。下の内容をAIに戻して直してもらってください。\"\n             + defNote + \"<\/small><\/div>\";\n  else if(nWarn) v = '<div class=\"verdict warn\">確認してから使ってください（注意 ' + nWarn\n             + \"件）<small>名前の書き換えや項目の増減があります。意図した変更かどうか目で確かめてください。\"\n             + defNote + \"<\/small><\/div>\";\n  else v = '<div class=\"verdict good\">そのまま使えます<small>コードもラベルも失われていません'\n         + (r.info.length ? \"(位置の変更や定義の追記は検査の成果です)。\" : \"。\") + defNote + \"<\/small><\/div>\";\n  $(\"verdict\").innerHTML = v;\n\n  REPORT = textReport(r, structA, structB);\n  DIFF = diffLines(A.lines, B.lines);\n  SHOW_ALL = false;\n  show(\"diffCard\", true);\n  renderDiff();\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/plain;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const t = document.createElement(\"textarea\");\n  t.value = text;\n  document.body.appendChild(t);\n  t.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(t);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\nfunction wire(dropId, fileId, taId){\n  const drop = $(dropId);\n  const load = async f => {\n    $(taId).value = await f.text();\n    drop.querySelector(\"b\").textContent = f.name;\n  };\n  drop.onclick = () => $(fileId).click();\n  $(fileId).onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n  drop.ondragover = e => { e.preventDefault(); drop.classList.add(\"hot\"); };\n  drop.ondragleave = () => drop.classList.remove(\"hot\");\n  drop.ondrop = e => {\n    e.preventDefault();\n    drop.classList.remove(\"hot\");\n    if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n  };\n}\nwire(\"dropA\", \"fileA\", \"taA\");\nwire(\"dropB\", \"fileB\", \"taB\");\nwire(\"dropM7\", \"fileM7\", \"taM7\");\nwire(\"dropM10\", \"fileM10\", \"taM10\");\n\nlet MERGED = \"\";\n$(\"runMerge\").onclick = () => {\n  const b7 = $(\"taM7\").value, a10 = $(\"taM10\").value;\n  const V = $(\"mergeVerdict\"), R = $(\"mergeReport\");\n  MERGED = \"\";\n  $(\"mergeBtns\").classList.add(\"hide\");\n  $(\"mergedOut\").classList.add(\"hide\");\n  if(!b7.trim() || !a10.trim()){\n    V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">2つのツリーを両方とも入れてください<\/div>';\n    R.innerHTML = \"\";\n    return;\n  }\n  try{\n    const B = parse(b7), A = parse(a10);\n    const r = mergeApply(B.root, A.root, parseExcluded($(\"taEx\").value));\n    const ca = codesSorted(A.root);\n    const cm = codesSorted(r.root).concat(r.report.droppedCodes).sort();\n    const ok = ca.join(\",\") === cm.join(\",\");\n    MERGED = renderTree(r.root, treeTitleOf(a10));\n    const rep = r.report;\n    let h = \"\";\n    const sec = (cls, title, items) => items.length\n      ? '<div class=\"sec ' + cls + '\"><h4>' + esc(title) + \"<\/h4><ul>\"\n        + items.slice(0, 30).map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\")\n        + (items.length > 30 ? \"<li>…ほか \" + (items.length - 30) + \"件<\/li>\" : \"\") + \"<\/ul><\/div>\"\n      : \"\";\n    if(ok)\n      V.innerHTML = '<div class=\"verdict good\" style=\"margin-top:12px\">反映しました'\n        + \"<small>コード \" + ca.length + \"個の行き先がすべて確認できました(反映 \"\n        + (ca.length - rep.droppedCodes.length) + \"・除外 \" + rep.droppedCodes.length + \")。<\/small><\/div>\";\n    else\n      V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">反映でコードが変化しました('\n        + ca.length + \"個 → \" + cm.length + \"個)<small>この出力は使わないでください。入れたツリーの組み合わせを確認してください。<\/small><\/div>\";\n    h += sec(\"info\", \"除外リストに従って取り除いた枝\", rep.excluded);\n    h += sec(\"info\", \"移動した枝(検査の成果)\", rep.moves);\n    h += sec(\"info\", \"同じコードが複数箇所にある枝\", rep.multi);\n    h += sec(\"warn\", \"注意\", rep.notes);\n    R.innerHTML = h;\n    if(ok){\n      $(\"mergeBtns\").classList.remove(\"hide\");\n      $(\"mergedOut\").classList.remove(\"hide\");\n      $(\"mergedOut\").textContent = MERGED;\n    }\n  }catch(e){\n    V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">反映できませんでした<small>'\n      + esc(e.message) + \"<\/small><\/div>\";\n    R.innerHTML = \"\";\n  }\n};\n$(\"dlMerged\").onclick = () => MERGED && save(MERGED, \"tree-10digit-merged.md\");\n$(\"cpMerged\").onclick = e => MERGED && copy(MERGED, e.target);\n\n$(\"run\").onclick = run;\nconst VOTE_EXTRA = [\n  \"\",\n  \"---\",\n  \"\",\n  \"## 追加指示: 3人の検査役による多数決\",\n  \"\",\n  \"今回は、あなたの中で**独立した3人の検査役**として、互いの結果を見ずに順番に検査してください。\",\n  \"\",\n  \"- 検査役1: **配置(昇格・移動)を重視**して検査する\",\n  \"- 検査役2: **除外**を重視して検査する\",\n  \"- 検査役3: **全体を慎重に**、疑わしいものだけを挙げる\",\n  \"\",\n  \"出力は、検査役1の指示リスト、`----` だけの行、検査役2の指示リスト、`----` だけの行、\",\n  \"検査役3の指示リスト、の順で出してください。**多数決の集計はあなたはしません**\",\n  \"(受け取ったプログラムが行います)。指示リスト以外の文章は一切書かないでください。\"\n].join(\"\\n\");\n\n$(\"cpPrompt\").onclick = e => {\n  if(!$(\"taA\").value.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">先に左の欄へ元の7桁ツリーを入れてください<\/div>';\n    show(\"resultCard\", true);\n    return;\n  }\n  copy(GUIDE_TEXT + \"\\n\\n---\\n\\n以下が対象のツリーです。\\n\\n\" + $(\"taA\").value, e.target);\n};\n$(\"cpPrompt3\").onclick = e => {\n  if(!$(\"taA\").value.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">先に左の欄へ元の7桁ツリーを入れてください<\/div>';\n    show(\"resultCard\", true);\n    return;\n  }\n  copy(GUIDE_TEXT + VOTE_EXTRA + \"\\n\\n---\\n\\n以下が対象のツリーです。\\n\\n\" + $(\"taA\").value, e.target);\n};\n$(\"cpOps\").onclick = e => OPS_TREE && copy(OPS_TREE, e.target);\n$(\"dlOps\").onclick = () => OPS_TREE && save(OPS_TREE, \"tree-7digit-fixed.md\");\n$(\"clear\").onclick = () => {\n  $(\"taA\").value = \"\"; $(\"taB\").value = \"\";\n  show(\"resultCard\", false); show(\"diffCard\", false);\n};\n$(\"toggleAll\").onclick = () => { SHOW_ALL = !SHOW_ALL; renderDiff(); };\n$(\"cp\").onclick = e => REPORT && copy(REPORT, e.target);\n$(\"dl\").onclick = () => REPORT && save(REPORT, \"tree-check-report.txt\");\n<\/script>\n"}, {"name": "③ ツリーからDify", "hint": "分類ツリーから、Difyにインポートする DSL(YAML)を作ります。", "html": "<title>ツリーからDifyワークフロー<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{\n    --bg:#f6f7f9; --fg:#1b1d20; --sub:#5b6169; --line:#d8dce1; --card:#ffffff;\n    --accent:#2f6fed; --accent-fg:#ffffff; --warn:#8a4b00; --warn-bg:#fff5e6;\n    --ok:#0f6b3f; --ok-bg:#eaf7f0; --code-bg:#f2f4f7;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:24px 16px 80px;background:var(--bg);color:var(--fg);\n       font-family:\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;line-height:1.7}\n  .wrap{max-width:1040px;margin:0 auto}\n  h1{font-size:22px;margin:0 0 4px}\n  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}\n  .card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n  #drop{border:2px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;\n        background:var(--card);cursor:pointer;transition:.15s;margin-bottom:12px}\n  #drop.hot{border-color:var(--accent);background:#eef3fe}\n  #drop b{display:block;font-size:15px;margin-bottom:2px}\n  #drop span{color:var(--sub);font-size:13px}\n  textarea{width:100%;height:240px;padding:10px;border:1px solid var(--line);border-radius:6px;\n           font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;font-size:13px;\n           line-height:1.5;background:#fff;color:var(--fg);white-space:pre;overflow-wrap:normal}\n  button{padding:8px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;\n         color:var(--fg);font-size:14px;font-family:inherit;cursor:pointer}\n  button:hover{background:#f0f2f5}\n  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}\n  button.primary:hover{filter:brightness(1.08)}\n  button:disabled{opacity:.5;cursor:not-allowed}\n  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\n  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;\n      overflow:auto;max-height:520px;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n      font-size:12px;line-height:1.5;margin:0;white-space:pre}\n  .log{white-space:pre-wrap;font-size:13px}\n  .warn{background:var(--warn-bg);border:1px solid #f0d6a8;color:var(--warn);\n        border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .ok{background:var(--ok-bg);border:1px solid #b8e0cb;color:var(--ok);\n      border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .warn ul,.ok ul{margin:6px 0 0;padding-left:20px}\n  .hide{display:none}\n  .note{font-size:12px;color:var(--sub);margin-top:8px}\n  .exp-hit{background:#fff3d6;border-radius:6px;transition:background .4s}\n  #canvas g[data-nid]{cursor:pointer}\n<\/style>\n\n<div class=\"wrap\">\n<h1>分類ツリーから Dify ワークフローを作る<\/h1>\n<p class=\"lead\">\n  分類ツリー(.md)を貼るか落とすと、Difyにインポートできる DSL(YAML)を作ります。\n  <b>ファイルはこのブラウザの中だけで処理され、どこにも送信されません<\/b>(通信は一切行いません)。\n<\/p>\n\n<div class=\"card\">\n  <h2>1. 分類ツリーを入れる<\/h2>\n  <div id=\"drop\">\n    <b>ここに分類ツリー(.md / .txt)をドラッグ&amp;ドロップ<\/b>\n    <span>またはクリックしてファイルを選ぶ / 下の欄に直接貼り付けてもOK<\/span>\n    <input type=\"file\" id=\"file\" accept=\".md,.txt\" class=\"hide\">\n  <\/div>\n  <textarea id=\"tree\" placeholder=\"区分判定(1段目)&#10;├─ 資産&#10;│   ├─ 流動資産&#10;│   │   ├─ 現金&#10;…\"><\/textarea>\n  <div class=\"note\">\n    「Excelからツリー.html」で作ったツリー、または検査後のツリーをそのまま貼ってください\n    (```で囲まれたコードブロックが入っていても、そのまま貼って大丈夫です)。\n  <\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"run\">DSLを作る<\/button>\n    <button id=\"sample\">サンプルを入れる(動作確認用)<\/button>\n    <button id=\"clear\">入力を消す<\/button>\n  <\/div>\n  <div class=\"note\">\n    「サンプルを入れる」は、一般的な簿記の勘定科目だけで作った約200行のサンプルツリーを入力欄に入れます\n    (実在のデータとは無関係です)。そのまま「DSLを作る」を押すと、変換とオーケストレーション表示を確認できます。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"resultCard\">\n  <h2>2. 結果<\/h2>\n  <div id=\"summary\" class=\"log\"><\/div>\n  <div id=\"checks\"><\/div>\n  <div class=\"btns\">\n    <button id=\"dl\">DSL(YAML)を保存<\/button>\n    <button id=\"cp\">DSLをコピー<\/button>\n  <\/div>\n  <div class=\"note\">\n    次: Dify の「アプリを作成 → DSLファイルをインポート」で取り込んでください。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"canvasCard\">\n  <h2>3. Difyでの見え方(オーケストレーション)<\/h2>\n  <div class=\"btns\" style=\"margin:0 0 10px\">\n    <button id=\"zoomOut\">縮小<\/button>\n    <button id=\"zoomIn\">拡大<\/button>\n    <button id=\"zoomFit\">全体を表示<\/button>\n    <button id=\"dlsvg\">図を保存(SVG)<\/button>\n    <span class=\"note\" id=\"canvasInfo\" style=\"margin:0 0 0 8px;align-self:center\"><\/span>\n  <\/div>\n  <div id=\"canvas\" style=\"overflow:auto;max-height:70vh;border:1px solid var(--line);\n       border-radius:6px;background:#f7f8fa\"><\/div>\n  <div class=\"note\">\n    この図はDSLに書かれたノードの座標をそのまま描いたものです。Difyに取り込むと同じ配置で表示されます\n    (図の生成もこのブラウザの中だけで行っています)。\n    <b>ノードをクリックすると、ページ下部の解説の該当箇所へ移動します<\/b>\n    (ツリー部分の判定ノードは「ツリーの部分」の説明へ)。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"yamlCard\">\n  <h2>3. できたDSL<\/h2>\n  <pre id=\"yaml\"><\/pre>\n<\/div>\n\n<div class=\"card\">\n  <h2>解説: このワークフローの全体像(ツリーの前後で何をしているか)<\/h2>\n\n  <pre style=\"max-height:none\">開始 → テキスト抽出 → 契約内容サマリー → 認識確認 ─┬→ (初回)確認要求 ──────────────┐\n                                                    └→ ツリー判定(区分 → 小区分 → 細分…) │\n                                                         ↓                              │\n                          変数集約 → 経路組み立て → コード確定 → 更問いチェック ─┬→ 仕訳生成 ─┴→ 出力\n                                                                              └→ (質問あり)そのまま出力<\/pre>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ ツリーの前(自動で入る前処理)<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li id=\"exp-start\"><b>開始<\/b> — 入力は2つ。<b>契約書ファイル<\/b>(PDF / DOC / DOCX / TXT / MD・必須)と\n      <b>補足情報<\/b>(任意のテキスト欄)。補足情報は「質問への回答」と「読み取りの訂正」を書く場所です<\/li>\n    <li id=\"exp-extract\"><b>テキスト抽出<\/b> — 契約書ファイルから本文テキストを取り出します(LLM不使用)<\/li>\n    <li id=\"exp-summary\"><b>契約内容サマリー<\/b>(LLM) — 契約名・当事者と自社の立場・主目的・主要条件・特記事項を読み取り、\n      <b>認識確認用の要約<\/b>を作ります。補足情報に訂正が書かれていれば反映します<\/li>\n    <li id=\"exp-confirm\"><b>条件分岐(認識確認)<\/b> — <b>補足情報が空(=初回実行)なら分類に進みません<\/b>。\n      「読み取り内容を確認し、補足情報欄に回答して再実行してください」という<b>確認要求<\/b>だけを返して終わります。\n      読み取りの誤りが全分類に波及するのを防ぐ安全弁です。2回目以降(補足情報に何か書いてある)は分類へ進みます<\/li>\n  <\/ul>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ ツリーの部分(あなたのツリーから自動生成)<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li id=\"exp-tree\">ツリーの1段が「判定LLM+条件分岐」の1組になります。上の段から順に選択肢を1つずつ選んで下り、\n      最終ラベルに到達したら判定終了です(詳細は省略)<\/li>\n  <\/ul>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ ツリーの後(自動で入る後処理)<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li id=\"exp-agg\"><b>変数集約<\/b> — 実行された段の結果を集めます(最も深い判定が優先)。\n      区分ごとの集約→全体集約の2段構えで、キャンバスの線が交差しない配置になっています<\/li>\n    <li id=\"exp-path\"><b>経路組み立て<\/b> — 通ってきた段を「流動資産/現金・預金/預金」のように<b>「/」で連結<\/b>します。\n      これが出力 <code>main_account<\/code> です<\/li>\n    <li id=\"exp-code\"><b>コード確定<\/b> — 経路を、環境変数 <code>code_map<\/code>(ツリーから自動生成した対応表)と\n      <b>最長一致で照合<\/b>して勘定科目コードを決めます。<b>LLMは使いません<\/b>(推測でコードを作らせない)。\n      途中の段で止まった場合は共通7桁まで、対応表に無ければ「コード未登録」。これが <code>account_code<\/code> です<\/li>\n    <li id=\"exp-qcheck\"><b>条件分岐(更問いチェック)<\/b> — 判定結果が「質問」で始まっていたら、仕訳を作らずその質問を出力へ流します<\/li>\n    <li id=\"exp-journal\"><b>仕訳生成<\/b>(LLM) — 判定済みの主科目を使い、<b>金額なしの仕訳<\/b>を1本作ります:\n      借方/貸方/確信度(高・中・低)/確信度の補足/誤分類時の影響(高・中・低と理由)<\/li>\n    <li id=\"exp-end\"><b>終了<\/b> — 4つを出力: <code>contract_summary<\/code>(認識確認用の要約)/\n      <code>classification_result<\/code>(仕訳、または質問)/\n      <code>main_account<\/code>(判定経路)/ <code>account_code<\/code>(勘定科目コード)<\/li>\n  <\/ul>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ 更問い(情報が足りないとき)の仕組み<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li>判定の各段のLLMには「<b>契約書と補足情報を読んでも判定に必要な情報が足りないときは、\n      ラベルの代わりに質問を出せ<\/b>」という指示が入っています。形式は\n      「質問: …(選択式で答えられる聞き方)」「回答例: … / …」の2行で、<b>1回につき質問は1つだけ<\/b>です<\/li>\n    <li>質問が出ると、その先の判定と仕訳はせず、質問がそのまま <code>classification_result<\/code> に出ます。\n      ただし<b>確定した段までの経路と共通7桁コードは出ます<\/b>(途中経過が無駄になりません)<\/li>\n    <li>利用者は、質問への回答を<b>「補足情報」欄に追記して再実行<\/b>します。全段のプロンプトが\n      補足情報を「過去の質問への回答」として読むので、前回の判定を引き継いで先へ進めます<\/li>\n    <li>情報不足ではなく「判定材料はあるがどれか紛れる」場合は、質問せずに\n      その段の<b>受け皿(★のラベル)<\/b>へ倒します。質問は情報不足のときだけです<\/li>\n  <\/ul>\n\n  <div class=\"note\">\n    ここに書いた前後のノードとプロンプトは、③がツリーから毎回自動で組み込むものです(手作業は不要)。\n    生成後に上のオーケストレーション図で実物のノード配置を確認できます。\n  <\/div>\n<\/div>\n\n<\/div>\n\n<script>\n\"use strict\";\n\n// <<EXTRAS>>\nconst EXTRAS_JSON = \"{\\\"app\\\":{\\\"description\\\":\\\"\\\",\\\"icon\\\":\\\"📑\\\",\\\"icon_background\\\":\\\"#FFEAD5\\\",\\\"mode\\\":\\\"workflow\\\",\\\"name\\\":\\\"契約書 勘定科目区分分類\\\",\\\"use_icon_as_answer_icon\\\":false},\\\"features\\\":{\\\"file_upload\\\":{\\\"allowed_file_extensions\\\":[\\\".PDF\\\",\\\".DOC\\\",\\\".DOCX\\\",\\\".TXT\\\",\\\".MD\\\"],\\\"allowed_file_types\\\":[\\\"document\\\"],\\\"allowed_file_upload_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"],\\\"enabled\\\":true,\\\"fileUploadConfig\\\":{\\\"audio_file_size_limit\\\":50,\\\"batch_count_limit\\\":5,\\\"file_size_limit\\\":15,\\\"image_file_size_limit\\\":10,\\\"video_file_size_limit\\\":100,\\\"workflow_file_upload_limit\\\":10},\\\"image\\\":{\\\"enabled\\\":false,\\\"number_limits\\\":3,\\\"transfer_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"]},\\\"number_limits\\\":3},\\\"opening_statement\\\":\\\"\\\",\\\"retriever_resource\\\":{\\\"enabled\\\":true},\\\"sensitive_word_avoidance\\\":{\\\"enabled\\\":false},\\\"speech_to_text\\\":{\\\"enabled\\\":false},\\\"suggested_questions\\\":[],\\\"suggested_questions_after_answer\\\":{\\\"enabled\\\":false},\\\"text_to_speech\\\":{\\\"enabled\\\":false,\\\"language\\\":\\\"\\\",\\\"voice\\\":\\\"\\\"}},\\\"conversation_variables\\\":[],\\\"scaffold_nodes\\\":[{\\\"data\\\":{\\\"desc\\\":\\\"契約書ファイルをアップロードします。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"開始\\\",\\\"type\\\":\\\"start\\\",\\\"variables\\\":[{\\\"allowed_file_extensions\\\":[],\\\"allowed_file_types\\\":[\\\"document\\\"],\\\"allowed_file_upload_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"],\\\"label\\\":\\\"契約書ファイル\\\",\\\"max_length\\\":48,\\\"options\\\":[],\\\"required\\\":true,\\\"type\\\":\\\"file\\\",\\\"variable\\\":\\\"contract_file\\\"},{\\\"label\\\":\\\"補足情報(更問いへの回答)\\\",\\\"max_length\\\":2000,\\\"options\\\":[],\\\"required\\\":false,\\\"type\\\":\\\"paragraph\\\",\\\"variable\\\":\\\"additional_info\\\"}]},\\\"height\\\":116,\\\"id\\\":\\\"start\\\",\\\"position\\\":{\\\"x\\\":80,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":80,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"契約書ファイルからテキストを抽出します。\\\",\\\"is_array_file\\\":false,\\\"selected\\\":false,\\\"title\\\":\\\"テキスト抽出\\\",\\\"type\\\":\\\"document-extractor\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"contract_file\\\"]},\\\"height\\\":116,\\\"id\\\":\\\"doc-extractor\\\",\\\"position\\\":{\\\"x\\\":384,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":384,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"context\\\":{\\\"enabled\\\":false,\\\"variable_selector\\\":[]},\\\"desc\\\":\\\"契約書の読み取り内容(契約名・当事者・主目的・主要条件)を認識確認用に出力します。補足情報の訂正を反映します。\\\",\\\"model\\\":{\\\"completion_params\\\":{\\\"temperature\\\":0.1},\\\"mode\\\":\\\"chat\\\",\\\"name\\\":\\\"gpt-4o\\\",\\\"provider\\\":\\\"openai\\\"},\\\"prompt_template\\\":[{\\\"id\\\":\\\"system-prompt-summary\\\",\\\"role\\\":\\\"system\\\",\\\"text\\\":\\\"あなたは日本の企業会計に精通した経理・会計の専門家です。\\\\n与えられた契約書の本文から、勘定科目分類の前提となる要点を読み取り、次の形式で出力してください。\\\\nこの出力は「契約 let question = ex.question;\n  if(!question){\n    const opts = node.children.slice(0, 3).map(c => c.label);\n    question = [\"質問: この契約は次のどれに最も近いですか?(\" + opts.join(\" / \") + \")\",\n                \"回答例: \" + opts.slice(0, 2).map(o => o + \"です\").join(\" / \")];\n  }\n  lines.push.apply(lines, question.map(q => \"  \" + q));\n  return lines.join(\"\\n\");\n}\n\nfunction userPrompt(stage){\n  let intro = stage.ex.user_intro;\n  if(!intro){\n    if(stage.isRoot) intro = \"以下は契約書の本文です。この契約の勘定科目区分を判定し、ラベル名のみを出力してください。\";\n    else if(stage.isSub) intro = \"以下は契約書の本文です。\" + stage.label + \"の小区分を判定し、ラベル名のみを出力してください。\";\n    else intro = \"以下は契約書の本文です。この\" + stage.label + \"の細分を判定し、ラベル名のみを出力してください。\";\n  }\n  return intro + USER_BODY;\n}\n\n// ============================================================ レイアウト\nconst ROW = 140, SCAF_Y = 190, TOP_Y = 40, AGG_Y = 410, BANDS_Y0 = 700, BAND_GAP = 180;\nfunction colx(c){ return 80 + 304 * c; }\n\nfunction stageDepth(stage){\n  let d = 0, n = stage.node;\n  while(n.parent !== null){ d++; n = n.parent; }\n  return d;\n}\n\nfunction computeLayout(root, stages, gaggIds){\n  const pos = {};\n  let maxDepth = 0;\n  for(const st of stages.values()) maxDepth = Math.max(maxDepth, stageDepth(st));\n  const gaCol = Math.max(7, 5 + 2 * maxDepth);\n\n  pos[\"start\"] = [colx(0), SCAF_Y];\n  pos[\"doc-extractor\"] = [colx(1), SCAF_Y];\n  pos[\"llm-summary\"] = [colx(2), SCAF_Y];\n  pos[\"if-else-confirm\"] = [colx(3), SCAF_Y];\n  pos[stages.get(nodeKey(root)).id] = [colx(4), SCAF_Y];\n  if(stages.get(nodeKey(root)).ifelseId) pos[stages.get(nodeKey(root)).ifelseId] = [colx(5), SCAF_Y];\n  pos[\"template-confirm\"] = [colx(4), TOP_Y];\n  pos[\"aggregator\"] = [colx(gaCol + 1), AGG_Y + 150];\n  pos[\"template-path\"] = [colx(gaCol + 2), AGG_Y + 150];\n  pos[\"template-code\"] = [colx(gaCol + 3), AGG_Y + 150];\n  pos[\"if-else-q\"] = [colx(gaCol + 4), AGG_Y + 370];\n  pos[\"llm-journal\"] = [colx(gaCol + 5), AGG_Y + 590];\n  pos[\"aggregator-out\"] = [colx(gaCol + 6), AGG_Y];\n  pos[\"end\"] = [colx(gaCol + 7), AGG_Y];\n\n  let bandY = BANDS_Y0;\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const head = stages.get(nodeKey(cat));\n    const subStages = cat.children.filter(c => c.isBranch).map(c => stages.get(nodeKey(c)));\n    const rows = 1 + subStages.length;\n    pos[head.id] = [colx(6), bandY];\n    if(head.ifelseId) pos[head.ifelseId] = [colx(7), bandY];\n    subStages.forEach(function(st, i){\n      const y = bandY + ROW * (1 + i);\n      pos[st.id] = [colx(4 + 2 * stageDepth(st)), y];\n      if(st.ifelseId) pos[st.ifelseId] = [colx(5 + 2 * stageDepth(st)), y];\n      (function deeper(node){\n        for(const c of node.children){\n          if(!c.isBranch) continue;\n          const dst = stages.get(nodeKey(c));\n          pos[dst.id] = [colx(4 + 2 * stageDepth(dst)), y];\n          if(dst.ifelseId) pos[dst.ifelseId] = [colx(5 + 2 * stageDepth(dst)), y];\n          deeper(c);\n        }\n      })(st.node);\n    });\n    const gy = bandY + rows * ROW + 70;\n    pos[gaggIds[nodeKey(cat)]] = [colx(gaCol), gy];\n    bandY = gy + 116 + BAND_GAP;\n  }\n  return pos;\n}\n\nfunction place(pos, nid){ return {x: pos[nid][0], y: pos[nid][1]}; }\n\nfunction nodeShell(nid, data, p, height){\n  return {data: data, height: height === undefined ? 116 : height, id: nid,\n          position: p, positionAbsolute: {x: p.x, y: p.y}, selected: false,\n          sourcePosition: \"right\", targetPosition: \"left\", type: \"custom\", width: 244};\n}\n\nfunction llmNode(stage, pos){\n  let desc;\n  if(stage.env) desc = stage.ex.desc || (stage.label + \"を環境変数 \" + stage.env + \" の分類基準に従って細分判定します。\");\n  else if(stage.isRoot) desc = stage.ex.desc || \"契約書の主たる勘定科目区分を判定します。\";\n  else desc = stage.ex.desc || (stage.label + \"の細分を判定します(基準はプロンプト内固定)。\");\n  const suffix = rep(stage.id, \"llm-\", \"\");\n  const data = {\n    context: {enabled: false, variable_selector: []},\n    desc: desc,\n    model: clone(MODEL),\n    prompt_template: [\n      {id: \"system-prompt-\" + suffix, role: \"system\", text: systemPrompt(stage)},\n      {id: \"user-prompt-\" + suffix, role: \"user\", text: userPrompt(stage)}\n    ],\n    selected: false,\n    title: stage.ex.title || (stage.titlePrefix + stage.label + \" 細分判定\"),\n    type: \"llm\",\n    variables: [],\n    vision: {enabled: false}\n  };\n  return nodeShell(stage.id, data, place(pos, stage.id));\n}\n\nfunction caseIdFor(childStage){\n  return childStage.ex.case_id || (\"case-\" + rep(rep(childStage.id, \"llm-sub-\", \"\"), \"llm-\", \"\"));\n}\n\nfunction makeCase(stage, childStage){\n  const ex = childStage.ex;\n  const value = ex.case_value || childStage.label;\n  const cid = caseIdFor(childStage);\n  const cond = ex.cond_id || rep(cid, \"case-\", \"cond-\");\n  return [{\n    case_id: cid,\n    conditions: [{\n      comparison_operator: \"start with\",\n      id: cond,\n      value: value,\n      varType: \"string\",\n      variable_selector: [stage.id, \"text\"]\n    }],\n    id: cid,\n    logical_operator: \"and\"\n  }, value];\n}\n\nfunction ifelseNode(stage, stages, pos){\n  const branch = stage.branchChildren();\n  const pairs = branch.map(function(c){\n    const r = makeCase(stage, stages.get(nodeKey(c)));\n    return {case: r[0], value: r[1], child: c};\n  });\n  // ケースは値の長い順(Difyは上から順に評価するため、前方一致の包含関係を解決する)\n  pairs.sort((a, b) => b.value.length - a.value.length);\n  // 葉ラベルがケース値に飲み込まれる場合は、そのケースだけ完全一致に切り替える\n  for(const p of pairs){\n    for(const c of stage.node.children){\n      if(c.label === p.child.label || c.isBranch) continue;\n      if(c.label.indexOf(p.value) === 0){\n        p.case.conditions[0].comparison_operator = \"is\";\n        break;\n      }\n    }\n  }\n  for(const c of stage.node.children){\n    if(c.label.indexOf(\"質問\") === 0) throw Err(\"「質問」で始まるラベルは使えません: \" + c.label);\n  }\n  const values = pairs.map(p => p.value);\n  if(new Set(values).size !== values.length)\n    throw Err(\"条件分岐のケース値が重複しています: \" + values.join(\"、\"));\n  const exIf = stage.ex.ifelse || {};\n  let defaultTitle, defaultDesc;\n  if(stage.isRoot){ defaultTitle = \"条件分岐\"; defaultDesc = \"細分を持つ区分の場合のみ小区分判定へ分岐します。\"; }\n  else{\n    defaultTitle = \"条件分岐(\" + stage.titlePrefix + stage.label + \"細分)\";\n    defaultDesc = stage.label + \"の細分のうち、さらに細分を持つものを対応する判定へ分岐します。\";\n  }\n  const data = {\n    cases: pairs.map(p => p.case),\n    desc: exIf.desc || defaultDesc,\n    selected: false,\n    title: exIf.title || defaultTitle,\n    type: \"if-else\"\n  };\n  return nodeShell(stage.ifelseId, data, place(pos, stage.ifelseId),\n                   exIf.height === undefined ? 126 : exIf.height);\n}\n\nfunction makeEdge(byId, src, handle, tgt){\n  return {\n    data: {isInIteration: false, sourceType: byId[src].data.type, targetType: byId[tgt].data.type},\n    id: src + \"-\" + handle + \"-\" + tgt + \"-target\",\n    source: src, sourceHandle: handle,\n    target: tgt, targetHandle: \"target\",\n    type: \"custom\", zIndex: 0\n  };\n}\n\n// ============================================================ 環境変数\nfunction codeMapLines(root){\n  const lines = [];\n  (function walk(n, seven, three, path){\n    if(n.parent !== null){\n      path = path.concat([n.label]);\n      let full = null;\n      if(n.code !== null){\n        if(n.code.length === 7 && !seven){ seven = n.code; three = null; }\n        else if(n.code.length === 3) three = n.code;\n        else full = n.code;\n      }\n      if(full) lines.push(path.join(\"/\") + \",\" + full);\n      else if(seven) lines.push(path.join(\"/\") + \",\" + seven + (three || \"\"));\n    }\n    for(const c of n.children) walk(c, seven, three, path);\n  })(root, null, null, []);\n  return lines;\n}\n\nfunction envVars(root, stages, extras){\n  const out = [];\n  (function walk(node){\n    const stage = stages.get(nodeKey(node));\n    if(stage.env){\n      const lines = [];\n      node.children.forEach(function(c, i){\n        lines.push(c.definition ? (i + 1) + \". \" + c.label + \": \" + c.definition : (i + 1) + \". \" + c.label);\n      });\n      let desc = (extras.env_descriptions || {})[stage.env];\n      if(!desc){\n        desc = stage.label + \"の細分の分類基準。行を追記・編集すると判定に反映される\"\n             + \"(ラベル名: 定義 または ラベル名のみ の形式。名前から分かるものは定義省略可)。\";\n        for(const bc of stage.branchChildren())\n          desc += \" ※「\" + bc.label + \"」の行は条件分岐が名称を参照しているため名称変更不可。\";\n      }\n      const ids = (extras.env_ids || {})[stage.env] || {};\n      out.push({\n        description: desc,\n        id: ids.id || (\"env-\" + rep(stage.env, \"_\", \"-\")),\n        name: stage.env,\n        value: lines.join(\"\\n\"),\n        value_type: ids.value_type || \"string\"\n      });\n    }\n    for(const c of stage.branchChildren()) walk(c);\n  })(root);\n  return out;\n}\n\n// ============================================================ 全体組み立て\nfunction generate(treeText, extras, warnings){\n  const root = parseTree(treeText, warnings);\n  const stages = buildStages(root, extras);\n\n  const used = new Set();\n  for(const st of stages.values()){ used.add(st.id); if(st.ifelseId) used.add(st.ifelseId); }\n  const gaggIds = {};\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const suffix = rep(rep(stages.get(nodeKey(cat)).id, \"llm-sub-\", \"\"), \"llm-\", \"\");\n    let gid = \"aggregator-\" + suffix, k = 2;\n    while(used.has(gid)){ gid = \"aggregator-\" + suffix + k; k++; }\n    used.add(gid);\n    gaggIds[nodeKey(cat)] = gid;\n  }\n\n  const pos = computeLayout(root, stages, gaggIds);\n\n  const nodes = extras.scaffold_nodes.map(clone);\n  for(const n of nodes){\n    if(pos[n.id]){ n.position = place(pos, n.id); n.positionAbsolute = place(pos, n.id); }\n  }\n  const order = postorder(root, stages);\n\n  const stageNodes = [];\n  (function emitStage(node){\n    const stage = stages.get(nodeKey(node));\n    stageNodes.push(llmNode(stage, pos));\n    if(stage.ifelseId) stageNodes.push(ifelseNode(stage, stages, pos));\n    for(const c of stage.branchChildren()) emitStage(c);\n  })(root);\n  for(const n of stageNodes) nodes.push(n);\n\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const gid = gaggIds[nodeKey(cat)];\n    nodes.push(nodeShell(gid, {\n      desc: cat.label + \"系の判定結果を1つに集約します(最も深い判定が優先)。\",\n      output_type: \"string\",\n      selected: false,\n      title: \"変数集約(\" + cat.label + \")\",\n      type: \"variable-aggregator\",\n      variables: postorderSub(cat, stages).map(st => [st.id, \"text\"])\n    }, place(pos, gid)));\n  }\n\n  // 経路組み立て\n  const pathOrder = Array.from(stages.values()).slice();\n  pathOrder.sort((a, b) => stageDepth(a) - stageDepth(b));\n  const tpParts = [];\n  for(const st of pathOrder){\n    const v = rep(st.id, \"-\", \"_\");\n    tpParts.push(\"{% if \" + v + \" and \" + v + \"[:2] != '質問' %}\"\n                 + (st.isRoot ? \"\" : \"/\") + \"{{ \" + v + \" }}{% endif %}\");\n  }\n  nodes.push(nodeShell(\"template-path\", {\n    desc: \"判定で通ってきた経路を「流動資産/現金・預金/預金」のように「/」で連結します。\",\n    selected: false,\n    template: tpParts.join(\"\"),\n    title: \"経路組み立て\",\n    type: \"template-transform\",\n    variables: pathOrder.map(st => ({value_selector: [st.id, \"text\"], variable: rep(st.id, \"-\", \"_\")}))\n  }, place(pos, \"template-path\")));\n\n  // コード確定\n  const codeTmpl = \"{% set ns = namespace(code='', p=path) %}\"\n    + \"{% for _ in range(12) %}{% if ns.code == '' and ns.p %}\"\n    + \"{% for line in map.split('\\\\n') %}\"\n    + \"{% if line and line.split(',')[0] == ns.p %}{% set ns.code = line.split(',')[1] %}{% endif %}\"\n    + \"{% endfor %}\"\n    + \"{% if ns.code == '' %}{% set ns.p = ns.p.rsplit('/', 1)[0] if '/' in ns.p else '' %}{% endif %}\"\n    + \"{% endif %}{% endfor %}\"\n    + \"{{ ns.code if ns.code else 'コード未登録' }}\";\n  nodes.push(nodeShell(\"template-code\", {\n    desc: \"経路から勘定科目コード(共通7桁、下3桁まで確定していれば10桁)を対応表 code_map で決定的に確定します。未登録は「コード未登録」。\",\n    selected: false,\n    template: codeTmpl,\n    title: \"コード確定\",\n    type: \"template-transform\",\n    variables: [{value_selector: [\"template-path\", \"output\"], variable: \"path\"},\n                {value_selector: [\"env\", \"code_map\"], variable: \"map\"}]\n  }, place(pos, \"template-code\")));\n\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  if(Object.keys(byId).length !== nodes.length) throw Err(\"ノードIDが重複しています\");\n\n  byId[\"aggregator\"].data.variables =\n    root.children.filter(c => c.isBranch).map(c => [gaggIds[nodeKey(c)], \"output\"])\n      .concat([[stages.get(nodeKey(root)).id, \"text\"]]);\n\n  const endNode = byId[\"end\"];\n  for(const o of endNode.data.outputs)\n    if(o.variable === \"main_account\") o.value_selector = [\"template-path\", \"output\"];\n  if(!endNode.data.outputs.some(o => o.variable === \"account_code\"))\n    endNode.data.outputs.push({value_selector: [\"template-code\", \"output\"], variable: \"account_code\"});\n  endNode.data.desc = \"契約内容サマリー(認識確認用)、仕訳または更問い、判定経路(/区切り)、勘定科目コードを出力します。\";\n\n  const edges = [];\n  const E = (src, handle, tgt) => edges.push(makeEdge(byId, src, handle, tgt));\n  E(\"start\", \"source\", \"doc-extractor\");\n  E(\"doc-extractor\", \"source\", \"llm-summary\");\n  E(\"llm-summary\", \"source\", \"if-else-confirm\");\n  E(\"if-else-confirm\", \"case-unconfirmed\", \"template-confirm\");\n  E(\"if-else-confirm\", \"false\", stages.get(nodeKey(root)).id);\n  E(\"template-confirm\", \"source\", \"aggregator-out\");\n  (function wire(node, sink){\n    const stage = stages.get(nodeKey(node));\n    if(stage.ifelseId){\n      E(stage.id, \"source\", stage.ifelseId);\n      for(const c of stage.branchChildren()){\n        E(stage.ifelseId, caseIdFor(stages.get(nodeKey(c))), stages.get(nodeKey(c)).id);\n        wire(c, node === root ? gaggIds[nodeKey(c)] : sink);\n      }\n      E(stage.ifelseId, \"false\", sink);\n    }else{\n      E(stage.id, \"source\", sink);\n    }\n  })(root, \"aggregator\");\n  for(const cat of root.children) if(cat.isBranch) E(gaggIds[nodeKey(cat)], \"source\", \"aggregator\");\n  E(\"aggregator\", \"source\", \"template-path\");\n  E(\"template-path\", \"source\", \"template-code\");\n  E(\"template-code\", \"source\", \"if-else-q\");\n  E(\"if-else-q\", \"case-question\", \"aggregator-out\");\n  E(\"if-else-q\", \"false\", \"llm-journal\");\n  E(\"llm-journal\", \"source\", \"aggregator-out\");\n  E(\"aggregator-out\", \"source\", \"end\");\n\n  const leaves = [];\n  (function countLeaves(n){\n    for(const c of n.children){ if(c.leaf) leaves.push(c.label); else countLeaves(c); }\n  })(root);\n  const app = clone(extras.app);\n  let envCount = 0;\n  for(const st of stages.values()) if(st.env) envCount++;\n  app.description = \"契約書ファイルを読み込み、契約の主たる勘定科目を段階的に判定して、金額なしの仕訳(借方/貸方)と\"\n    + \"確信度・誤分類時の影響度を出力するワークフロー。初回実行は契約内容の認識確認で停止し、\"\n    + \"情報不足時は更問い(質問+回答例)を返す。分類は\" + order.length + \"ステージの段階判定で、最終ラベルは\"\n    + leaves.length + \"種類。細分の分類基準は環境変数 rules_*(\" + envCount + \"個)で編集できる。\"\n    + \"このDSLはREADMEの分類ツリーから tools/generate_workflow.py で自動生成したもの。\";\n\n  const envs = envVars(root, stages, extras);\n  envs.push({\n    description: \"経路→勘定科目コードの対応表(ツリーの[7桁][3桁]から自動生成。1行=「経路,コード」。\"\n               + \"修正はツリー側が正で、ここでの編集は再生成までの応急対応)。\",\n    id: \"env-code-map\",\n    name: \"code_map\",\n    value: codeMapLines(root).join(\"\\n\"),\n    value_type: \"string\"\n  });\n\n  return {\n    app: app,\n    kind: \"app\",\n    version: \"0.1.5\",\n    workflow: {\n      conversation_variables: extras.conversation_variables || [],\n      environment_variables: envs,\n      features: clone(extras.features),\n      graph: {edges: edges, nodes: nodes, viewport: {x: 0, y: 0, zoom: 0.7}}\n    }\n  };\n}\n\n// ============================================================ オーケストレーション図\n// tools/render_canvas.py と同じ描き方をそのまま移植したもの(SVGを組み立てるだけ・通信なし)\nconst NODE_COLORS = {\n  \"start\": [\"#12b76a\", \"開始\"],\n  \"document-extractor\": [\"#667085\", \"テキスト抽出\"],\n  \"llm\": [\"#2970ff\", \"LLM\"],\n  \"if-else\": [\"#f79009\", \"条件分岐\"],\n  \"variable-aggregator\": [\"#7a5af8\", \"変数集約\"],\n  \"template-transform\": [\"#0e9384\", \"テンプレート\"],\n  \"end\": [\"#f04438\", \"終了\"]\n};\n\nfunction srcPort(node, handle){\n  const x = node.position.x + (node.width || 244);\n  const y0 = node.position.y, h = node.height || 116;\n  if(node.data.type === \"if-else\"){\n    const cases = node.data.cases || [];\n    const slots = cases.length + 1;\n    let idx = cases.length;\n    if(handle !== \"false\"){\n      for(let i = 0; i < cases.length; i++) if(cases[i].case_id === handle){ idx = i; break; }\n    }\n    return [x, y0 + h * (idx + 1) / (slots + 1)];\n  }\n  return [x, y0 + h / 2];\n}\n\nfunction tgtPort(node){\n  return [node.position.x, node.position.y + (node.height || 116) / 2];\n}\n\nfunction xesc(s){\n  return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\")\n                  .replace(/\"/g, \"&quot;\");\n}\n\nfunction canvasSvg(nodes, edges, zoom){\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  let w = 0, h = 0;\n  for(const n of nodes){\n    w = Math.max(w, n.position.x + (n.width || 244));\n    h = Math.max(h, n.position.y + (n.height || 116));\n  }\n  w += 100; h += 100;\n  const p = [];\n  p.push('<svg width=\"' + Math.round(w * zoom) + '\" height=\"' + Math.round(h * zoom)\n         + '\" viewBox=\"0 0 ' + w + \" \" + h + '\" xmlns=\"http://www.w3.org/2000/svg\">');\n  p.push('<rect width=\"' + w + '\" height=\"' + h + '\" fill=\"#f7f8fa\"/>');\n  for(const e of edges){\n    const s0 = byId[e.source], t0 = byId[e.target];\n    if(!s0 || !t0) continue;\n    const a = srcPort(s0, e.sourceHandle), b = tgtPort(t0);\n    const dx = Math.max(50, (b[0] - a[0]) * 0.5);\n    p.push('<path d=\"M ' + a[0].toFixed(0) + \" \" + a[1].toFixed(0)\n           + \" C \" + (a[0] + dx).toFixed(0) + \" \" + a[1].toFixed(0) + \", \"\n           + (b[0] - dx).toFixed(0) + \" \" + b[1].toFixed(0) + \", \"\n           + b[0].toFixed(0) + \" \" + b[1].toFixed(0)\n           + '\" fill=\"none\" stroke=\"rgba(52,64,84,0.5)\" stroke-width=\"1.6\"/>');\n    p.push('<circle cx=\"' + b[0].toFixed(0) + '\" cy=\"' + b[1].toFixed(0) + '\" r=\"3\" fill=\"#344054\"/>');\n  }\n  for(const n of nodes){\n    const x = n.position.x, y = n.position.y;\n    const wd = n.width || 244, ht = n.height || 116;\n    const c = NODE_COLORS[n.data.type] || [\"#667085\", n.data.type];\n    p.push('<g data-nid=\"' + xesc(n.id) + '\">');\n    p.push('<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + wd + '\" height=\"' + ht\n           + '\" rx=\"10\" fill=\"#ffffff\" stroke=\"#d0d5dd\" stroke-width=\"1.5\"/>');\n    p.push('<rect x=\"' + x + '\" y=\"' + y + '\" width=\"6\" height=\"' + ht + '\" rx=\"3\" fill=\"' + c[0] + '\"/>');\n    p.push('<text x=\"' + (x + 16) + '\" y=\"' + (y + 28) + '\" font-size=\"15\" font-weight=\"bold\" '\n           + 'fill=\"#101828\" font-family=\"sans-serif\">' + xesc(n.data.title || n.id) + \"<\/text>\");\n    p.push('<text x=\"' + (x + 16) + '\" y=\"' + (y + 50) + '\" font-size=\"12\" fill=\"' + c[0]\n           + '\" font-family=\"sans-serif\">' + xesc(c[1]) + \"<\/text>\");\n    if(n.data.type === \"if-else\"){\n      const cases = (n.data.cases || []).concat([null]);\n      for(const cse of cases){\n        const pt = srcPort(n, cse === null ? \"false\" : cse.case_id);\n        const label = cse === null ? \"ELSE\" : cse.conditions[0].value;\n        p.push('<circle cx=\"' + pt[0].toFixed(0) + '\" cy=\"' + pt[1].toFixed(0) + '\" r=\"3.5\" fill=\"#f79009\"/>');\n        p.push('<text x=\"' + (pt[0] - 8).toFixed(0) + '\" y=\"' + (pt[1] + 3).toFixed(0)\n               + '\" font-size=\"10\" fill=\"#98a2b3\" text-anchor=\"end\" font-family=\"sans-serif\">'\n               + xesc(label) + \"<\/text>\");\n      }\n    }\n    p.push(\"<\/g>\");\n  }\n  p.push(\"<\/svg>\");\n  return {svg: p.join(\"\"), w: w, h: h};\n}\n\n// ============================================================ 画面\nconst $ = id => document.getElementById(id);\nlet YAML = null, GRAPH = null, SVG_FULL = \"\", ZOOM = 0;\n\nfunction show(id, on){ $(id).classList.toggle(\"hide\", !on); }\nfunction esc(s){ return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\"); }\n\nfunction run(){\n  const text = $(\"tree\").value;\n  if(!text.trim()){\n    show(\"resultCard\", true); show(\"yamlCard\", false);\n    $(\"summary\").textContent = \"\";\n    $(\"checks\").innerHTML = '<div class=\"warn\">分類ツリーが入っていません。上の欄に貼り付けてください。<\/div>';\n    return;\n  }\n  const warnings = [];\n  let d;\n  try{\n    d = generate(text, JSON.parse(EXTRAS_JSON), warnings);\n  }catch(e){\n    show(\"resultCard\", true); show(\"yamlCard\", false); show(\"canvasCard\", false);\n    $(\"summary\").textContent = \"\";\n    $(\"checks\").innerHTML = '<div class=\"warn\"><b>変換できませんでした<\/b><br>'\n      + esc(e.userFacing ? e.message : e.message).replace(/\\n/g, \"<br>\")\n      + \"<br><br>※ このメッセージをそのまま伝えず、内容をかみくだいて利用者に確認してください。<\/div>\";\n    YAML = null;\n    return;\n  }\n  YAML = dumpYaml(d);\n  const g = d.workflow.graph;\n  const kinds = {};\n  for(const n of g.nodes) kinds[n.data.type] = (kinds[n.data.type] || 0) + 1;\n  const parts = Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a]).map(k => k + \" \" + kinds[k]);\n  show(\"resultCard\", true);\n  $(\"summary\").textContent =\n    \"■ 変換しました\\n  ノード \" + g.nodes.length + \"個 / エッジ \" + g.edges.length\n    + \"個 / 環境変数 \" + d.workflow.environment_variables.length + \"個\\n  内訳: \" + parts.join(\" / \");\n  $(\"checks\").innerHTML = warnings.length\n    ? '<div class=\"warn\"><b>確認してほしいこと<\/b><ul>'\n      + warnings.map(w => \"<li>\" + esc(w) + \"<\/li>\").join(\"\") + \"<\/ul><\/div>\"\n    : '<div class=\"ok\">構造チェックで問題は見つかりませんでした。<\/div>';\n  $(\"yaml\").textContent = YAML;\n  show(\"yamlCard\", true);\n  GRAPH = g;\n  ZOOM = 0;\n  drawCanvas(true);\n  show(\"canvasCard\", true);\n}\n\nfunction expTarget(nid){\n  if(nid === \"start\") return \"exp-start\";\n  if(nid === \"doc-extractor\") return \"exp-extract\";\n  if(nid === \"llm-summary\") return \"exp-summary\";\n  if(nid === \"if-else-confirm\" || nid === \"template-confirm\") return \"exp-confirm\";\n  if(nid === \"aggregator-out\" || nid === \"end\") return \"exp-end\";\n  if(nid === \"aggregator\" || nid.indexOf(\"aggregator-\") === 0) return \"exp-agg\";\n  if(nid === \"template-path\") return \"exp-path\";\n  if(nid === \"template-code\") return \"exp-code\";\n  if(nid === \"if-else-q\") return \"exp-qcheck\";\n  if(nid === \"llm-journal\") return \"exp-journal\";\n  return \"exp-tree\";\n}\n\nlet EXP_TIMER = null;\n$(\"canvas\").addEventListener(\"click\", e => {\n  let g = e.target;\n  while(g && g !== e.currentTarget && !(g.getAttribute && g.getAttribute(\"data-nid\"))) g = g.parentNode;\n  if(!g || g === e.currentTarget) return;\n  const nid = g.getAttribute(\"data-nid\");\n  // 選択中のノードを枠線で示す\n  for(const other of $(\"canvas\").querySelectorAll(\"g[data-nid] > rect:first-of-type\")){\n    other.setAttribute(\"stroke\", \"#d0d5dd\");\n    other.setAttribute(\"stroke-width\", \"1.5\");\n  }\n  const rect = g.querySelector(\"rect\");\n  if(rect){ rect.setAttribute(\"stroke\", \"#2f6fed\"); rect.setAttribute(\"stroke-width\", \"3\"); }\n  // 解説の該当項目へスクロールしてハイライト\n  const target = document.getElementById(expTarget(nid));\n  if(!target) return;\n  for(const el of document.querySelectorAll(\".exp-hit\")) el.classList.remove(\"exp-hit\");\n  target.classList.add(\"exp-hit\");\n  target.scrollIntoView({behavior: \"smooth\", block: \"center\"});\n  if(EXP_TIMER) clearTimeout(EXP_TIMER);\n  EXP_TIMER = setTimeout(() => target.classList.remove(\"exp-hit\"), 4000);\n});\n\nfunction drawCanvas(fit){\n  if(!GRAPH) return;\n  const box = $(\"canvas\").clientWidth || 900;\n  const probe = canvasSvg(GRAPH.nodes, GRAPH.edges, 1);\n  if(fit) ZOOM = Math.max(0.06, Math.min(1, (box - 24) / probe.w));\n  const r = canvasSvg(GRAPH.nodes, GRAPH.edges, ZOOM);\n  $(\"canvas\").innerHTML = r.svg;\n  SVG_FULL = canvasSvg(GRAPH.nodes, GRAPH.edges, 1).svg;\n  $(\"canvasInfo\").textContent = \"ノード \" + GRAPH.nodes.length + \"個 / 表示倍率 \"\n                              + Math.round(ZOOM * 100) + \"%(\" + r.w + \" x \" + r.h + \")\";\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/yaml;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  document.body.appendChild(ta);\n  ta.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(ta);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\nasync function load(file){\n  $(\"tree\").value = await file.text();\n  $(\"drop\").querySelector(\"b\").textContent = file.name;\n}\n\n$(\"drop\").onclick = () => $(\"file\").click();\n$(\"file\").onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n$(\"drop\").ondragover = e => { e.preventDefault(); $(\"drop\").classList.add(\"hot\"); };\n$(\"drop\").ondragleave = () => $(\"drop\").classList.remove(\"hot\");\n$(\"drop\").ondrop = e => {\n  e.preventDefault();\n  $(\"drop\").classList.remove(\"hot\");\n  if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n};\n$(\"run\").onclick = run;\n$(\"sample\").onclick = () => {\n  $(\"tree\").value = SAMPLE_TREE;\n  $(\"drop\").querySelector(\"b\").textContent = \"サンプル(一般的な勘定科目・約200行)\";\n};\n$(\"clear\").onclick = () => {\n  $(\"tree\").value = \"\";\n  show(\"resultCard\", false);\n  show(\"yamlCard\", false);\n  show(\"canvasCard\", false);\n};\n$(\"zoomIn\").onclick = () => { ZOOM = Math.min(2, ZOOM * 1.4); drawCanvas(false); };\n$(\"zoomOut\").onclick = () => { ZOOM = Math.max(0.04, ZOOM / 1.4); drawCanvas(false); };\n$(\"zoomFit\").onclick = () => drawCanvas(true);\n$(\"dlsvg\").onclick = () => {\n  if(!SVG_FULL) return;\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([SVG_FULL], {type: \"image/svg+xml;charset=utf-8\"}));\n  a.download = \"orchestration.svg\";\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n};\n$(\"dl\").onclick = () => YAML && save(YAML, \"contract-account-classification.yml\");\n$(\"cp\").onclick = e => YAML && copy(YAML, e.target);\n<\/script>\n"}];
var GUIDE_TEXT = "";
var GUIDE_TITLE = "";
var GUIDE_HINT = "この手順書の全文を、社内のチャットAIに貼り付けてください。"
  + "続けて①で作ったツリーを貼ると、検査して修正後のツリーを返してきます。"
  + "返ってきたツリーは「②-2 検算」タブで元のツリーと照合してください。";

var nav = document.getElementById("nav");
var main = document.getElementById("main");
var step = document.getElementById("step");
var panes = [], cur = -1;

function makeGuide(){
  var d = document.createElement("div");
  d.className = "guide";
  var inner = document.createElement("div");
  inner.className = "inner";
  var card = document.createElement("div");
  card.className = "card";
  var h = document.createElement("h2");
  h.textContent = "チャットAIに貼る手順書";
  var p = document.createElement("p");
  p.textContent = GUIDE_HINT;
  var btn = document.createElement("button");
  btn.textContent = "手順書を全部コピーする";
  btn.onclick = function(){
    var ta = document.createElement("textarea");
    ta.value = GUIDE_TEXT;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    btn.textContent = "コピーしました";
    setTimeout(function(){ btn.textContent = "手順書を全部コピーする"; }, 1400);
  };
  var pre = document.createElement("pre");
  pre.textContent = GUIDE_TEXT;
  card.appendChild(h); card.appendChild(p); card.appendChild(btn); card.appendChild(pre);
  inner.appendChild(card); d.appendChild(inner);
  return d;
}

function select(i){
  if(cur === i) return;
  cur = i;
  for(var k = 0; k < panes.length; k++){
    if(panes[k]) panes[k].classList.toggle("hide", k !== i);
    nav.children[k].classList.toggle("on", k === i);
  }
  if(!panes[i]){
    var t = TOOLS[i];
    if(t.guide) panes[i] = makeGuide();
    else{
      var f = document.createElement("iframe");
      f.setAttribute("title", t.name);
      panes[i] = f;
      main.appendChild(f);
      f.srcdoc = t.html;
    }
    if(t.guide) main.appendChild(panes[i]);
    for(var k2 = 0; k2 < panes.length; k2++) if(panes[k2]) panes[k2].classList.toggle("hide", k2 !== i);
  }
  step.textContent = TOOLS[i].hint;
}

for(var i = 0; i < TOOLS.length; i++){
  panes.push(null);
  var b = document.createElement("button");
  b.textContent = TOOLS[i].name;
  b.onclick = (function(n){ return function(){ select(n); }; })(i);
  nav.appendChild(b);
}
select(0);
</script>
