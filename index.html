ize\n          }};\n}\n\n// ============================================================ 行の差分(LCS)\nfunction diffLines(rawA, rawB){\n  const a = rawA.map(normLine), b = rawB.map(normLine);\n  const n = a.length, m = b.length;\n  // 大きすぎる場合の保険\n  if(n * m > 4000000) return null;\n  const dp = [];\n  for(let i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));\n  for(let i = n - 1; i >= 0; i--){\n    for(let j = m - 1; j >= 0; j--){\n      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);\n    }\n  }\n  const out = [];\n  let i = 0, j = 0;\n  while(i < n && j < m){\n    if(a[i] === b[j]){\n      // 段・ラベル・コードが同じなら「変更なし」。\n      // ラベルとコードのあいだの空白の数だけが違っても、中身は同じなので区別しない\n      out.push([\"=\", rawB[j]]);\n      i++; j++;\n    }\n    else if(dp[i + 1][j] >= dp[i][j + 1]){ out.push([\"-\", rawA[i]]); i++; }\n    else { out.push([\"+\", rawB[j]]); j++; }\n  }\n  while(i < n){ out.push([\"-\", rawA[i]]); i++; }\n  while(j < m){ out.push([\"+\", rawB[j]]); j++; }\n  return out;\n}\n\n// ============================================================ 反映(7桁の検査結果 → 10桁ツリー)\nfunction makeCards(root, condition){\n  const stages = [];\n  let order = 0;\n  (function walk(n, depth){\n    for(const c of n.children){\n      if(c.children.length){\n        order++;\n        stages.push([depth + 1, order, c]);\n        walk(c, depth + 1);\n      }\n    }\n  })(root, 0);\n  stages.sort((a, b) => (b[0] - a[0]) || (a[1] - b[1]));\n  const total = stages.length;\n  const out = [];\n  out.push(\"# 検査カード(全\" + total + \"段・深い段から順)\");\n  out.push(\"\");\n  out.push(\"これは、②の検査でAIが確認すべき「段」を、プログラムが機械的に全部書き出したものです。\");\n  out.push(\"- AIの回答と見比べて、検討が抜けている段がないかを監視するチェックリストとして使えます\");\n  out.push(\"- 1枚ずつチャットAIに貼って回すこともできます(各カードが単独の質問になっています)\");\n  out.push(\"- どのやり方でも、たまった指示行をまとめて右の欄に貼れば一括で適用されます\");\n  out.push(\"\");\n  stages.forEach(function(st, i){\n    const n = st[2];\n    const path = labelPathOf(n).join(\"/\");\n    const sibs = n.parent ? n.parent.children.map(c => c.label) : [n.label];\n    // 昇格させた科目は「一つ上の段の選択肢」に並ぶので、\n    // 次はその段(=親の兄弟)で親が選ばれるかを確かめることになる\n    const gp = n.parent ? n.parent.parent : null;\n    const nextSibs = gp ? gp.children.map(c => c.label) : null;\n    out.push(\"─\".repeat(46));\n    out.push(\"カード \" + (i + 1) + \"/\" + total + \"  場所: \" + path + \"(対象\" + n.children.length + \"個)\");\n    out.push(\"\");\n    out.push(\"一つ上の段の選択肢: \" + sibs.join(\" / \"));\n    out.push(\"\");\n    out.push(\"確認してほしいこと(下の科目を1つずつ、必ず全部):\");\n    out.push(\"  契約書を読んだ人が、上の選択肢から1つ選ぶとします。\");\n    out.push(\"  その科目の契約なら「\" + n.label + \"」が選ばれますか?\");\n    out.push(\"  ・「\" + n.label + \"」が選ばれる可能性が高い → そのまま(何も書かない)\");\n    out.push(\"  ・別の選択肢が選ばれそう、または紛れる → 「昇格: ラベル [コード]」で1階層上へ\");\n    out.push(\"    (直し方は昇格だけ。科目を減らす・別の枝へ動かす指示はできず、考えは「指摘:」に)\");\n    out.push(\"\");\n    out.push(\"昇格させる場合は、そこで終わりにせず、次も必ず確かめてください:\");\n    if(nextSibs){\n      out.push(\"  昇格させると、その科目は「\" + n.parent.label + \"」の直下に並びます。\");\n      out.push(\"  すると次に選ぶ段は → \" + nextSibs.join(\" / \"));\n      out.push(\"  その科目の契約なら「\" + n.parent.label + \"」が選ばれますか?\");\n      out.push(\"  ・選ばれる → 「昇格: ラベル [コード]」(1段だけ)\");\n      out.push(\"  ・選ばれない → 「昇格: ラベル [コード] ×2」(収まるまで ×3 …)\");\n    }else{\n      out.push(\"  この段の科目を昇格させると、1段目(いちばん上)の選択肢に並びます。\");\n      out.push(\"  これ以上は上げられないので「×2」以上は書かないでください。\");\n    }\n    out.push(\"\");\n    out.push(\"対象の科目(\" + n.children.length + \"個):\");\n    for(const c of n.children){\n      if(c.code) out.push(\"  ・\" + c.label + \" [\" + c.code + \"]\");\n      else out.push(\"  ・\" + c.label + \"(枝・配下\" + c.children.length + \"個)\");\n    }\n    out.push(\"\");\n    out.push(\"指示で直せない気づき(紛らわしい名前など)は「指摘: 一言」と書いてください。\");\n    if(condition){\n      out.push(\"あわせて: 利用者が指定した絞り込みの条件があります。\");\n      out.push(\"  【条件】\" + condition);\n      out.push(\"  どう考えてもこの条件を満たさない科目は「除外: ラベル [コード]」と書いてください。\");\n      out.push(\"  少しでも満たす可能性がある科目は除外しないでください(迷ったら「指摘:」に)。\");\n      out.push(\"回答は「除外:」「昇格:」「指摘:」の行だけ\");\n    }else{\n      out.push(\"回答は「昇格:」「指摘:」の行だけ\");\n    }\n    out.push(\"(コードの無い選択肢は「\" + n.label + \"/ラベル」の形で書く)。\");\n    out.push(\"すべてそのままで良ければ「指示: なし」とだけ書いてください。\");\n    out.push(\"\");\n  });\n  return out.join(\"\\n\") + \"\\n\";\n}\n\nfunction treeTitleOf(text){\n  for(let line of treeBlock(text).split(\"\\n\")){\n    line = line.trim();\n    if(/^.+(1段目)$/.test(line)) return line;\n  }\n  return \"区分判定(1段目)\";\n}\n\nfunction copySubtree(n){\n  const c = new TNode(n.label);\n  c.leaf = n.leaf; c.star = n.star; c.lock = n.lock;\n  c.code = n.code; c.definition = n.definition;\n  for(const ch of n.children){\n    const cc = copySubtree(ch);\n    cc.parent = c;\n    c.children.push(cc);\n  }\n  return c;\n}\n\nfunction labelPathOf(n){\n  const out = [];\n  while(n !== null && n.parent !== null){ out.push(n.label); n = n.parent; }\n  return out.reverse();\n}\n\nfunction mergeApply(bRoot, aRoot, excludedCodes){\n  // excludedCodes: 絞り込みの条件で7桁側から除外したコード。\n  // その枝は復活させずに落とし、落とした10桁コードを report.dropped に入れる\n  const ex = new Set(excludedCodes || []);\n  const aCodes = [];\n  (function collect(n){\n    if(n.code) aCodes.push(n.code);\n    for(const c of n.children) collect(c);\n  })(aRoot);\n  if(!aCodes.length) throw Err(\"元のツリーにコードがありません(反映には ①が出力した10桁ツリーを使ってください)\");\n  const bLens = new Set();\n  (function blens(n){\n    if(n.code) bLens.add(n.code.length);\n    for(const c of n.children) blens(c);\n  })(bRoot);\n  if(!bLens.size) throw Err(\"検査後のツリーにコードがありません(反映には [コード] 付きのツリーが必要です)\");\n  const maxL = Math.max.apply(null, Array.from(bLens));\n  if(aCodes.some(c => c.length < maxL))\n    throw Err(\"元のツリー側にコードの短い行があります。反映機能は「葉に完全なコード」を持つツリー(①の出力する10桁ツリー)を元にしてください\");\n\n  const memo = new Map();\n  function prefset(n, L){\n    const key = String(L);\n    let m = memo.get(n);\n    if(!m){ m = {}; memo.set(n, m); }\n    if(m[key]) return m[key];\n    const out = new Set();\n    if(n.code && n.code.length >= L) out.add(n.code.slice(0, L));\n    for(const c of n.children) for(const x of prefset(c, L)) out.add(x);\n    m[key] = out;\n    return out;\n  }\n  const anchorMaps = {};\n  for(const L of bLens){\n    const out = {};\n    for(const c of aRoot.children){\n      (function walk(n, covered){\n        let here = covered;\n        if(!covered){\n          const ps = prefset(n, L);\n          if(ps.size === 1){\n            const P = Array.from(ps)[0];\n            (out[P] = out[P] || []).push(n);\n            here = true;\n          }\n        }\n        for(const cc of n.children) walk(cc, here);\n      })(c, false);\n    }\n    anchorMaps[L] = out;\n  }\n\n  const aDefs = {};\n  (function cdefs(n, path){\n    for(const c of n.children){\n      const key = path.concat([c.label]).join(\"\\u0000\");\n      if(c.definition) aDefs[key] = c.definition;\n      cdefs(c, path.concat([c.label]));\n    }\n  })(aRoot, []);\n\n  const report = {defs: 0, moves: [], notes: [], multi: [], dropped: []};\n  const used = new Set();\n  const newRoot = new TNode(aRoot.label);\n\n  function conv(bnode, parentNew, bpath){\n    if(bnode.code && !bnode.children.length){\n      const amap = anchorMaps[bnode.code.length] || {};\n      const targets = (amap[bnode.code] || []).filter(t => !used.has(t));\n      if(!targets.length){\n        report.notes.push(\"コード [\" + bnode.code + \"](\" + bnode.label\n                          + \")に対応する枝が元のツリーに見つかりません(そのまま新しい葉として置きます)\");\n        const nn = copySubtree(bnode);\n        nn.parent = parentNew;\n        parentNew.children.push(nn);\n        return;\n      }\n      if(targets.length > 1)\n        report.multi.push(\"[\" + bnode.code + \"] \" + bnode.label + \" … 同じコードの枝が\"\n                          + targets.length + \"箇所あり、全部を同じ場所へ移します\");\n      for(const t of targets){\n        used.add(t);\n        const oldParent = labelPathOf(t).slice(0, -1);\n        if(oldParent.join(\"\\u0000\") !== bpath.join(\"\\u0000\"))\n          report.moves.push(\"「\" + t.label + \"」: 「\" + (oldParent.join(\"/\") || \"(最上位)\")\n                            + \"」の配下 → 「\" + (bpath.join(\"/\") || \"(最上位)\") + \"」の配下\");\n        const nn = copySubtree(t);\n        if(bnode.definition){ nn.definition = bnode.definition; report.defs++; }\n        if(bnode.star) nn.star = true;\n        nn.parent = parentNew;\n        parentNew.children.push(nn);\n      }\n      return;\n    }\n    if(bnode.code && bnode.children.length)\n      report.notes.push(\"「\" + bnode.label + \"」はコードと配下の両方を持つため、枝として扱います\");\n    const nn = new TNode(bnode.label);\n    nn.star = bnode.star; nn.lock = bnode.lock;\n    nn.definition = bnode.definition || aDefs[bpath.concat([bnode.label]).join(\"\\u0000\")] || \"\";\n    if(bnode.definition) report.defs++;\n    nn.parent = parentNew;\n    parentNew.children.push(nn);\n    for(const c of bnode.children) conv(c, nn, bpath.concat([bnode.label]));\n  }\n  for(const c of bRoot.children) conv(c, newRoot, []);\n\n  for(const L of Object.keys(anchorMaps)){\n    const amap = anchorMaps[L];\n    for(const P of Object.keys(amap).sort()){\n      for(const t of amap[P]){\n        if(used.has(t)) continue;\n        used.add(t);\n        if(ex.has(P)){\n          for(const n of [t].concat([...all(t)])) if(n.code) report.dropped.push([n.code, n.label]);\n          continue;\n        }\n        const chain = labelPathOf(t).slice(0, -1);\n        let cur = newRoot;\n        for(const lab of chain){\n          const nxt = cur.children.find(c => c.label === lab);\n          if(!nxt) break;\n          cur = nxt;\n        }\n        const nn = copySubtree(t);\n        nn.parent = cur;\n        cur.children.push(nn);\n        report.notes.push(\"「\" + t.label + \"」は検査後のツリーに無かったため、元の位置(\"\n                          + (chain.join(\"/\") || \"最上位\") + \")に残しました\");\n      }\n    }\n  }\n  return {root: newRoot, report: report};\n}\n\nfunction renderTree(root, titleLine){\n  const lines = [titleLine];\n  function fmt(n){\n    let s = n.label;\n    if(n.lock) s += \" 🔒\";\n    if(n.star) s += \" ★\";\n    if(n.code) s += \" [\" + n.code + \"]\";\n    if(n.definition) s += \": \" + n.definition;\n    return s;\n  }\n  (function walk(n, prefix){\n    n.children.forEach(function(c, i){\n      const last = i === n.children.length - 1;\n      lines.push(prefix + (last ? \"└─ \" : \"├─ \") + fmt(c));\n      walk(c, prefix + (last ? \"    \" : \"│   \"));\n    });\n  })(root, \"\");\n  return lines.join(\"\\n\") + \"\\n\";\n}\n\nfunction codesSorted(root){\n  const out = [];\n  for(const n of all(root)) if(n.code) out.push(n.code);\n  return out.sort();\n}\n\n// ============================================================ 画面\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\");\nlet REPORT = \"\", DIFF = null, SHOW_ALL = false;\n\nfunction show(id, on){ $(id).classList.toggle(\"hide\", !on); }\n\nfunction statHtml(k, a, b){\n  const cls = a === b ? \"\" : (b < a ? \" dropped\" : \" changed\");\n  const v = a === b ? String(a) : (a + ' <span class=\"arw\">→<\/span> ' + b);\n  return '<div class=\"stat' + cls + '\"><div class=\"k\">' + k + '<\/div><div class=\"v\">' + v + \"<\/div><\/div>\";\n}\n\nfunction secHtml(kind, list){\n  let h = \"\";\n  for(const s of list){\n    h += '<div class=\"sec ' + kind + '\"><h4>' + esc(s.t) + \"<\/h4><ul>\";\n    for(const it of s.items) h += \"<li>\" + esc(it) + \"<\/li>\";\n    if(s.more > 0) h += \"<li>…ほか \" + s.more + \"件<\/li>\";\n    h += \"<\/ul><\/div>\";\n  }\n  return h;\n}\n\nfunction textReport(r, structA, structB){\n  const c = r.counts, L = [];\n  L.push(\"■ 数の比較(元 → 修正後)\");\n  L.push(\"  最終ラベル \" + c.leafA + \" → \" + c.leafB\n         + \" / 判定の段 \" + c.brA + \" → \" + c.brB\n         + \" / コード \" + c.codeA + \" → \" + c.codeB + \"(種類 \" + c.uniqA + \" → \" + c.uniqB + \")\");\n  const groups = [[\"重大\", r.bad], [\"注意\", r.warn], [\"参考\", r.info]];\n  for(const g of groups){\n    for(const s of g[1]){\n      L.push(\"\");\n      L.push(\"【\" + g[0] + \"】\" + s.t);\n      for(const it of s.items) L.push(\"  ・\" + it);\n      if(s.more > 0) L.push(\"  …ほか \" + s.more + \"件\");\n    }\n  }\n  if(structB.length){\n    L.push(\"\");\n    L.push(\"【重大】修正後のツリー自体の構造に問題があります \" + structB.length + \"件\");\n    for(const p of structB) L.push(\"  ・\" + p);\n  }\n  if(structA.length){\n    L.push(\"\");\n    L.push(\"(参考)元のツリーにも構造の問題が \" + structA.length + \"件ありました\");\n    for(const p of structA) L.push(\"  ・\" + p);\n  }\n  return L.join(\"\\n\");\n}\n\nfunction renderDiff(){\n  if(!DIFF){\n    $(\"diffLegend\").textContent = \"\";\n    $(\"diff\").textContent = \"(差分が大きすぎるため表示を省略しました)\";\n    return;\n  }\n  // 凡例は「実際に出ている色」だけを、件数つきで出す(出ていない色は説明しない)\n  const cnt = {\"-\": 0, \"+\": 0, \"=\": 0};\n  DIFF.forEach(d => { cnt[d[0]]++; });\n  const leg = [];\n  if(cnt[\"-\"]) leg.push('<b class=\"d\">− 赤<\/b> = 元のツリーにあって修正後に無い行(' + cnt[\"-\"] + \"行)\");\n  if(cnt[\"+\"]) leg.push('<b class=\"a\">＋ 緑<\/b> = 修正後に増えた行(' + cnt[\"+\"] + \"行)\");\n  leg.push(\"灰色 = 変わっていない行(\" + cnt[\"=\"] + \"行・長い場合は省略表示)\");\n  $(\"diffLegend\").innerHTML = leg.join(\" / \");\n  const keep = new Set();\n  if(!SHOW_ALL){\n    DIFF.forEach(function(d, i){\n      if(d[0] !== \"=\"){ for(let k = i - 2; k <= i + 2; k++) keep.add(k); }\n    });\n  }\n  let h = \"\", skipped = 0;\n  DIFF.forEach(function(d, i){\n    if(!SHOW_ALL && d[0] === \"=\" && !keep.has(i)){ skipped++; return; }\n    if(skipped){ h += '<span class=\"skip\">   … 変更のない ' + skipped + \"行 …<\/span>\"; skipped = 0; }\n    const mark = d[0] === \"-\" ? \"− \" : (d[0] === \"+\" ? \"＋ \" : \"  \");\n    const cls = d[0] === \"-\" ? \"del\" : (d[0] === \"+\" ? \"add\" : \"same\");\n    h += '<span class=\"' + cls + '\">' + esc(mark + d[1]) + \"<\/span>\";\n  });\n  if(skipped) h += '<span class=\"skip\">   … 変更のない ' + skipped + \"行 …<\/span>\";\n  $(\"diff\").innerHTML = h || \"(差分はありません)\";\n  $(\"toggleAll\").textContent = SHOW_ALL ? \"変更のあった行だけ表示する\" : \"変更のない行も全部表示する\";\n}\n\nlet OPS_TREE = \"\", LEAVES = \"\", LEAVES10 = \"\";\n\nfunction treeLineCount(text){\n  let n = 0;\n  for(const l of (text || \"\").split(\"\\n\")) if(LINE_RE.test(l.replace(/\\s+$/, \"\"))) n++;\n  return n;\n}\n\nfunction runOps(ta, tb){\n  const A = parse(ta);\n  const ORIG = parse(ta).root;          // 照合用の控え(適用前の姿)\n  const {ops, notes, bad, replies, minority} = voteOps(tb);\n  const nCode0 = all(A.root).filter(n => n.code).length;\n  const nLeaf0 = leavesOf(A.root).length;\n  const cond = $(\"taCond\").value.trim();\n  const r = applyOps(A.root, ops, !!cond);\n  EXCLUDED = r.excluded;\n  const nCode1 = all(A.root).filter(n => n.code).length;\n  const v = verifyTree(ORIG, A.root, r.excluded.map(x => x[1]));\n  const errs = A.errors.concat(bad.map(x => \"指示の形をしていますが読めませんでした: \" + x))\n    .concat(r.errors).concat(v.bad.slice(0, 30));\n  if(v.bad.length > 30) errs.push(\"…ほか \" + (v.bad.length - 30) + \"件の食い違い\");\n  LEAVES = leafTable(ORIG, A.root);\n  OPS_TREE = renderLikeSource(A.root, treeTitleOf(ta));\n  // 昇格で配下が空になった分類は、削除するか利用者に確認する(勝手には消さない)\n  OPS_STATE = {root: A.root, orig: ORIG, title: treeTitleOf(ta), source: ta};\n  showEmpty(findEmptyBranches(A.root));\n\n  $(\"stats\").innerHTML = statHtml(replies > 1 ? \"回答数(多数決)\" : \"読み取った指示\",\n                                  replies > 1 ? replies : ops.length,\n                                  replies > 1 ? replies : ops.length)\n    + (replies > 1 ? statHtml(\"採用した指示\", ops.length, ops.length) : \"\")\n    + statHtml(\"最終ラベル\", nLeaf0, leavesOf(A.root).length)\n    + statHtml(\"コードの数\", nCode0, nCode1)\n    + (r.excluded.length ? statHtml(\"条件で除外\", r.excluded.length, r.excluded.length) : \"\");\n  let secs = \"\";\n  const sec = (cls, title, items) => items.length\n    ? '<div class=\"sec ' + cls + '\"><h4>' + esc(title) + \"<\/h4><ul>\"\n      + items.slice(0, 40).map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\")\n      + (items.length > 40 ? \"<li>…ほか \" + (items.length - 40) + \"件<\/li>\" : \"\") + \"<\/ul><\/div>\" : \"\";\n  secs += sec(\"bad\", \"対応が必要な指示(AIに聞き直すか、行を直して再実行)\", errs);\n  if(replies > 1)\n    secs += sec(\"info\", \"多数決: 回答 \" + replies + \"件のうち過半数が一致した指示だけを適用しました\", []);\n  secs += sec(\"warn\", \"多数決で見送った指示(過半数に届かず・参考)\", minority);\n  secs += sec(\"info\", \"適用した指示\", r.applied);\n  if(r.excluded.length)\n    secs += sec(\"warn\", \"絞り込みの条件で除外した科目(\" + r.excluded.length + \"件・条件: \" + cond + \")\",\n                r.excluded.map(x => x[0] + \" [\" + x[1] + \"]\"));\n  secs += sec(v.ok ? \"info\" : \"bad\", \"検算(元 → 適用後の全数照合)\", v.summary);\n  secs += sec(\"warn\", \"AIからの指摘(参考)\", notes);\n  $(\"secs\").innerHTML = secs;\n\n  if(errs.length)\n    $(\"verdict\").innerHTML = '<div class=\"verdict warn\">一部の指示を適用できませんでした('\n      + errs.length + \"件)<small>適用できた分は反映済みです。下のエラー行だけAIに聞き直すか、手で直して再実行してください。<\/small><\/div>\";\n  else\n    $(\"verdict\").innerHTML = '<div class=\"verdict good\">指示を適用しました<small>コード '\n      + nCode0 + \"個 → \" + nCode1 + \"個\"\n      + (r.excluded.length ? \"(+ 条件で除外 \" + r.excluded.length + \"個。元 = 適用後 + 除外 で全数一致)\" : \"\")\n      + \"。全数照合ずみ(欠け・増えなし、コードと末端名の対応もすべて一致)。\"\n      + \"「末端とコードの一覧」で1件ずつ確認できます。<\/small><\/div>\";\n\n  $(\"opsBtns\").classList.remove(\"hide\");\n  $(\"opsOut\").classList.remove(\"hide\");\n  $(\"opsNote\").classList.remove(\"hide\");\n  $(\"opsOut\").textContent = OPS_TREE;\n  $(\"taM7\").value = OPS_TREE;\n  REPORT = [\"■ 指示の適用: \" + ops.length + \"件\"].concat(r.applied.map(x => \"  ・\" + x))\n    .concat(notes.map(x => \"  (指摘) \" + x))\n    .concat(errs.map(x => \"  × \" + x))\n    .concat([\"\", \"■ 検算(元 → 適用後の全数照合)\"])\n    .concat(v.summary.map(x => \"  ・\" + x)).join(\"\\n\");\n  // 差分表示: 元 vs 適用後\n  DIFF = diffLines(parse(ta).lines, parse(OPS_TREE).lines);\n  SHOW_ALL = false;\n  show(\"diffCard\", true);\n  renderDiff();\n}\n\nlet OPS_STATE = null;\n\nfunction showEmpty(list){\n  if(!list.length){ show(\"emptyCard\", false); return; }\n  $(\"emptyList\").innerHTML = list.map(n =>\n    \"<li>\" + esc(labelPathOf(n).join(\"/\")) + \"<\/li>\").join(\"\");\n  show(\"emptyCard\", true);\n}\n\n// 削除して、修正後ツリー・一覧・差分・反映用の入力をまとめて作り直す\n$(\"dropEmpty\").onclick = () => {\n  if(!OPS_STATE) return;\n  const st = OPS_STATE;\n  const removed = dropNodes(findEmptyBranches(st.root));\n  OPS_TREE = renderLikeSource(st.root, st.title);\n  LEAVES = leafTable(st.orig, st.root);\n  $(\"opsOut\").textContent = OPS_TREE;\n  $(\"taM7\").value = OPS_TREE;\n  DIFF = diffLines(parse(st.source).lines, parse(OPS_TREE).lines);\n  renderDiff();\n  const v = verifyTree(st.orig, st.root);   // 削除しても科目とコードは減っていないはず\n  REPORT += \"\\n\\n■ 配下が空になった分類の削除: \" + removed.length + \"件\\n\"\n    + removed.map(x => \"  ・\" + x).join(\"\\n\")\n    + \"\\n\\n■ 削除後の検算\\n\" + v.summary.map(x => \"  ・\" + x).join(\"\\n\");\n  $(\"secs\").innerHTML = '<div class=\"sec info\"><h4>配下が空になった分類を削除しました('\n    + removed.length + \"件)<\/h4><ul>\"\n    + removed.map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\")\n    + \"<\/ul><\/div>\"\n    + '<div class=\"sec ' + (v.ok ? \"info\" : \"bad\") + '\"><h4>削除後の検算(元 → いまの姿の全数照合)<\/h4><ul>'\n    + v.summary.map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\") + \"<\/ul><\/div>\"\n    + $(\"secs\").innerHTML;\n  show(\"emptyCard\", false);\n};\n$(\"keepEmpty\").onclick = () => show(\"emptyCard\", false);\n\nfunction run(){\n  const ta = $(\"taA\").value, tb = $(\"taB\").value;\n  show(\"resultCard\", true);\n  $(\"opsBtns\").classList.add(\"hide\");\n  $(\"opsOut\").classList.add(\"hide\");\n  $(\"opsNote\").classList.add(\"hide\");\n  if(!ta.trim() || !tb.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">左に元の7桁ツリー、右にAIの回答を入れてください<\/div>';\n    $(\"stats\").innerHTML = \"\"; $(\"secs\").innerHTML = \"\";\n    show(\"diffCard\", false);\n    REPORT = \"\";\n    return;\n  }\n  // AIの回答が「指示リスト」か「ツリー全文」かを自動判別\n  const opsParsed = parseOps(tb);\n  if(treeLineCount(tb) < 3 && (opsParsed.ops.length || opsParsed.notes.length || opsParsed.bad.length)){\n    runOps(ta, tb);\n    return;\n  }\n  if(treeLineCount(tb) < 3){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">AIの回答を読み取れませんでした<small>「昇格:」「指摘:」の指示リストか、ツリー全文を貼ってください。<\/small><\/div>';\n    $(\"stats\").innerHTML = \"\"; $(\"secs\").innerHTML = \"\";\n    show(\"diffCard\", false);\n    return;\n  }\n  // ツリー全文が返ってきた場合: 従来の差分チェック\n  const A = parse(ta), B = parse(tb);\n  const structA = A.errors.concat(structureCheck(A.root));\n  const structB = B.errors.concat(structureCheck(B.root));\n  const r = compare(A, B);\n\n  const c = r.counts;\n  $(\"stats\").innerHTML = statHtml(\"最終ラベル\", c.leafA, c.leafB)\n    + statHtml(\"判定の段\", c.brA, c.brB)\n    + statHtml(\"コードの数\", c.codeA, c.codeB)\n    + statHtml(\"コードの種類\", c.uniqA, c.uniqB);\n\n  let secs = secHtml(\"bad\", r.bad);\n  if(structB.length)\n    secs += secHtml(\"bad\", [{t: \"修正後のツリー自体の構造に問題があります \" + structB.length + \"件\",\n                             items: structB.slice(0, 30), more: structB.length - 30}]);\n  secs += secHtml(\"warn\", r.warn);\n  secs += secHtml(\"info\", r.info);\n  if(structA.length)\n    secs += secHtml(\"info\", [{t: \"(参考)元のツリーにも構造の問題が \" + structA.length + \"件ありました\",\n                              items: structA.slice(0, 20), more: structA.length - 20}]);\n  const nBad = r.bad.length + (structB.length ? 1 : 0);\n  const nWarn = r.warn.length;\n  if(!nBad && !nWarn && !r.info.length)\n    secs += '<div class=\"sec ok\"><h4>違いはありませんでした<\/h4>'\n          + \"<ul><li>2つのツリーは(記号や定義文を除いて)同じ内容です。<\/li><\/ul><\/div>\";\n  $(\"secs\").innerHTML = secs;\n\n  const defNote = \"\";\n  let v;\n  if(nBad) v = '<div class=\"verdict bad\">そのまま使わないでください（重大な指摘 ' + nBad\n             + \"件）<small>コードやラベルが失われている可能性があります。下の内容をAIに戻して直してもらってください。\"\n             + defNote + \"<\/small><\/div>\";\n  else if(nWarn) v = '<div class=\"verdict warn\">確認してから使ってください（注意 ' + nWarn\n             + \"件）<small>名前の書き換えや項目の増減があります。意図した変更かどうか目で確かめてください。\"\n             + defNote + \"<\/small><\/div>\";\n  else v = '<div class=\"verdict good\">そのまま使えます<small>コードもラベルも失われていません'\n         + (r.info.length ? \"(位置の変更や定義の追記は検査の成果です)。\" : \"。\") + defNote + \"<\/small><\/div>\";\n  $(\"verdict\").innerHTML = v;\n\n  REPORT = textReport(r, structA, structB);\n  DIFF = diffLines(A.lines, B.lines);\n  SHOW_ALL = false;\n  show(\"diffCard\", true);\n  renderDiff();\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/plain;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const t = document.createElement(\"textarea\");\n  t.value = text;\n  document.body.appendChild(t);\n  t.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(t);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\nfunction wire(dropId, fileId, taId){\n  const drop = $(dropId);\n  const load = async f => {\n    $(taId).value = await f.text();\n    drop.querySelector(\"b\").textContent = f.name;\n  };\n  drop.onclick = () => $(fileId).click();\n  $(fileId).onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n  drop.ondragover = e => { e.preventDefault(); drop.classList.add(\"hot\"); };\n  drop.ondragleave = () => drop.classList.remove(\"hot\");\n  drop.ondrop = e => {\n    e.preventDefault();\n    drop.classList.remove(\"hot\");\n    if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n  };\n}\nwire(\"dropA\", \"fileA\", \"taA\");\nwire(\"dropB\", \"fileB\", \"taB\");\nwire(\"dropM7\", \"fileM7\", \"taM7\");\nwire(\"dropM10\", \"fileM10\", \"taM10\");\n\nlet MERGED = \"\";\nlet EXCLUDED = [];   // 絞り込みの条件で除外した [ラベル, コード]\n$(\"runMerge\").onclick = () => {\n  const b7 = $(\"taM7\").value, a10 = $(\"taM10\").value;\n  const V = $(\"mergeVerdict\"), R = $(\"mergeReport\");\n  MERGED = \"\";\n  $(\"mergeBtns\").classList.add(\"hide\");\n  $(\"mergedOut\").classList.add(\"hide\");\n  if(!b7.trim() || !a10.trim()){\n    V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">2つのツリーを両方とも入れてください<\/div>';\n    R.innerHTML = \"\";\n    return;\n  }\n  try{\n    const B = parse(b7), A = parse(a10);\n    const r = mergeApply(B.root, A.root, EXCLUDED.map(x => x[1]));\n    const ca = codesSorted(A.root);\n    const cm = codesSorted(r.root);\n    const dropped = r.report.dropped.map(x => x[0]).sort();\n    const v = verifyTree(A.root, r.root, dropped);\n    const ok = v.ok && ca.join(\",\") === cm.concat(dropped).sort().join(\",\");\n    LEAVES10 = leafTable(A.root, r.root, \"末端とコードの一覧(10桁)\");\n    MERGED = renderTree(r.root, treeTitleOf(a10));\n    const rep = r.report;\n    let h = \"\";\n    const sec = (cls, title, items) => items.length\n      ? '<div class=\"sec ' + cls + '\"><h4>' + esc(title) + \"<\/h4><ul>\"\n        + items.slice(0, 30).map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\")\n        + (items.length > 30 ? \"<li>…ほか \" + (items.length - 30) + \"件<\/li>\" : \"\") + \"<\/ul><\/div>\"\n      : \"\";\n    if(ok)\n      V.innerHTML = '<div class=\"verdict good\" style=\"margin-top:12px\">反映しました'\n        + \"<small>コード \" + ca.length + \"個を全数照合しました\"\n        + (dropped.length ? \"(反映 \" + cm.length + \"個 + 条件で除外 \" + dropped.length + \"個 = 元の全コード)\"\n                          : \"(欠け・増えなし、コードと末端名の対応もすべて一致)\")\n        + \"。「末端とコードの一覧(10桁)」で1件ずつ確認できます。<\/small><\/div>\";\n    else\n      V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">反映結果に食い違いがあります('\n        + ca.length + \"個 → \" + cm.length + \"個)<small>この出力は使わないでください。入れたツリーの組み合わせを確認してください。<\/small><\/div>\";\n    h += sec(v.ok ? \"info\" : \"bad\", \"検算(元の10桁 → 反映後の全数照合)\", v.summary);\n    h += sec(\"bad\", \"食い違いの明細\", v.bad);\n    if(rep.dropped.length)\n      h += sec(\"warn\", \"絞り込みの条件により落とした10桁(\" + rep.dropped.length + \"科目)\",\n               rep.dropped.map(x => x[1] + \" [\" + x[0] + \"]\"));\n    h += sec(\"info\", \"位置の変わった枝(検査の成果)\", rep.moves);\n    h += sec(\"info\", \"同じコードが複数箇所にある枝\", rep.multi);\n    h += sec(\"warn\", \"注意\", rep.notes);\n    R.innerHTML = h;\n    if(ok){\n      $(\"mergeBtns\").classList.remove(\"hide\");\n      $(\"mergedOut\").classList.remove(\"hide\");\n      $(\"mergedOut\").textContent = MERGED;\n    }\n  }catch(e){\n    V.innerHTML = '<div class=\"verdict bad\" style=\"margin-top:12px\">反映できませんでした<small>'\n      + esc(e.message) + \"<\/small><\/div>\";\n    R.innerHTML = \"\";\n  }\n};\n$(\"dlMerged\").onclick = () => MERGED && save(MERGED, \"tree-10digit-merged.md\");\n$(\"dlLeaves10\").onclick = () => LEAVES10 && save(LEAVES10, \"leaf-codes-10digit.txt\");\n$(\"cpMerged\").onclick = e => MERGED && copy(MERGED, e.target);\n\n$(\"run\").onclick = run;\nconst VOTE_EXTRA = [\n  \"\",\n  \"---\",\n  \"\",\n  \"## 追加指示: 3人の検査役による多数決\",\n  \"\",\n  \"今回は、あなたの中で**独立した3人の検査役**として、互いの結果を見ずに順番に検査してください。\",\n  \"\",\n  \"- 検査役1: **深い段を重視**して検査する(一つ上の段の選択肢で親が選ばれるかを全科目確認 → 昇格)\",\n  \"- 検査役2: **浅い段(上のほうの分かれ目)を重視**して検査する(浅い段の誤配置ほど致命的)\",\n  \"- 検査役3: **全体を慎重に**、疑わしいものだけを挙げる\",\n  \"\",\n  \"出力は、検査役1の指示リスト、`----` だけの行、検査役2の指示リスト、`----` だけの行、\",\n  \"検査役3の指示リスト、の順で出してください。**多数決の集計はあなたはしません**\",\n  \"(受け取ったプログラムが行います)。指示リスト以外の文章は一切書かないでください。\"\n].join(\"\\n\");\n\nfunction exclExtra(){\n  const cond = $(\"taCond\").value.trim();\n  if(!cond) return \"\";\n  return [\n    \"\",\n    \"---\",\n    \"\",\n    \"## 追加指示: 絞り込みの条件(この検査に限り「除外:」を許可します)\",\n    \"\",\n    \"利用者が次の条件を指定しました。\",\n    \"\",\n    \"> 【条件】\" + cond,\n    \"\",\n    \"- 昇格の検査(上の手順)に加えて、**各科目がこの条件を満たしうるか**も1科目ずつ確認する\",\n    \"- **どう考えても条件を満たさない科目**は、次の形式で1行ずつ出力する\",\n    \"\",\n    \"        除外: ラベル [コード]\",\n    \"\",\n    \"- **少しでも満たす可能性がある科目・判断に迷う科目は除外しない**(削りすぎ防止。迷ったら「指摘:」に書く)\",\n    \"- 枝(コードの無い行)ごと除外したい場合は「除外: 親/ラベル」の形で書く\",\n    \"- この節がある場合に限り、手順書の「除外は書かない」より本節が優先されます\"\n  ].join(\"\\n\");\n}\n\n$(\"cpPrompt\").onclick = e => {\n  if(!$(\"taA\").value.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">先に左の欄へ元の7桁ツリーを入れてください<\/div>';\n    show(\"resultCard\", true);\n    return;\n  }\n  copy(GUIDE_TEXT + exclExtra() + \"\\n\\n---\\n\\n以下が対象のツリーです。\\n\\n\" + $(\"taA\").value, e.target);\n};\n$(\"cpPrompt3\").onclick = e => {\n  if(!$(\"taA\").value.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">先に左の欄へ元の7桁ツリーを入れてください<\/div>';\n    show(\"resultCard\", true);\n    return;\n  }\n  copy(GUIDE_TEXT + exclExtra() + VOTE_EXTRA + \"\\n\\n---\\n\\n以下が対象のツリーです。\\n\\n\" + $(\"taA\").value, e.target);\n};\n// 動作確認用サンプル(一般的な簿記の勘定科目のみ。実在のデータとは無関係)\nconst SAMPLE_TREE7 = `区分判定(1段目)\n├─ 資産\n│   ├─ 流動資産\n│   │   ├─ 現金                     [1010001]\n│   │   ├─ 小口現金                 [1010002]\n│   │   ├─ 預金                     [1010003]\n│   │   ├─ 受取手形                 [1010004]\n│   │   ├─ 売掛金                   [1010005]\n│   │   ├─ 有価証券                 [1010006]\n│   │   ├─ 商品                     [1010007]\n│   │   ├─ 製品                     [1010008]\n│   │   ├─ 原材料                   [1010009]\n│   │   ├─ 貯蔵品                   [1010010]\n│   │   ├─ 前払費用                 [1010011]\n│   │   ├─ 未収収益                 [1010012]\n│   │   ├─ 短期貸付金               [1010013]\n│   │   ├─ 立替金                   [1010014]\n│   │   └─ 仮払金                   [1010015]\n│   ├─ 有形固定資産\n│   │   ├─ 建物                     [1020001]\n│   │   ├─ 構築物                   [1020002]\n│   │   ├─ 機械装置                 [1020003]\n│   │   ├─ 車両運搬具               [1020004]\n│   │   ├─ 工具器具備品             [1020005]\n│   │   ├─ 土地                     [1020006]\n│   │   └─ 建設仮勘定               [1020007]\n│   ├─ 無形固定資産\n│   │   ├─ ソフトウェア             [1030001]\n│   │   ├─ のれん                   [1030002]\n│   │   ├─ 特許権                   [1030003]\n│   │   ├─ 商標権                   [1030004]\n│   │   └─ 借地権                   [1030005]\n│   └─ 投資その他の資産\n│       ├─ 投資                 [5020001]\n    │   ├─ 賞与                     [5020002]\n    │   ├─ 退職金                   [5020003]\n    │   ├─ 法定福利費               [5020004]\n    │   └─ 福利厚生費               [5020005]\n    ├─ 経費\n    │   ├─ 旅費交通費               [5030001]\n    │   ├─ 通信費                   [5030002]\n    │   ├─ 水道光熱費               [5030003]\n    │   ├─ 消耗品費                 [5030004]\n    │   ├─ 修繕費                   [5030005]\n    │   ├─ 地代家賃                 [5030006]\n    │   ├─ 保険料                   [5030007]\n    │   ├─ 租税公課                 [5030008]\n    │   ├─ 減価償却費               [5030009]\n    │   ├─ 広告宣伝費               [5030010]\n    │   ├─ 会議費                   [5030011]\n    │   ├─ 交際費                   [5030012]\n    │   ├─ 支払手数料               [5030013]\n    │   ├─ 教育研修費               [5030014]\n    │   ├─ 図書研究費               [5030015]\n    │   └─ 雑費                     [5030016]\n    ├─ 営業外費用\n    │   ├─ 支払利息                 [5040001]\n    │   ├─ 社債利息                 [5040002]\n    │   ├─ 為替差損                 [5040003]\n    │   └─ 雑損失                   [5040004]\n    └─ 特別損失\n        ├─ 固定資産売却損           [5050001]\n        ├─ 固定資産除却損           [5050002]\n        └─ 減損損失                 [5050003]\n`;\nconst SAMPLE_REPLY = [\n  \"昇格: 預金 [1010003]\",\n  \"昇格: 土地 [1020006]\",\n  \"昇格: 敷金保証金 [1040006] ×2\",\n  \"指示: なし\",\n  \"指摘: サンプルの回答です。「適用/チェックする」を押すと、この指示が機械的に適用されます\"\n].join(\"\\n\");\n\n$(\"sample2\").onclick = () => {\n  $(\"taA\").value = SAMPLE_TREE7;\n  $(\"taB\").value = SAMPLE_REPLY;\n  $(\"dropA\").querySelector(\"b\").textContent = \"サンプル7桁ツリー(一般的な勘定科目・99科目)\";\n  $(\"dropB\").querySelector(\"b\").textContent = \"サンプルのAI回答(指示リスト)\";\n  $(\"verdict\").innerHTML = '<div class=\"verdict good\" style=\"margin-top:0\">サンプルを入れました<small>「適用/チェックする」で指示の適用、「検査カードを作る」で全段のカード、「AIに貼るプロンプトをコピー」でプロンプト作成を試せます。実在のデータとは無関係な一般的な勘定科目です。<\/small><\/div>';\n  show(\"resultCard\", true);\n  $(\"stats\").innerHTML = \"\"; $(\"secs\").innerHTML = \"\";\n};\n\nlet CARDS = \"\";\n$(\"mkCards\").onclick = () => {\n  if(!$(\"taA\").value.trim()){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">先に左の欄へ元の7桁ツリーを入れてください<\/div>';\n    show(\"resultCard\", true);\n    return;\n  }\n  const A = parse($(\"taA\").value);\n  CARDS = makeCards(A.root, $(\"taCond\").value.trim() || null);\n  $(\"cardsOut\").textContent = CARDS;\n  show(\"cardsCard\", true);\n  $(\"cardsCard\").scrollIntoView({behavior: \"smooth\", block: \"start\"});\n};\n$(\"cpCards\").onclick = e => CARDS && copy(CARDS, e.target);\n$(\"dlCards\").onclick = () => CARDS && save(CARDS, \"inspection-cards.txt\");\n$(\"cpOps\").onclick = e => OPS_TREE && copy(OPS_TREE, e.target);\n$(\"dlOps\").onclick = () => OPS_TREE && save(OPS_TREE, \"tree-7digit-fixed.md\");\n$(\"cpLeaves\").onclick = e => LEAVES && copy(LEAVES, e.target);\n$(\"dlLeaves\").onclick = () => LEAVES && save(LEAVES, \"leaf-codes-7digit.txt\");\n$(\"clear\").onclick = () => {\n  $(\"taA\").value = \"\"; $(\"taB\").value = \"\";\n  show(\"resultCard\", false); show(\"diffCard\", false);\n};\n$(\"toggleAll\").onclick = () => { SHOW_ALL = !SHOW_ALL; renderDiff(); };\n$(\"cp\").onclick = e => REPORT && copy(REPORT, e.target);\n$(\"dl\").onclick = () => REPORT && save(REPORT, \"tree-check-report.txt\");\n<\/script>\n"}, {"name": "②-2 10桁の定義", "hint": "1つの7桁に複数の10桁がぶら下がるところに、会社独自の書き分け(定義)を書きます。③でAIの判定基準になります。", "html": "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>10桁の定義(7桁→10桁の書き分け)<\/title>\n<style>\n  :root{--bg:#f6f7f9;--card:#fff;--line:#d8dce1;--fg:#1b1d20;--sub:#5b6169;\n        --accent:#2f6fed;--accent-fg:#fff;--code-bg:#f2f4f7}\n  *{box-sizing:border-box}\n  body{margin:0;padding:20px;background:var(--bg);color:var(--fg);line-height:1.7;\n       font-family:\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;font-size:14px}\n  .wrap{max-width:1100px;margin:0 auto}\n  h1{font-size:18px;margin:0 0 4px}\n  .lead{color:var(--sub);font-size:13px;margin:0 0 16px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;\n        padding:16px;margin-bottom:16px}\n  h2{font-size:15px;margin:0 0 10px}\n  textarea{width:100%;height:200px;border:1px solid var(--line);border-radius:6px;\n           padding:10px;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n           font-size:12px;line-height:1.5;resize:vertical}\n  input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;\n        font-family:inherit;font-size:13px}\n  button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);\n         color:var(--fg);font-family:inherit;font-size:13px;cursor:pointer}\n  button:hover{border-color:var(--accent)}\n  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}\n  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}\n  .note{font-size:12px;color:var(--sub)}\n  .hide{display:none}\n  .drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;\n        color:var(--sub);cursor:pointer;margin-bottom:10px}\n  .drop.hot{border-color:var(--accent)}\n  .grp{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}\n  .grp h3{margin:0;padding:10px 12px;background:var(--code-bg);font-size:13px;font-weight:600}\n  .grp h3 small{color:var(--sub);font-weight:400;margin-left:8px}\n  .grp .rows{padding:6px 12px 10px}\n  .grp .row{display:flex;gap:10px;align-items:center;padding:4px 0}\n  .grp .row .nm{flex:0 0 240px;font-size:13px}\n  .grp .row .cd{flex:0 0 110px;font-family:\"Consolas\",monospace;font-size:12px;color:var(--sub)}\n  .grp .row input{flex:1 1 auto}\n  .verdict{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px}\n  .verdict.good{background:#e8f5ec;border:1px solid #9fd3ae}\n  .verdict.bad{background:#fdebea;border:1px solid #f2b3ae}\n  details.single{margin-top:4px}\n  details.single summary{cursor:pointer;font-size:13px;color:var(--sub)}\n  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px;\n      overflow:auto;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n      font-size:12px;line-height:1.5;max-height:50vh}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n<h1>10桁の定義(7桁→10桁の書き分け)<\/h1>\n<p class=\"lead\">\n  上7桁までは一般的な会計の分類で決まりますが、<b>下3桁は会社独自のルール<\/b>です。\n  1つの7桁に複数の10桁がぶら下がるところは、名前だけではAIが選べないことがあるので、\n  ここで<b>書き分けの定義<\/b>を書きます。書いた定義はツリーに埋め込まれ、\n  ③で作るワークフローの<b>判定基準としてそのままAIに渡ります<\/b>。\n  <b>すべてこのパソコンの中だけで処理され、外部には一切送信されません<\/b>(このページは通信しません)。\n<\/p>\n\n<div class=\"card\">\n  <h2>1. 10桁ツリーを入れる(②の反映後、または①の出力)<\/h2>\n  <div class=\"drop\" id=\"drop\"><b>ここに10桁ツリー(.md / .txt)をドラッグ&amp;ドロップ<\/b><br>\n    またはクリックしてファイルを選ぶ / 下の欄に貼り付け<\/div>\n  <input type=\"file\" id=\"file\" accept=\".md,.txt\" class=\"hide\">\n  <textarea id=\"src\" placeholder=\"②の「反映後の10桁ツリー」をそのまま貼ってください\"><\/textarea>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"make\">定義の入力欄を作る<\/button>\n    <button id=\"sample\">サンプルを入れる(動作確認用)<\/button>\n    <button id=\"clear\">入力を消す<\/button>\n    <span class=\"note\" style=\"align-self:center\">共通部分の桁数:\n      <input type=\"text\" id=\"split\" value=\"7\" style=\"width:50px\"><\/span>\n  <\/div>\n  <p class=\"note\" style=\"margin:8px 0 0\">\n    すでに定義が書いてあるツリーを貼ると、その定義が入力欄に入った状態で開きます(書き足し・修正ができます)。\n  <\/p>\n<\/div>\n\n<div class=\"card hide\" id=\"editCard\">\n  <h2>2. 書き分けの定義を書く<\/h2>\n  <p class=\"note\" style=\"margin:0 0 10px\">\n    同じ7桁の中の10桁は、<b>ここに書いた定義だけを頼りに<\/b>AIが選びます。\n    名前で区別がつくものは空欄のままで構いません。\n    「慶弔費: 従業員・取引先の慶弔に伴う支出」のように、<b>その科目を選ぶ条件<\/b>を1行で書いてください。\n  <\/p>\n  <div id=\"groups\"><\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"apply\">定義をツリーに書き込む<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"outCard\">\n  <h2>3. 定義入りの10桁ツリー(これを③に貼る)<\/h2>\n  <div id=\"verdict\"><\/div>\n  <div class=\"btns\" style=\"margin:0 0 10px\">\n    <button id=\"cp\">コピー<\/button>\n    <button id=\"dl\">保存<\/button>\n  <\/div>\n  <pre id=\"out\"><\/pre>\n<\/div>\n\n<\/div>\n<script>\n\"use strict\";\nconst $ = id => document.getElementById(id);\nconst show = (id, on) => $(id).classList.toggle(\"hide\", !on);\nconst esc = s => String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\");\n\nconst LINE_RE = /^((?:│   |    )*)(├─|└─) (.+)$/;\n\n// 1行を分解する。base = 定義とコードを除いた中身(◆★🔒の装飾は base に残す)\nfunction parseLine(raw){\n  const m = LINE_RE.exec(raw.replace(/\\s+$/, \"\"));\n  if(!m) return null;\n  let content = m[3];\n  let note = \"\";\n  const ni = content.indexOf(\" ……\");\n  if(ni >= 0){ note = content.slice(ni); content = content.slice(0, ni); }\n  let definition = \"\";\n  const di = content.indexOf(\": \");\n  if(di >= 0){ definition = content.slice(di + 2).trim(); content = content.slice(0, di); }\n  let code = null;\n  let mc = /\\s*\\[(\\d+)\\]\\s*$/.exec(content);\n  if(mc){ code = mc[1]; content = content.slice(0, mc.index); }\n  else if(definition){\n    // 「ラベル: 定義 [1234]」「ラベル: [1234] 定義」の形でもコードを拾う\n    mc = /\\s*\\[(\\d+)\\]\\s*$/.exec(definition) || /^\\[(\\d+)\\]\\s*/.exec(definition);\n    if(mc){\n      code = mc[1];\n      definition = (definition.slice(0, mc.index) + definition.slice(mc.index + mc[0].length)).trim();\n    }\n  }\n  const label = content.replace(/◆ ?|★|🔒/g, \"\").trim();\n  return {indent: m[1], branch: m[2], base: content.replace(/\\s+$/, \"\"),\n          code: code, definition: definition, note: note, label: label,\n          depth: m[1].length / 4};\n}\n\nfunction rebuildLine(p, def){\n  let s = p.indent + p.branch + \" \" + p.base;\n  if(p.code) s += \" [\" + p.code + \"]\";\n  if(def) s += \": \" + def;\n  return s + p.note;\n}\n\nlet LINES = null;     // [{raw, parsed|null}]\nlet ITEMS = null;     // コード付き行: {lineIdx, parsed, path}\nlet OUT = \"\";\n\nfunction analyze(){\n  const split = parseInt($(\"split\").value, 10) || 7;\n  const text = $(\"src\").value;\n  if(!text.trim()){ alert(\"先に10桁ツリーを入れてください\"); return; }\n  LINES = text.split(\"\\n\").map(raw => ({raw: raw, parsed: parseLine(raw)}));\n  ITEMS = [];\n  const stack = [];\n  let coded = 0, shortCodes = 0;\n  LINES.forEach(function(l, i){\n    const p = l.parsed;\n    if(!p) return;\n    stack.length = p.depth;\n    stack[p.depth] = p.label;\n    if(p.code){\n      coded++;\n      if(p.code.length <= split){ shortCodes++; return; }\n      ITEMS.push({lineIdx: i, parsed: p, path: stack.slice(0, p.depth).join(\"/\")});\n    }\n  });\n  if(!coded){\n    alert(\"コード [数字] の付いた行が見つかりませんでした。①または②の10桁ツリーを貼ってください。\");\n    return;\n  }\n  if(!ITEMS.length){\n    alert(\"上\" + split + \"桁より長いコードがありません。7桁ツリーではなく10桁ツリーを貼ってください。\");\n    return;\n  }\n  // 7桁ごとにまとめる(出現順)\n  const groups = new Map();\n  for(const it of ITEMS){\n    const key = it.parsed.code.slice(0, split);\n    if(!groups.has(key)) groups.set(key, []);\n    groups.get(key).push(it);\n  }\n  const multi = [...groups].filter(g => g[1].length >= 2);\n  const single = [...groups].filter(g => g[1].length === 1);\n\n  const rowHtml = it =>\n    '<div class=\"row\"><span class=\"nm\">' + esc(it.parsed.label) + \"<\/span>\"\n    + '<span class=\"cd\">[' + esc(it.parsed.code) + \"]<\/span>\"\n    + '<input type=\"text\" data-line=\"' + it.lineIdx + '\" value=\"' + esc(it.parsed.definition).replace(/\"/g, \"&quot;\")\n    + '\" placeholder=\"この科目を選ぶ条件(空欄=名前だけで判定)\"><\/div>';\n  const grpHtml = (g, need) =>\n    '<div class=\"grp\"><h3>' + esc(g[1][0].path) + \" <small>7桁 \" + esc(g[0]) + \" / \"\n    + g[1].length + \"個の10桁\" + (need ? \"(書き分けが必要)\" : \"\") + \"<\/small><\/h3>\"\n    + '<div class=\"rows\">' + g[1].map(rowHtml).join(\"\") + \"<\/div><\/div>\";\n\n  let h = multi.map(g => grpHtml(g, true)).join(\"\");\n  if(single.length){\n    h += '<details class=\"single\"><summary>10桁が1つだけの7桁(' + single.length\n       + \"件・書き分け不要。定義を書きたい場合だけ開く)<\/summary>\"\n       + single.map(g => grpHtml(g, false)).join(\"\") + \"<\/details>\";\n  }\n  $(\"groups\").innerHTML = h;\n  show(\"editCard\", true);\n  show(\"outCard\", false);\n  const el = $(\"editCard\");\n  el.scrollIntoView({behavior: \"smooth\", block: \"start\"});\n}\n\nfunction apply(){\n  const defs = {};\n  for(const inp of $(\"groups\").querySelectorAll(\"input[data-line]\"))\n    defs[inp.getAttribute(\"data-line\")] = inp.value.trim();\n  const outLines = LINES.map(function(l, i){\n    if(!(i in defs)) return l.raw;\n    return rebuildLine(l.parsed, defs[i]);\n  });\n  OUT = outLines.join(\"\\n\");\n  // 検算: コードの集合とラベルが変わっていないこと\n  const codesOf = t => (t.match(/\\[(\\d+)\\]/g) || []).sort().join(\",\");\n  const before = codesOf($(\"src\").value), after = codesOf(OUT);\n  const nDefs = Object.keys(defs).filter(k => defs[k]).length;\n  if(before !== after){\n    $(\"verdict\").innerHTML = '<div class=\"verdict bad\">コードが変わってしまいました。この結果は使わないでください<\/div>';\n  }else{\n    $(\"verdict\").innerHTML = '<div class=\"verdict good\">定義を ' + nDefs\n      + \"個 書き込みました。コードは1つも変わっていません(全数照合ずみ)。\"\n      + \"このツリーをそのまま③に貼ってください。<\/div>\";\n  }\n  $(\"out\").textContent = OUT;\n  show(\"outCard\", true);\n  $(\"outCard\").scrollIntoView({behavior: \"smooth\", block: \"start\"});\n}\n\nconst SAMPLE = `区分判定(1段目)\n├─ 資産\n│   └─ 流動資産\n│       └─ 預金\n│           ├─ 普通預金           [1010003001]\n│           ├─ 当座預金           [1010003002]\n│           └─ 定期預金           [1010003003]\n└─ 費用\n    └─ 経費\n        ├─ 交際費\n        │   ├─ 慶弔費             [5030012001]\n        │   ├─ 接待飲食費         [5030012002]\n        │   └─ その他交際費       [5030012003]\n        ├─ 通信費                 [5030002001]\n        └─ 旅費交通費\n            ├─ 近距離交通費       [5030001001]\n            └─ 出張旅費           [5030001002]\n`;\n\n$(\"make\").onclick = analyze;\n$(\"apply\").onclick = apply;\n$(\"sample\").onclick = () => { $(\"src\").value = SAMPLE; analyze(); };\n$(\"clear\").onclick = () => {\n  $(\"src\").value = \"\";\n  show(\"editCard\", false); show(\"outCard\", false);\n};\n$(\"cp\").onclick = e => {\n  const ta = document.createElement(\"textarea\");\n  ta.value = OUT;\n  document.body.appendChild(ta);\n  ta.select();\n  try{ document.execCommand(\"copy\"); }catch(err){}\n  document.body.removeChild(ta);\n  e.target.textContent = \"コピーしました\";\n  setTimeout(() => { e.target.textContent = \"コピー\"; }, 1400);\n};\n$(\"dl\").onclick = () => {\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([OUT], {type: \"text/plain;charset=utf-8\"}));\n  a.download = \"tree-10digit-defined.md\";\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n};\n$(\"drop\").onclick = () => $(\"file\").click();\n$(\"file\").onchange = async e => {\n  if(e.target.files[0]) $(\"src\").value = await e.target.files[0].text();\n  e.target.value = \"\";\n};\n$(\"drop\").ondragover = e => { e.preventDefault(); $(\"drop\").classList.add(\"hot\"); };\n$(\"drop\").ondragleave = () => $(\"drop\").classList.remove(\"hot\");\n$(\"drop\").ondrop = async e => {\n  e.preventDefault();\n  $(\"drop\").classList.remove(\"hot\");\n  if(e.dataTransfer.files[0]) $(\"src\").value = await e.dataTransfer.files[0].text();\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "③ ツリーからDify", "hint": "分類ツリーから、Dify に取り込むワークフロー定義(YAML)を作ります。", "html": "<title>ツリーからDifyワークフロー<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{\n    --bg:#f6f7f9; --fg:#1b1d20; --sub:#5b6169; --line:#d8dce1; --card:#ffffff;\n    --accent:#2f6fed; --accent-fg:#ffffff; --warn:#8a4b00; --warn-bg:#fff5e6;\n    --ok:#0f6b3f; --ok-bg:#eaf7f0; --code-bg:#f2f4f7;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;padding:24px 16px 80px;background:var(--bg);color:var(--fg);\n       font-family:\"Yu Gothic UI\",\"Yu Gothic\",\"Meiryo\",system-ui,sans-serif;line-height:1.7}\n  .wrap{max-width:1040px;margin:0 auto}\n  h1{font-size:22px;margin:0 0 4px}\n  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}\n  .card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}\n  #drop{border:2px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;\n        background:var(--card);cursor:pointer;transition:.15s;margin-bottom:12px}\n  #drop.hot{border-color:var(--accent);background:#eef3fe}\n  #drop b{display:block;font-size:15px;margin-bottom:2px}\n  #drop span{color:var(--sub);font-size:13px}\n  textarea{width:100%;height:240px;padding:10px;border:1px solid var(--line);border-radius:6px;\n           font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;font-size:13px;\n           line-height:1.5;background:#fff;color:var(--fg);white-space:pre;overflow-wrap:normal}\n  button{padding:8px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;\n         color:var(--fg);font-size:14px;font-family:inherit;cursor:pointer}\n  button:hover{background:#f0f2f5}\n  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}\n  button.primary:hover{filter:brightness(1.08)}\n  button:disabled{opacity:.5;cursor:not-allowed}\n  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}\n  #canvas{overflow:auto;max-height:70vh;border:1px solid var(--line);\n          border-radius:6px;background:#f7f8fa}\n  /* 全画面表示。Fullscreen APIが使えない場合(iframe内で許可が無いときなど)は\n     .pseudo-full で画面いっぱいに広げる。どちらでも見え方は同じにする */\n  #canvasCard:fullscreen, #canvasCard.pseudo-full{\n    background:var(--card);padding:16px;overflow:hidden;border-radius:0;margin:0;\n    display:flex;flex-direction:column}\n  #canvasCard.pseudo-full{position:fixed;inset:0;z-index:9999}\n  #canvasCard:fullscreen #canvas, #canvasCard.pseudo-full #canvas{\n    flex:1 1 auto;max-height:none}\n  #canvasCard:fullscreen h2, #canvasCard.pseudo-full h2{margin-top:0}\n  #canvasCard:fullscreen .note, #canvasCard.pseudo-full .note{flex:0 0 auto}\n  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px;\n      overflow:auto;max-height:520px;font-family:\"BIZ UDGothic\",\"MS Gothic\",\"Consolas\",monospace;\n      font-size:12px;line-height:1.5;margin:0;white-space:pre}\n  .log{white-space:pre-wrap;font-size:13px}\n  .warn{background:var(--warn-bg);border:1px solid #f0d6a8;color:var(--warn);\n        border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .ok{background:var(--ok-bg);border:1px solid #b8e0cb;color:var(--ok);\n      border-radius:6px;padding:12px;margin-top:12px;font-size:14px}\n  .warn ul,.ok ul{margin:6px 0 0;padding-left:20px}\n  .hide{display:none}\n  .note{font-size:12px;color:var(--sub);margin-top:8px}\n  .exp-hit{background:#fff3d6;border-radius:6px;transition:background .4s}\n  #canvas g[data-nid]{cursor:pointer}\n<\/style>\n\n<div class=\"wrap\">\n<h1>分類ツリーから Dify ワークフローを作る<\/h1>\n<p class=\"lead\">\n  分類ツリー(.md)を貼るか落とすと、Difyにインポートできる DSL(YAML)を作ります。\n  <b>ファイルはこのブラウザの中だけで処理され、どこにも送信されません<\/b>(通信は一切行いません)。\n<\/p>\n\n<div class=\"card\">\n  <h2>1. 分類ツリーを入れる<\/h2>\n  <div id=\"drop\">\n    <b>ここに分類ツリー(.md / .txt)をドラッグ&amp;ドロップ<\/b>\n    <span>またはクリックしてファイルを選ぶ / 下の欄に直接貼り付けてもOK<\/span>\n    <input type=\"file\" id=\"file\" accept=\".md,.txt\" class=\"hide\">\n  <\/div>\n  <textarea id=\"tree\" placeholder=\"区分判定(1段目)&#10;├─ 資産&#10;│   ├─ 流動資産&#10;│   │   ├─ 現金&#10;…\"><\/textarea>\n  <div class=\"note\">\n    「Excelからツリー.html」で作ったツリー、または検査後のツリーをそのまま貼ってください\n    (```で囲まれたコードブロックが入っていても、そのまま貼って大丈夫です)。\n  <\/div>\n  <div style=\"margin:10px 0;border:1px dashed var(--line);border-radius:8px;padding:12px\">\n    <label style=\"font-size:12px;color:var(--sub)\">アプリの形式<\/label>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 10px;font-size:13px\">\n      <label><input type=\"radio\" name=\"appStyle\" id=\"styleChat\" checked>\n        <b>チャット形式(推奨)<\/b> — 契約書をチャットに添付して会話で進める。読み取った事実を表で確認 →\n        AIが<b>一般的な仕訳の流れ<\/b>(場面ごとの借方/貸方)を作成 → <b>各行に勘定科目コードを機械付与<\/b>。\n        科目名はツリー由来のリストで統制。入り口は社内の「契約仕訳アシスタント」と同一設定<\/label>\n      <label><input type=\"radio\" name=\"appStyle\" id=\"styleForm\">\n        フォーム形式 — 分類ツリーを1段ずつ下りる段階判定で主科目1つを決める従来の形(入力欄で実行)<\/label>\n    <\/div>\n    <label style=\"font-size:12px;color:var(--sub)\">使うAIモデル(全ノード共通で書き込みます)<\/label>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:13px;align-items:center\">\n      プロバイダー <input type=\"text\" id=\"mProvider\" value=\"langgenius/azure_openai/azure_openai\" style=\"width:320px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:Consolas,monospace\">\n      モデル名 <input type=\"text\" id=\"mName\" value=\"GPT-4o\" style=\"width:220px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:Consolas,monospace\">\n    <\/div>\n    <div class=\"note\" style=\"margin-top:6px\">\n      ここに入れた値が<b>すべてのAIノードに最初から設定された状態<\/b>でDSLができるので、\n      Difyにインポートしたらそのまま動きます(ノードを1つずつ選び直す必要はありません)。<br>\n      <b>確実な調べ方<\/b>: そのモデルで動いている既存のDifyアプリを「DSLエクスポート」し、\n      中の <code>model:<\/code> の <code>provider:<\/code> と <code>name:<\/code> の値をそのまま写してください\n      (会社の環境によって <code>openai<\/code> / <code>azure_openai<\/code> /\n      <code>langgenius/openai/openai<\/code> のように書き方が違うためです)。\n    <\/div>\n  <\/div>\n  <div class=\"btns\">\n    <button class=\"primary\" id=\"run\">DSLを作る<\/button>\n    <button id=\"sample\">サンプルを入れる(動作確認用)<\/button>\n    <button id=\"clear\">入力を消す<\/button>\n  <\/div>\n  <div class=\"note\">\n    「サンプルを入れる」は、一般的な簿記の勘定科目だけで作った約200行のサンプルツリーを入力欄に入れます\n    (実在のデータとは無関係です)。そのまま「DSLを作る」を押すと、変換とオーケストレーション表示を確認できます。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"resultCard\">\n  <h2>2. 結果<\/h2>\n  <div id=\"summary\" class=\"log\"><\/div>\n  <div id=\"checks\"><\/div>\n  <div class=\"btns\">\n    <button id=\"dl\">DSL(YAML)を保存<\/button>\n    <button id=\"cp\">DSLをコピー<\/button>\n  <\/div>\n  <div class=\"note\">\n    次: Dify の「アプリを作成 → DSLファイルをインポート」で取り込んでください。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"canvasCard\">\n  <h2>3. Difyでの見え方(オーケストレーション)<\/h2>\n  <div class=\"btns\" style=\"margin:0 0 10px\">\n    <button id=\"zoomOut\">縮小<\/button>\n    <button id=\"zoomIn\">拡大<\/button>\n    <button id=\"zoomFit\">全体を表示<\/button>\n    <button id=\"fullscreen\">全画面表示<\/button>\n    <button id=\"dlsvg\">図を保存(SVG)<\/button>\n    <span class=\"note\" id=\"canvasInfo\" style=\"margin:0 0 0 8px;align-self:center\"><\/span>\n  <\/div>\n  <div id=\"canvas\"><\/div>\n  <div class=\"note\">\n    この図はDSLに書かれたノードの座標をそのまま描いたものです。Difyに取り込むと同じ配置で表示されます\n    (図の生成もこのブラウザの中だけで行っています)。\n    <b>ノードをクリックすると、ページ下部の解説の該当箇所へ移動します<\/b>\n    (ツリー部分の判定ノードは「ツリーの部分」の説明へ)。\n  <\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"yamlCard\">\n  <h2>3. できたDSL<\/h2>\n  <pre id=\"yaml\"><\/pre>\n<\/div>\n\n<div class=\"card\">\n  <h2>解説: このワークフローの全体像(ツリーの前後で何をしているか)<\/h2>\n\n  <p class=\"lead\" style=\"margin:0 0 12px\">\n    <b>ひとことで言うと<\/b>: 契約書を読み込むと、AIがまず内容を要約して<b>認識が合っているかを人に確認<\/b>し、\n    そのうえで分類ツリーを上から順にたどって勘定科目を1つに絞り込みます。\n    <b>勘定科目コードはAIに決めさせず<\/b>、たどった道すじから対応表で機械的に確定します。\n    判断に必要な情報が契約書に無いときは、勝手に決めずに<b>人へ質問を返します<\/b>。\n  <\/p>\n  <p class=\"lead\" style=\"margin:0 0 12px\">\n    <b>2つの形式<\/b>: <b>チャット形式(推奨)<\/b>は、契約書をチャットに添付して会話で進めるチャットフローです。\n    読み取った事実を表で確認したあと、AIが<b>この契約で発生する一般的な仕訳の流れ<\/b>(契約時・検収時・支払時…の\n    借方/貸方)を作成し、<b>各行の科目に勘定科目コードをプログラムが機械付与<\/b>します\n    (科目名はツリー由来のリストで統制し、コードはAIに触れさせません)。\n    ファイルの受け取り方・読み方(sys.files+テキスト抽出+AI直接読み取り)は、社内で実績のある\n    「契約仕訳アシスタント」とまったく同じ設定です。フォーム形式は、分類ツリーを1段ずつ下りる\n    段階判定で主科目1つを決める従来の形です。\n  <\/p>\n\n  <pre style=\"max-height:none\">開始 → テキスト抽出(文字が取れなければAIがファイルを直接読む) → 契約内容サマリー → 認識確認 ─┬→ (初回)確認要求 ─────────┐\n                                                    └→ ツリー判定(区分 → 小区分 → 細分…) │\n                                                         ↓                              │\n                          変数集約 → 経路組み立て → コード確定 → 更問いチェック ─┬→ 仕訳生成 ─┴→ 出力\n                                                                              └→ (質問あり)そのまま出力<\/pre>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ ツリーの前(自動で入る前処理)<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li id=\"exp-start\"><b>開始<\/b> — 入力は2つ。<b>契約書ファイル<\/b>(PDF / Word / テキスト / スキャン画像・必須。\n      <b>この1欄に最大10ファイル<\/b>までまとめて入れられます)、\n      <b>補足情報<\/b>(任意のテキスト欄。「質問への回答」と「読み取りの訂正」を書く場所)<\/li>\n    <li id=\"exp-extract\"><b>契約書テキスト抽出<\/b> — 契約書ファイル(文書)から本文テキストを取り出します(ここではAIを使いません)。\n      <b>スキャン(画像)のPDFや画像からは文字を取り出せない<\/b>ので、その場合は次のAI読み取りに回ります<\/li>\n    <li id=\"exp-vision\"><b>契約書ファイルの読み取り<\/b>(AIが担当) — テキスト抽出で<b>文字が1文字も取れなかったときだけ<\/b>動きます。\n      添付されたファイル(スキャンPDF・画像)をAIがそのまま見て、契約書の本文を<b>忠実に全文文字起こし<\/b>します\n      (要約・推測はしない、読めない字は〓)。以降はその本文で判定します。\n      文字が取れたときはこのノードは実行されず、追加の費用もかかりません。\n      <b>スキャンPDFをそのまま読めるかは使うAIモデル次第<\/b>です(Claude / Bedrock系: PDFごと読める。\n      GPT-4o系: 画像は読めるがPDFの直読みは不可)。AIでも読めなかった場合は判定に進まず、\n      <b>「ページを画像にして契約書ファイル欄に追加するか、PDFを直接読めるモデルに切り替えてください」という案内<\/b>を返します<\/li>\n    <li id=\"exp-summary\"><b>契約内容サマリー<\/b>(AIが担当) — 契約名・当事者と自社の立場・主目的・主要条件・特記事項を読み取り、\n      <b>認識確認用の要約<\/b>を作ります。補足情報に訂正が書かれていれば反映します<\/li>\n    <li id=\"exp-confirm\"><b>条件分岐(認識確認)<\/b> — <b>補足情報が空(=初回実行)なら分類に進みません<\/b>。\n      「読み取り内容を確認し、補足情報欄に回答して再実行してください」という<b>確認要求<\/b>だけを返して終わります。\n      読み取りの誤りが全分類に波及するのを防ぐ安全弁です。2回目以降(補足情報に何か書いてある)は分類へ進みます<\/li>\n  <\/ul>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ ツリーの部分(あなたのツリーから自動生成)<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li id=\"exp-tree\">ツリーの1段が「AIが選択肢を1つ選ぶ → 選んだ先へ進む」の1組になります。\n      上の段から順に絞り込み、いちばん下の科目に到達したら判定終了です<\/li>\n  <\/ul>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ ツリーの後(自動で入る後処理)<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li id=\"exp-agg\"><b>変数集約<\/b> — 通ってきた段の結果を集めます(いちばん深い判定を採用)<\/li>\n    <li id=\"exp-path\"><b>経路組み立て<\/b> — 通ってきた段を「流動資産/現金・預金/預金」のように<b>「/」で連結<\/b>します。\n      これが出力 <code>main_account<\/code> です<\/li>\n    <li id=\"exp-code\"><b>コード確定<\/b> — 経路を、環境変数 <code>code_map<\/code>(ツリーから自動生成した対応表)と\n      <b>照合して勘定科目コードを決めます。AIには決めさせません<\/b>(推測でコードを作らせないため)。\n      途中の段で止まった場合は共通7桁まで、対応表に無ければ「コード未登録」。これが <code>account_code<\/code> です<\/li>\n    <li id=\"exp-qcheck\"><b>条件分岐(更問いチェック)<\/b> — 判定結果が「質問」で始まっていたら、仕訳を作らずその質問を出力へ流します<\/li>\n    <li id=\"exp-journal\"><b>仕訳生成<\/b>(AIが担当) — 判定済みの主科目を使い、<b>金額なしの仕訳<\/b>を1本作ります:\n      借方/貸方/確信度(高・中・低)/確信度の補足/誤分類時の影響(高・中・低と理由)<\/li>\n    <li id=\"exp-end\"><b>終了<\/b> — 4つを出力: <code>contract_summary<\/code>(認識確認用の要約)/\n      <code>classification_result<\/code>(仕訳、または質問)/\n      <code>main_account<\/code>(判定経路)/ <code>account_code<\/code>(勘定科目コード)<\/li>\n  <\/ul>\n\n  <h3 style=\"font-size:14px;margin:16px 0 6px\">■ 更問い(情報が足りないとき)の仕組み<\/h3>\n  <ul style=\"font-size:14px;margin:0;padding-left:20px\">\n    <li>判定の各段のAIには「<b>契約書と補足情報を読んでも判定に必要な情報が足りないときは、\n      ラベルの代わりに質問を出せ<\/b>」という指示が入っています。形式は\n      「質問: …(選択式で答えられる聞き方)」「回答例: … / …」の2行で、<b>1回につき質問は1つだけ<\/b>です<\/li>\n    <li>質問が出ると、その先の判定と仕訳はせず、質問がそのまま <code>classification_result<\/code> に出ます。\n      ただし<b>確定した段までの経路と共通7桁コードは出ます<\/b>(途中経過が無駄になりません)<\/li>\n    <li>利用者は、質問への回答を<b>「補足情報」欄に追記して再実行<\/b>します。全段のプロンプトが\n      補足情報を「過去の質問への回答」として読むので、前回の判定を引き継いで先へ進めます<\/li>\n    <li>情報不足ではなく「判定材料はあるがどれか紛れる」場合は、質問せずに\n      その段の<b>受け皿(★のラベル)<\/b>へ倒します。質問は情報不足のときだけです<\/li>\n  <\/ul>\n\n  <div class=\"note\">\n    ここに書いた前後のノードとプロンプトは、③がツリーから毎回自動で組み込むものです(手作業は不要)。\n    生成後に上のオーケストレーション図で実物のノード配置を確認できます。\n  <\/div>\n<\/div>\n\n<\/div>\n\n<script>\n\"use strict\";\n\n// <<EXTRAS>>\nconst EXTRAS_JSON = \"{\\\"app\\\":{\\\"description\\\":\\\"\\\",\\\"icon\\\":\\\"📑\\\",\\\"icon_background\\\":\\\"#FFEAD5\\\",\\\"mode\\\":\\\"workflow\\\",\\\"name\\\":\\\"契約書 勘定科目区分分類\\\",\\\"use_icon_as_answer_icon\\\":false},\\\"features\\\":{\\\"file_upload\\\":{\\\"allowed_file_extensions\\\":[\\\".PDF\\\",\\\".TXT\\\",\\\".MD\\\",\\\".MARKDOWN\\\",\\\".DOCX\\\",\\\".PNG\\\",\\\".JPG\\\",\\\".JPEG\\\",\\\".WEBP\\\",\\\".GIF\\\"],\\\"allowed_file_types\\\":[\\\"document\\\",\\\"image\\\"],\\\"allowed_file_upload_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"],\\\"enabled\\\":true,\\\"image\\\":{\\\"detail\\\":\\\"high\\\",\\\"enabled\\\":true,\\\"number_limits\\\":10,\\\"transfer_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"]},\\\"number_limits\\\":10},\\\"opening_statement\\\":\\\"\\\",\\\"retriever_resource\\\":{\\\"enabled\\\":true},\\\"sensitive_word_avoidance\\\":{\\\"enabled\\\":false},\\\"speech_to_text\\\":{\\\"enabled\\\":false},\\\"suggested_questions\\\":[],\\\"suggested_questions_after_answer\\\":{\\\"enabled\\\":false},\\\"text_to_speech\\\":{\\\"enabled\\\":false,\\\"language\\\":\\\"\\\",\\\"voice\\\":\\\"\\\"}},\\\"conversation_variables\\\":[],\\\"scaffold_nodes\\\":[{\\\"data\\\":{\\\"desc\\\":\\\"契約書ファイルをアップロードします(PDF・Word・テキスト・スキャン画像。複数可)。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"開始\\\",\\\"type\\\":\\\"start\\\",\\\"variables\\\":[{\\\"allowed_file_extensions\\\":[],\\\"allowed_file_types\\\":[\\\"document\\\",\\\"image\\\"],\\\"allowed_file_upload_methods\\\":[\\\"local_file\\\",\\\"remote_url\\\"],\\\"label\\\":\\\"契約書ファイル(PDF・画像・テキスト)\\\",\\\"max_length\\\":10,\\\"options\\\":[],\\\"required\\\":true,\\\"type\\\":\\\"file-list\\\",\\\"variable\\\":\\\"contract_file\\\"},{\\\"label\\\":\\\"補足情報(更問いへの回答)\\\",\\\"max_length\\\":2000,\\\"options\\\":[],\\\"required\\\":false,\\\"type\\\":\\\"paragraph\\\",\\\"variable\\\":\\\"additional_info\\\"}]},\\\"height\\\":116,\\\"id\\\":\\\"start\\\",\\\"position\\\":{\\\"x\\\":80,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":80,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"契約書ファイル(文書)からテキストを抽出します。画像はここでは対象外で、後段の「契約書ファイルの読み取り」がAIで直接読みます。\\\",\\\"is_array_file\\\":true,\\\"selected\\\":false,\\\"title\\\":\\\"契約書テキスト抽出\\\",\\\"type\\\":\\\"document-extractor\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"contract_file\\\"]},\\\"height\\\":116,\\\"id\\\":\\\"doc-extractor\\\",\\\"position\\\":{\\\"x\\\":384,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":384,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"複数ファイルから抽出したテキストを、1つの本文にまとめます。\\\",\\\"selected\\\":false,\\\"template\\\":\\\"{{ texts | join('\\\\\\\\n\\\\\\\\n') | trim }}\\\",\\\"title\\\":\\\"抽出テキスト結合\\\",\\\"type\\\":\\\"template-transform\\\",\\\"variables\\\":[{\\\"value_selector\\\":[\\\"doc-extractor\\\",\\\"text\\\"],\\\"variable\\\":\\\"texts\\\"}]},\\\"height\\\":116,\\\"id\\\":\\\"template-join\\\",\\\"position\\\":{\\\"x\\\":384,\\\"y\\\":990},\\\"positionAbsolute\\\":{\\\"x\\\":384,\\\"y\\\":990},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"cases\\\":[{\\\"case_id\\\":\\\"case-no-extract\\\",\\\"conditions\\\":[{\\\"comparison_operator\\\":\\\"empty\\\",\\\"id\\\":\\\"cond-no-extract\\\",\\\"value\\\":\\\"\\\",\\\"varType\\\":\\\"string\\\",\\\"variable_selector\\\":[\\\"template-join\\\",\\\"output\\\"]}],\\\"id\\\":\\\"case-no-extract\\\",\\\"logical_operator\\\":\\\"and\\\"}],\\\"desc\\\":\\\"テキスト抽出で文字が取れなかった場合(スキャンPDF・画像など)は、AIがファイルを直接読む経路へ回します。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"条件分岐(抽出チェック)\\\",\\\"type\\\":\\\"if-else\\\"},\\\"height\\\":126,\\\"id\\\":\\\"if-else-read\\\",\\\"position\\\":{\\\"x\\\":500,\\\"y\\\":990},\\\"positionAbsolute\\\":{\\\"x\\\":500,\\\"y\\\":990},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"context\\\":{\\\"enabled\\\":false,\\\"variable_selector\\\":[]},\\\"desc\\\":\\\"契約書ファイル(スキャンPDF・画像)をAIが直接読んで、本文を忠実に文字起こしします。テキスト抽出で文字が取れなかったときだけ実行されます。\\\",\\\"model\\\":{\\\"completion_params\\\":{\\\"temperature\\\":0.1},\\\"mode\\\":\\\"chat\\\",\\\"name\\\":\\\"gpt-4o\\\",\\\"provider\\\":\\\"openai\\\"},\\\"prompt_template\\\":[{\\\"id\\\":\\\"system-prompt-read\\\",\\\"role\\\":\\\"system\\\",\\\"text\\\":\\\"あなたは書類の文字起こしの専門家です。添付された契約書ファイル(PDF・画像)を、書かれているとおり忠実に全文文字起こししてください。\\\\n\\\\n【ルール】\\\\n- 要約・省略・言い換え・追記はしない。書かれている文字をそのまま書き起こす\\\\n- ファイルやページが複数ある場合は、順番どおりに続けて出力する\\\\n- 表は「|」区切りのテキスト表として書き起こす\\\\n- 判読できない文字は 〓 と書く(推測で補わない)\\\\n- 印影・手書きの署名は「(押印)」「(署名)」と書く\\\\n- 前置き・後書き・説明は一切書かない(本文だけを出力する)\\\\n- 添付ファイルが1つも見えない・1文字も読み取れない場合は「〓読取不能〓」とだけ出力する\\\"},{\\\"id\\\":\\\"user-prompt-read\\\",\\\"role\\\":\\\"user\\\",\\\"text\\\":\\\"添付の契約書ファイルを全文文字起こししてください。\\\"}],\\\"selected\\\":false,\\\"title\\\":\\\"契約書ファイルの読み取り\\\",\\\"type\\\":\\\"llm\\\",\\\"variables\\\":[],\\\"vision\\\":{\\\"configs\\\":{\\\"detail\\\":\\\"high\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"contract_file\\\"]},\\\"enabled\\\":true}},\\\"height\\\":116,\\\"id\\\":\\\"llm_read\\\",\\\"position\\\":{\\\"x\\\":688,\\\"y\\\":990},\\\"positionAbsolute\\\":{\\\"x\\\":688,\\\"y\\\":990},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"AI直接読み取りの結果(実行された場合)と、テキスト抽出の結果を1つの本文にまとめます。\\\",\\\"output_type\\\":\\\"string\\\",\\\"selected\\\":false,\\\"title\\\":\\\"本文集約\\\",\\\"type\\\":\\\"variable-aggregator\\\",\\\"variables\\\":[[\\\"llm_read\\\",\\\"text\\\"],[\\\"template-join\\\",\\\"output\\\"]]},\\\"height\\\":116,\\\"id\\\":\\\"aggregator_text\\\",\\\"position\\\":{\\\"x\\\":992,\\\"y\\\":990},\\\"positionAbsolute\\\":{\\\"x\\\":992,\\\"y\\\":990},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"cases\\\":[{\\\"case_id\\\":\\\"case-no-text\\\",\\\"conditions\\\":[{\\\"comparison_operator\\\":\\\"empty\\\",\\\"id\\\":\\\"cond-no-text\\\",\\\"value\\\":\\\"\\\",\\\"varType\\\":\\\"string\\\",\\\"variable_selector\\\":[\\\"aggregator_text\\\",\\\"output\\\"]},{\\\"comparison_operator\\\":\\\"contains\\\",\\\"id\\\":\\\"cond-unreadable\\\",\\\"value\\\":\\\"〓読取不能〓\\\",\\\"varType\\\":\\\"string\\\",\\\"variable_selector\\\":[\\\"aggregator_text\\\",\\\"output\\\"]}],\\\"id\\\":\\\"case-no-text\\\",\\\"logical_operator\\\":\\\"or\\\"}],\\\"desc\\\":\\\"本文の文字が1文字も取れなかった場合(AIでも読み取れなかった場合)は、判定に進まず案内を返します。\\\",\\\"selected\\\":false,\\\"title\\\":\\\"条件分岐(本文チェック)\\\",\\\"type\\\":\\\"if-else\\\"},\\\"height\\\":126,\\\"id\\\":\\\"if-else-text\\\",\\\"position\\\":{\\\"x\\\":1100,\\\"y\\\":990},\\\"positionAbsolute\\\":{\\\"x\\\":1100,\\\"y\\\":990},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"文字が取れず、AIでも読み取れなかった場合の案内メッセージを出力します。\\\",\\\"selected\\\":false,\\\"template\\\":\\\"質問: 契約書ファイルから文字を読み取れませんでした。スキャン(画像)のPDFで、選択中のAIモデルがPDFの直接読み取りに対応していない可能性があります。①各ページを画像(スクリーンショットや写真)にして「契約書ファイル」欄に追加して再実行する、②PDFを直接読めるAIモデル(Claude系など)に切り替える、のどちらかをお試しください。\\\\n回答例: (画像を追加して再実行)\\\",\\\"title\\\":\\\"スキャン案内\\\",\\\"type\\\":\\\"template-transform\\\",\\\"variables\\\":[]},\\\"height\\\":116,\\\"id\\\":\\\"template-scan\\\",\\\"position\\\":{\\\"x\\\":1100,\\\"y\\\":1200},\\\"positionAbsolute\\\":{\\\"x\\\":1100,\\\"y\\\":1200},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"context\\\":{\\\"enabled\\\":false,\\\"variable_selector\\\":[]},\\\"desc\\\":\\\"契約書の読み取り内容(契約名・当事者・主目的・主要条件)を認識確認用に出力します。添付ファイルも直接参照し、補足情報の訂正を反映します。\\\",\\\"model\\\":{\\\"completion_params\\\":{\\\"temperature\\\":0.1},\\\"mode\\\":\\\"chat\\\",\\\"name\\\":\\\"gpt-4o\\\",\\\"provider\\\":\\\"openai\\\"},\\\"prompt_template\\\":[{\\\"id\\\":\\\"system-prompt-summary\\\",\\\"role\\\":\\\"system\\\",\\\"text\\\":\\\"あなたは日本の企業会計に精通した経理・会計の専門家です。\\\\n与えられた契約書の本文から、勘定科目分類の前提となる要点を読み取り、次の形式で出力してください。\\\\nこの出力は「契約書の読み取りに認識間違いがないか」をユーザーが確認するために提示されます。\\\\n\\\\n【出力形式】(この形式のみを出力する。前置き・後書きは付けない)\\\\n契約名: <契約書の題名>\\\\n当事者: <当事者名と、読み取れる場合は自社の立場(貸主/借主、受託者/委託者、買主/売主 など)。読み取れない場合は「不明」と書く>\\\\n契約の主目的: <1行で>\\\\n主要条件: <期間・金額・支払条件など分類に影響する重要な条件を2〜3点、「 / 」区切りで>\\\\n特記事項: <分類に影響しそうな点があれば1行、なければ「なし」>\\\\n※ この認識に誤りがある場合は、「補足情報」欄で訂正して再実行してください。\\\\n\\\\n【ルール】\\\\n- 契約書に書かれていることだけを書き、推測で断定しない。読み取れない項目は「不明」とする。\\\\n- <補足情報>に訂正や回答が入っている場合は、その内容を事実として反映し、該当箇所に「(補足情報より)」と付記する。\\\\n- 最終行の「※ …」の注意書きは毎回そのまま出力する。\\\"},{\\\"id\\\":\\\"user-prompt-summary\\\",\\\"role\\\":\\\"user\\\",\\\"text\\\":\\\"以下はアップロードされた契約書から抽出した本文です。契約書が画像やスキャンPDFで添付されている場合は本文が空・不完全なことがあるため、その場合は添付ファイルを直接読み取ってください。読み取り内容の要点を出力してください。\\\\n\\\\n<契約書本文>\\\\n{{#aggregator_text.output#}}\\\\n<\/契約書本文>\\\\n\\\\n<補足情報>\\\\n{{#start.additional_info#}}\\\\n<\/補足情報>\\\\n(補足情報は、過去の質問への回答や認識の訂正です。空の場合もあります。)\\\"}],\\\"selected\\\":false,\\\"title\\\":\\\"契約内容サマリー\\\",\\\"type\\\":\\\"llm\\\",\\\"variables\\\":[],\\\"vision\\\":{\\\"configs\\\":{\\\"detail\\\":\\\"high\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"contract_file\\\"]},\\\"enabled\\\":true}},\\\"height\\\":116,\\\"id\\\":\\\"llm_summary\\\",\\\"position\\\":{\\\"x\\\":688,\\\"y\\\":690},\\\"positionAbsolute\\\":{\\\"x\\\":688,\\\"y\\\":690},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"cases\\\":[{\\\"case_id\\\":\\\"case-unconfirmed\\\",\\\"conditions\\\":[{\\\"comparison_operator\\\":\\\"empty\\\",\\\"id\\\":\\\"cond-unconfirmed\\\",\\\"value\\\":\\\"\\\",\\\"varType\\\":\\\"string\\\",\\\"variable_selector\\\":[\\\"start\\\",\\\"additional_info\\\"]}],\\\"id\\\":\\\"case-unconfirmed\\\",\\\"logical_operator\\\":\\\"and\\\"}],\\\"d めるAIモデルに切り替える)を1行で伝える\\\\n\\\\n# 出力形式\\\\n前置きや解説は書かず、次のMarkdownだけを出力してください。\\\\n\\\\n## 📋 契約書から読み取った事実\\\\n| 項目 | 内容 |\\\\n|---|---|\\\\n| (項目名) | (内容) |\\\"},{\\\"id\\\":\\\"user-prompt-summary\\\",\\\"role\\\":\\\"user\\\",\\\"text\\\":\\\"以下はアップロードされた契約書から抽出した本文です。契約書が画像として添付されている場合は本文が空のことがあるため、その場合は添付画像を直接読み取ってください。この契約書から事実を抽出してください。\\\\n\\\\n<契約書本文>\\\\n{{#conversation.contract_text#}}\\\\n<\/契約書本文>\\\\n\\\\n<ユーザーの入力>\\\\n{{#sys.query#}}\\\\n<\/ユーザーの入力>\\\\n(ユーザーの入力が「.」などの記号だけの場合は無視してください。訂正や補足が書かれていれば事実として反映し、該当箇所に「(ユーザー入力より)」と付記してください。)\\\"}],\\\"selected\\\":false,\\\"title\\\":\\\"契約内容サマリー\\\",\\\"type\\\":\\\"llm\\\",\\\"variables\\\":[],\\\"vision\\\":{\\\"configs\\\":{\\\"detail\\\":\\\"high\\\",\\\"variable_selector\\\":[\\\"sys\\\",\\\"files\\\"]},\\\"enabled\\\":true}},\\\"height\\\":98,\\\"id\\\":\\\"llm_summary\\\",\\\"position\\\":{\\\"x\\\":2512,\\\"y\\\":40},\\\"positionAbsolute\\\":{\\\"x\\\":2512,\\\"y\\\":40},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"desc\\\":\\\"読み取り内容を会話変数に保存し、次のターン(分類時)で参照できるようにする。\\\",\\\"items\\\":[{\\\"input_type\\\":\\\"variable\\\",\\\"operation\\\":\\\"over-write\\\",\\\"value\\\":[\\\"llm_summary\\\",\\\"text\\\"],\\\"variable_selector\\\":[\\\"conversation\\\",\\\"contract_summary\\\"]}],\\\"selected\\\":false,\\\"title\\\":\\\"読み取り内容を保存\\\",\\\"type\\\":\\\"assigner\\\",\\\"version\\\":\\\"2\\\"},\\\"height\\\":88,\\\"id\\\":\\\"save-summary\\\",\\\"position\\\":{\\\"x\\\":2816,\\\"y\\\":40},\\\"positionAbsolute\\\":{\\\"x\\\":2816,\\\"y\\\":40},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"answer\\\":\\\"{{#llm_summary.text#}}\\\\n\\\\n---\\\\n上記の読み取り内容をもとに勘定科目を判定します。\\\\n✅ 内容が正しければ「**OK**」と返信してください。\\\\n✏️ 誤りや補足があれば、訂正内容をそのまま返信してください(例:「当社は借主です」)。\\\",\\\"desc\\\":\\\"読み取った内容をユーザ tokens\\\":8192,\\\"temperature\\\":0.2},\\\"mode\\\":\\\"chat\\\",\\\"name\\\":\\\"gpt-4o\\\",\\\"provider\\\":\\\"openai\\\"},\\\"memory\\\":{\\\"query_prompt_template\\\":\\\"{{#sys.query#}}\\\",\\\"role_prefix\\\":{\\\"assistant\\\":\\\"\\\",\\\"user\\\":\\\"\\\"},\\\"window\\\":{\\\"enabled\\\":false,\\\"size\\\":50}},\\\"prompt_template\\\":[{\\\"id\\\":\\\"system-prompt-flow\\\",\\\"role\\\":\\\"system\\\",\\\"text\\\":\\\"あなたは日本の会計実務に精通した経理・会計の専門家です。確認済みの契約内容をもとに、この契約で発生する一般的な会計仕訳の流れを作成してください。出力はすべて日本語で行ってください。\\\\n\\\\n# 自社の視点(最重要)\\\\n- 仕訳は必ず「自社」の視点で作成する。自社={{#env.company_name#}}(環境変数 company_name。未設定の場合は、ユーザーの発言と確認済みの読み取り内容から自社側の当事者を特定する)\\\\n- まず契約当事者のどちらが自社かを特定する。自社が「提供・販売・貸す側」なら収益側の仕訳(売掛金・営業収入・前受収益・受入敷金 など)、「受ける・購入・借りる側」なら費用・資産側の仕訳になる。向きを取り違えない\\\\n- どちらが自社か特定できない場合は、# 質問 の形式で質問する\\\\n\\\\n# 会社の会計方針・判定ルール(仕訳の判定で必ず従う)\\\\n{{#env.accounting_policy#}}\\\\n\\\\n# 仕訳の流れの作り方\\\\n- 契約のライフサイクル(契約時・前払時・役務提供時/検収時・請求時・支払時・決算時・契約終了時 など)に沿って、発生する仕訳を順に書く(この契約に該当する場面だけでよい)\\\\n- 金額は書かない(科目の組み合わせと発生の流れを示す)\\\\n- 継続的な契約(毎月の支払など)は、代表的な1回分を書き、摘要に「毎月」等と記す\\\\n- 消費税は仕訳行には書かず、注意があれば「誤りやすい点」に書く\\\\n\\\\n# 勘定科目名のルール(重要)\\\\n- 借方・貸方の科目名は、下記の【使える勘定科目】の科目名を一字一句そのまま使う(勘定科目コードの自動付与に使われる)\\\\n- 一般的によく使う科目名(現金、預金、売掛金 など)が思い浮かんでも、リストにその名前が無い場合は、リストの中で最も意味が近い科目名(例: 「現金等」)に置き換えて書く\\\\n- どうしても意味の近い科目がリストに無い場合のみ一般的な科目名を書き、科目名の末尾に「※リスト外」と付ける\\\\n- コードは絶対に書かない(プログラムが対応表から機械的に付与する)\\\\n- 出力する前に、借方・貸方の全ての科目名が【使える勘定科目】のいずれかと一字一句一致していること(または※リスト外が付いていること)を確認する\\\\n- 出力する前に、(1)すべての行が自社の視点になっているか (2)資産計上か費用処理かの判定が会計方針と契約条件(期間・解約可否・金額)に整合しているか (3)貸付金・借入金・前払費用などの長期/短期の区分が正しいか、を確認する\\\\n\\\\n# 質問(情報不足の場合)\\\\n- 契約書とこれまでの会話を読んでも仕訳の流れを決められない場合は、表を出力する代わりに次の2行だけを出力する\\\\n  質問: (判断を最も左右する点を1つだけ、選択式で答えられるように聞く)\\\\n  回答例: (ユーザーがそのまま使える文例を「 / 」区切りで2〜3個)\\\\n- 迷いはあるが決められる場合は質問せず、その行の摘要に「(要確認: 理由)」を付ける\\\\n\\\\n【使える勘定科目】(名前のあとの括弧は分類上の位置、「: 」以降は定義)\\\\n{{#env.account_list#}}\\\\n\\\\n# 出力形式(前置き・後書きは書かない。次のMarkdownだけを出力する。科目名セルには科目名だけを書く)\\\\n## 📘 仕訳の流れ(金額なし)\\\\n| # | 場面・タイミング | 借方 | 貸方 | 摘要 |\\\\n|---|---|---|---|---|\\\\n| 1 | (いつ・何が起きたとき) | 科目名 | 科目名 | (補足を1行) |\\\\n\\\\n| 項目 | 内容 |\\\\n|---|---|\\\\n| 前提・推定箇所 | (推定で補った点を1〜2行。無ければ「なし」) |\\\\n| 誤りやすい点 | (税務・区分で注意すべき点を1行。無ければ「なし」) |\\\"},{\\\"id\\\":\\\"user-prompt-flow\\\",\\\"role\\\":\\\"user\\\",\\\"text\\\":\\\"以下はアップロードされた契約書から抽出した本文と、確認済みの読み取り内容です。契約書が画像として添付されている場合は本文が空のことがあるため、その場合は添付ファイルとこれまでの会話を判断材料にしてください。この契約の一般的な仕訳の流れを出力してください。\\\\n\\\\n<契約書本文>\\\\n{{#conversation.contract_text#}}\\\\n<\/契約書本文>\\\\n\\\\n<読み取り内容(確認済み)>\\\\n{{#conversation.contract_summary#}}\\\\n<\/読み取り内容>\\\\n(これまでの会話でのユーザーの回答・訂正も判断材料に使うこと。)\\\"}],\\\"selected\\\":false,\\\"title\\\":\\\"仕訳フロー生成\\\",\\\"type\\\":\\\"llm\\\",\\\"variables\\\":[],\\\"vision\\\":{\\\"configs\\\":{\\\"detail\\\":\\\"high\\\",\\\"variable_selector\\\":[\\\"sys\\\",\\\"files\\\"]},\\\"enabled\\\":true}},\\\"height\\\":98,\\\"id\\\":\\\"llm_flow\\\",\\\"position\\\":{\\\"x\\\":3424,\\\"y\\\":190},\\\"positionAbsolute\\\":{\\\"x\\\":3424,\\\"y\\\":190},\\\"selected\\\":false,\\\"sourcePosition\\\":\\\"right\\\",\\\"targetPosition\\\":\\\"left\\\",\\\"type\\\":\\\"custom\\\",\\\"width\\\":244},{\\\"data\\\":{\\\"code\\\":\\\"def main(journal: str, code_map: str, account_list: str, aliases: str) -> dict:\\\\n    # 仕訳の流れ表の全行について、借方・貸方の科目名に対応表(code_map)から\\\\n    # 勘定科目コードを機械的に付ける。解決の順序:\\\\n    #  1) 別名表 account_aliases(「預金=現金等」の形。利用者が育てられる)\\\\n    #  2) ツリー末端名との完全一致\\\\n    #  3) ツリーの科目リスト(名前・定義)との照合(名前の包含、定義文に語が含まれる)\\\\n    # LLMにコードを触らせないため、コードの創作は構造的に起きない。\\\\n    import unicodedata\\\\n\\\\n    def nk(s):\\\\n        return unicodedata.normalize('NFKC', (s or '')).strip()\\\\n\\\\n    by_leaf = {}\\\\n    for line in (code_map or '').split('\\\\\\\\n'):\\\\n        if ',' not in line:\\\\n            continue\\\\n        path, code = line.rsplit(',', 1)\\\\n        by_leaf.setdefault(nk(path.split('/')[-1]), set()).add(code.strip())\\\\n\\\\n    defs = {}\\\\n    for line in (account_list or '').split('\\\\\\\\n'):\\\\n        line = nk(line)\\\\n        if not line.startswith('- '):\\\\n            continue\\\\n        body = line[2:]\\\\n        name = body.split(' (', 1)[0].strip()\\\\n        d = body.split('): ', 1)[1].strip() if '): ' in body else ''\\\\n        if name:\\\\n            defs[name] = d\\\\n\\\\n    alias = {}\\\\n    for line in (aliases or '').split('\\\\\\\\n'):\\\\n        if '=' in line:\\\\n            a, b = line.split('=', 1)\\\\n            if nk(a) and nk(b):\\\\n                alias[nk(a)] = nk(b)\\\\n\\\\n    names = set(defs) | set(by_leaf)\\\\n    unresolved = []\\\\n\\\\n    def codes_str(name):\\\\n        hits = sorted(by_leaf.get(name, set()))\\\\n        if len(hits) == 1:\\\\n            return hits[0]\\\\n        if len(hits) > 1:\\\\n            return ' / '.join(hits) + ' (同名の科目が複数。要確認)'\\\\n        return 'コード未登録'\\\\n\\\\n    def resolve(raw):\\\\n        name = nk(raw)\\\\n        if not name or name == '-':\\\\n            return ('-', '-')\\\\n        if '※リスト外' in name:\\\\n            return (name.replace('※リスト外', '').strip(), 'コードなし(リスト外の科目)')\\\\n        if name in alias:\\\\n            to = alias[name]\\\\n            return ('%s(別名: %s)' % (to, name), codes_str(to))\\\\n        if name in names:\\\\n            return (name, codes_str(name))\\\\n        cands = sorted(m for m in names\\\\n                       if name in m or m in name or (defs.get(m) and name in defs[m]))\\\\n        if len(cands) == 1:\\\\n            return ('%s(「%s」を対応)' % (cands[0], name), codes_str(cands[0]))\\\\n        if len(cands) > 1:\\\\n            return (name, '候補: ' + ' / '.join(cands[:4]) + ' (要確認)')\\\\n        unresolved.append(name)\\\\n        return (name, 'コード未登録')\\\\n\\\\n    rows = []\\\\n    lines = [ln.strip() for ln in (journal or '').split('\\\\\\\\n')]\\\\n    in_table = False\\\\n    d_i = c_i = None\\\\n    for ln in lines:\\\\n        if not ln.startswith('|'):\\\\n            if in_table:\\\\n                break\\\\n            continue\\\\n        cells = [nk(c) for c in ln.strip('|').split('|')]\\\\n        if not in_table:\\\\n            if '借方' in cells and '貸方' in cells:\\\\n                d_i, c_i = cells.index('借方'), cells.index('貸方')\\\\n                in_table = True\\\\n            continue\\\\n        if cells and set(''.join(cells)) <= set('-: '):\\\\n            continue\\\\n        if len(cells) > max(d_i, c_i):\\\\n            rows.append((cells[0] if cells else '', cells[d_i], cells[c_i]))\\\\n\\\\n    if not rows:\\\\n        return {'text': '(仕訳表を読み取れなかったため、コードは付与していません)'}\\\\n\\\\n    out = ['## 🔢 勘定科目コード',\\\\n           '| # | 借方 | 借方コード | 貸方 | 貸方コード |',\\\\n           '|---|---|---|---|---|']\\\\n    for no, d, c in rows:\\\\n        dn, dc = resolve(d)\\\\n        cn, cc = resolve(c)\\\\n        out.append('| %s | %s | %s | %s | %s |' % (no, dn, dc, cn, cc))\\\\n    if unresolved:\\\\n        out.append('')\\\\n        out.append('※ コード未登録: %s。対応するツリーの科目が分かる場合は、環境変数 account_aliases に「%s=リストの科目名」の形で1行足すと、次回から自動で引けます(ツリー側の定義文にこの言葉を書いてもOK)。'\\\\n                   % ('、'.join(sorted(set(unresolved))), sorted(set(unresolved))[0]))\\\\n    return {'text': '\\\\\\\\n'.join(out)}\\\\n\\\",\\\"code_language\\\":\\\"python3\\\",\\\"desc\\\":\\\"仕訳の流れ表の全行について、借方・貸方それぞれに分類ツリー由来の対応表から勘定科目コードを機械的に付与する。末端名の完全一致のみ(LLMはコードに触れない)。\\\",\\\"outputs\\\":{\\\"text\\\":{\\\"children\\\":null,\\\"type\\\":\\\"string\\\"}},\\\"selected\\\":false,\\\"title\\\":\\\"コード付与\\\",\\\"type\\\":\\\"code\\\",\\\"variables\\\":[{\\\"value_selector\\\":[\\\"llm_flow\\\",\\\"text\\\"],\\\"variable\\\":\\\"journal\\\"},{\\\"value_selector\\\":[\\\"env\\\",\\\"code_map\\\"],\\\"variable\\\":\\\"code_map\\\"},{\\\"value_selector\\\":[\\\"env\\\",\\\"account_list\\\"],\\\"variable\\\":\\\"account_list\\\"},{\\\"value_selector\\\":[\\\"env\\\",\\\"account_aliases\\\"],\\\"variable\\\":\\\"aliases\\\"}]},\\\"height\\\":92,\\\"id\\\":\\\"code_flow\\\",\\\"position\\\":{\\\"x\\\":4032,\\\"y\\\":190},\\\"positionAbsolute\\\":{\\\"x\\\":40
