");\n    else if(stage.isSub) lines.push(\"契約書の本文を読み、次の\" + n + \"の小区分のうち最も適切なものを1つだけ判定し、小区分名のラベルのみを出力してください。\");\n    else lines.push(\"契約書の本文を読み、次の\" + n + \"つの細分のうち最も適切なものを1つだけ判定し、ラベルのみを出力してください。\");\n  }\n  lines.push(\"\");\n  const defs = ex.defs || {};\n  if(stage.env) lines.push(\"【分類基準】\", \"{{#env.\" + stage.env + \"#}}\");\n  else if(stage.isRoot) lines.push.apply(lines, [\"【勘定科目区分】\"].concat(numberedDefs(children, defs)));\n  else if(stage.isSub) lines.push.apply(lines, [\"【\" + stage.label + \"の小区分】\"].concat(numberedDefs(children, defs)));\n  else lines.push.apply(lines, [\"【\" + stage.label + \"の細分】\"].concat(numberedDefs(children, defs)));\n  lines.push(\"\");\n  lines.push(\"【出力ルール】\");\n  if(stage.isRoot){\n    lines.push(\"- 出力はラベル1つのみ・1行のみ。説明文・理由・記号・引用符・改行・前後の空白は一切付けない。\");\n    const allowed = node.children.map(c => c.label);\n    lines.push(\"- 出力してよいラベルは次の\" + allowed.length + \"種類のみ。一字一句そのまま使うこと。\");\n    lines.push(\"  \" + allowed.join(\"、\"));\n  }else{\n    lines.push(\"- 出力はラベル1つのみ・1行のみ。説明文・理由・記号・引用符・番号・改行・前後の空白は一切付けない。\");\n    if(stage.env) lines.push(\"- 出力してよいラベルは【分類基準】に列挙された細分名のみ(行頭の番号や「: 」以降の定義は付けない)。一字一句そのまま使うこと。\");\n    else if(stage.isSub) lines.push(\"- 出力してよいラベルは上記\" + n + \"種類の小区分名のみ。一字一句そのまま使うこと。\");\n    else lines.push(\"- 出力してよいラベルは上記\" + n + \"種類のみ。一字一句そのまま使うこと。\");\n  }\n  let extraRules = ex.extra_rules;\n  if(extraRules === undefined || extraRules === null){\n    extraRules = stage.env\n      ? stage.branchChildren().map(c => \"- 「\" + c.label + \"」の行は後段の条件分岐が名称を参照しているため、ラベル名を変更しないこと。\")\n      : [];\n  }\n  lines.push.apply(lines, extraRules);\n  if(stage.isRoot){\n    const fb = node.children.filter(c => c.star)[0];\n    lines.push(\"- 判定材料はあるがどの区分にも当てはまらない場合のみ「\" + fb.label + \"」と出力する(情報不足の場合は下記の更問いを優先する)。\");\n  }else{\n    lines.push(\"- 判定材料はあるがどれに当たるか紛れる場合は、最も近いものとして「\" + stage.fallback().label\n               + \"」を出力する(情報不足の場合は下記の更問いを優先する)。\");\n  }\n  const examples = ex.examples;\n  if(examples && examples.length) lines.push.apply(lines, [\"\"].concat([\"【出力例】\"]).concat(examples));\n  lines.push.apply(lines, [\"\"].concat(chat ? SUPPLEMENT_SECTION_CHAT : SUPPLEMENT_SECTION));\n  lines.push.apply(lines, [\"\"].concat(chat ? QUESTION_SECTION_HEAD_CHAT : QUESTION_SECTION_HEAD));\n  let question = ex.question;\n  if(!question){\n    const opts = node.children.slice(0, 3).map(c => c.label);\n    question = [\"質問: この契約は次のどれに最も近いですか?(\" + opts.join(\" / \") + \")\",\n                \"回答例: \" + opts.slice(0, 2).map(o => o + \"です\").join(\" / \")];\n  }\n  lines.push.apply(lines, question.map(q => \"  \" + q));\n  return lines.join(\"\\n\");\n}\n\nfunction userPrompt(stage, chat){\n  let intro = stage.ex.user_intro;\n  if(!intro){\n    if(stage.isRoot) intro = \"以下は契約書の本文です。この契約の勘定科目区分を判定し、ラベル名のみを出力してください。\";\n    else if(stage.isSub) intro = \"以下は契約書の本文です。\" + stage.label + \"の小区分を判定し、ラベル名のみを出力してください。\";\n    else intro = \"以下は契約書の本文です。この\" + stage.label + \"の細分を判定し、ラベル名のみを出力してください。\";\n  }\n  return intro + (chat ? USER_BODY_CHAT : USER_BODY);\n}\n\n// ============================================================ レイアウト\nconst ROW = 140, SCAF_Y = 190, TOP_Y = 40, AGG_Y = 410, BANDS_Y0 = 700, BAND_GAP = 180;\nfunction colx(c){ return 80 + 304 * c; }\n\nfunction stageDepth(stage){\n  let d = 0, n = stage.node;\n  while(n.parent !== null){ d++; n = n.parent; }\n  return d;\n}\n\nfunction computeLayout(root, stages, gaggIds){\n  const pos = {};\n  let maxDepth = 0;\n  for(const st of stages.values()) maxDepth = Math.max(maxDepth, stageDepth(st));\n  const gaCol = Math.max(11, 9 + 2 * maxDepth);\n\n  pos[\"start\"] = [colx(0), SCAF_Y];\n  pos[\"doc-extractor\"] = [colx(1), SCAF_Y];\n  pos[\"template-join\"] = [colx(2), SCAF_Y];\n  pos[\"if-else-read\"] = [colx(3), SCAF_Y];\n  pos[\"llm_read\"] = [colx(4), TOP_Y];\n  pos[\"aggregator_text\"] = [colx(4), SCAF_Y];\n  pos[\"if-else-text\"] = [colx(5), SCAF_Y];\n  pos[\"template-scan\"] = [colx(5), TOP_Y];\n  pos[\"llm_summary\"] = [colx(6), SCAF_Y];\n  pos[\"if-else-confirm\"] = [colx(7), SCAF_Y];\n  pos[stages.get(nodeKey(root)).id] = [colx(8), SCAF_Y];\n  if(stages.get(nodeKey(root)).ifelseId) pos[stages.get(nodeKey(root)).ifelseId] = [colx(9), SCAF_Y];\n  pos[\"template-confirm\"] = [colx(8), TOP_Y];\n  pos[\"aggregator\"] = [colx(gaCol + 1), AGG_Y + 150];\n  pos[\"template_path\"] = [colx(gaCol + 2), AGG_Y + 150];\n  pos[\"template_code\"] = [colx(gaCol + 3), AGG_Y + 150];\n  pos[\"if-else-q\"] = [colx(gaCol + 4), AGG_Y + 370];\n  pos[\"llm_journal\"] = [colx(gaCol + 5), AGG_Y + 590];\n  pos[\"aggregator-out\"] = [colx(gaCol + 6), AGG_Y];\n  pos[\"end\"] = [colx(gaCol + 7), AGG_Y];\n\n  let bandY = BANDS_Y0;\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const head = stages.get(nodeKey(cat));\n    const subStages = cat.children.filter(c => c.isBranch).map(c => stages.get(nodeKey(c)));\n    const rows = 1 + subStages.length;\n    pos[head.id] = [colx(10), bandY];\n    if(head.ifelseId) pos[head.ifelseId] = [colx(11), bandY];\n    subStages.forEach(function(st, i){\n      const y = bandY + ROW * (1 + i);\n      pos[st.id] = [colx(8 + 2 * stageDepth(st)), y];\n      if(st.ifelseId) pos[st.ifelseId] = [colx(9 + 2 * stageDepth(st)), y];\n      (function deeper(node){\n        for(const c of node.children){\n          if(!c.isBranch) continue;\n          const dst = stages.get(nodeKey(c));\n          pos[dst.id] = [colx(8 + 2 * stageDepth(dst)), y];\n          if(dst.ifelseId) pos[dst.ifelseId] = [colx(9 + 2 * stageDepth(dst)), y];\n          deeper(c);\n        }\n      })(st.node);\n    });\n    const gy = bandY + rows * ROW + 70;\n    pos[gaggIds[nodeKey(cat)]] = [colx(gaCol), gy];\n    bandY = gy + 116 + BAND_GAP;\n  }\n  return pos;\n}\n\nfunction place(pos, nid){ return {x: pos[nid][0], y: pos[nid][1]}; }\n\nfunction nodeShell(nid, data, p, height){\n  return {data: data, height: height === undefined ? 116 : height, id: nid,\n          position: p, positionAbsolute: {x: p.x, y: p.y}, selected: false,\n          sourcePosition: \"right\", targetPosition: \"left\", type: \"custom\", width: 244};\n}\n\nfunction llmNode(stage, pos, chat){\n  let desc;\n  if(stage.env) desc = stage.ex.desc || (stage.label + \"を環境変数 \" + stage.env + \" の分類基準に従って細分判定します。\");\n  else if(stage.isRoot) desc = stage.ex.desc || \"契約書の主たる勘定科目区分を判定します。\";\n  else desc = stage.ex.desc || (stage.label + \"の細分を判定します(基準はプロンプト内固定)。\");\n  const suffix = rep(stage.id, \"llm-\", \"\");\n  const data = {\n    context: {enabled: false, variable_selector: []},\n    desc: desc,\n    model: clone(MODEL),\n    prompt_template: [\n      {id: \"system-prompt-\" + suffix, role: \"system\", text: systemPrompt(stage, chat)},\n      {id: \"user-prompt-\" + suffix, role: \"user\", text: userPrompt(stage, chat)}\n    ],\n    selected: false,\n    title: stage.ex.title || (stage.titlePrefix + stage.label + \" 細分判定\"),\n    type: \"llm\",\n    variables: [],\n    vision: {enabled: false}\n  };\n  if(chat) data.memory = clone(MEMORY_BLOCK);\n  return nodeShell(stage.id, data, place(pos, stage.id));\n}\n\nfunction caseIdFor(childStage){\n  return childStage.ex.case_id || (\"case-\" + rep(rep(childStage.id, \"llm-sub-\", \"\"), \"llm-\", \"\"));\n}\n\nfunction makeCase(stage, childStage){\n  const ex = childStage.ex;\n  const value = ex.case_value || childStage.label;\n  const cid = caseIdFor(childStage);\n  const cond = ex.cond_id || rep(cid, \"case-\", \"cond-\");\n  return [{\n    case_id: cid,\n    conditions: [{\n      comparison_operator: \"start with\",\n      id: cond,\n      value: value,\n      varType: \"string\",\n      variable_selector: [stage.id, \"text\"]\n    }],\n    id: cid,\n    logical_operator: \"and\"\n  }, value];\n}\n\nfunction ifelseNode(stage, stages, pos){\n  const branch = stage.branchChildren();\n  const pairs = branch.map(function(c){\n    const r = makeCase(stage, stages.get(nodeKey(c)));\n    return {case: r[0], value: r[1], child: c};\n  });\n  // ケースは値の長い順(Difyは上から順に評価するため、前方一致の包含関係を解決する)\n  pairs.sort((a, b) => b.value.length - a.value.length);\n  // 葉ラベルがケース値に飲み込まれる場合は、そのケースだけ完全一致に切り替える\n  for(const p of pairs){\n    for(const c of stage.node.children){\n      if(c.label === p.child.label || c.isBranch) continue;\n      if(c.label.indexOf(p.value) === 0){\n        p.case.conditions[0].comparison_operator = \"is\";\n        break;\n      }\n    }\n  }\n  for(const c of stage.node.children){\n    if(c.label.indexOf(\"質問\") === 0) throw Err(\"「質問」で始まるラベルは使えません: \" + c.label);\n  }\n  const values = pairs.map(p => p.value);\n  if(new Set(values).size !== values.length)\n    throw Err(\"条件分岐のケース値が重複しています: \" + values.join(\"、\"));\n  const exIf = stage.ex.ifelse || {};\n  let defaultTitle, defaultDesc;\n  if(stage.isRoot){ defaultTitle = \"条件分岐\"; defaultDesc = \"細分を持つ区分の場合のみ小区分判定へ分岐します。\"; }\n  else{\n    defaultTitle = \"条件分岐(\" + stage.titlePrefix + stage.label + \"細分)\";\n    defaultDesc = stage.label + \"の細分のうち、さらに細分を持つものを対応する判定へ分岐します。\";\n  }\n  const data = {\n    cases: pairs.map(p => p.case),\n    desc: exIf.desc || defaultDesc,\n    selected: false,\n    title: exIf.title || defaultTitle,\n    type: \"if-else\"\n  };\n  return nodeShell(stage.ifelseId, data, place(pos, stage.ifelseId),\n                   exIf.height === undefined ? 126 : exIf.height);\n}\n\nfunction makeEdge(byId, src, handle, tgt){\n  return {\n    data: {isInIteration: false, sourceType: byId[src].data.type, targetType: byId[tgt].data.type},\n    id: src + \"-\" + handle + \"-\" + tgt + \"-target\",\n    source: src, sourceHandle: handle,\n    target: tgt, targetHandle: \"target\",\n    type: \"custom\", zIndex: 0\n  };\n}\n\n// ============================================================ 環境変数\nfunction codeMapLines(root){\n  const lines = [];\n  (function walk(n, seven, three, path){\n    if(n.parent !== null){\n      path = path.concat([n.label]);\n      let full = null;\n      if(n.code !== null){\n        if(n.code.length === 7 && !seven){ seven = n.code; three = null; }\n        else if(n.code.length === 3) three = n.code;\n        else full = n.code;\n      }\n      if(full) lines.push(path.join(\"/\") + \",\" + full);\n      else if(seven) lines.push(path.join(\"/\") + \",\" + seven + (three || \"\"));\n    }\n    for(const c of n.children) walk(c, seven, three, path);\n  })(root, null, null, []);\n  return lines;\n}\n\nfunction envVars(root, stages, extras){\n  const out = [];\n  (function walk(node){\n    const stage = stages.get(nodeKey(node));\n    if(stage.env){\n      const lines = [];\n      node.children.forEach(function(c, i){\n        lines.push(c.definition ? (i + 1) + \". \" + c.label + \": \" + c.definition : (i + 1) + \". \" + c.label);\n      });\n      let desc = (extras.env_descriptions || {})[stage.env];\n      if(!desc){\n        desc = stage.label + \"の細分の分類基準。行を追記・編集すると判定に反映される\"\n             + \"(ラベル名: 定義 または ラベル名のみ の形式。名前から分かるものは定義省略可)。\";\n        for(const bc of stage.branchChildren())\n          desc += \" ※「\" + bc.label + \"」の行は条件分岐が名称を参照しているため名称変更不可。\";\n      }\n      const ids = (extras.env_ids || {})[stage.env] || {};\n      out.push({\n        description: desc,\n        id: ids.id || (\"env-\" + rep(stage.env, \"_\", \"-\")),\n        name: stage.env,\n        value: lines.join(\"\\n\"),\n        value_type: ids.value_type || \"string\"\n      });\n    }\n    for(const c of stage.branchChildren()) walk(c);\n  })(root);\n  return out;\n}\n\n// ============================================================ 全体組み立て\nfunction generate(treeText, extras, warnings){\n  const root = parseTree(treeText, warnings);\n  const stages = buildStages(root, extras);\n\n  const used = new Set();\n  for(const st of stages.values()){ used.add(st.id); if(st.ifelseId) used.add(st.ifelseId); }\n  const gaggIds = {};\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const suffix = rep(rep(stages.get(nodeKey(cat)).id, \"llm-sub-\", \"\"), \"llm-\", \"\");\n    let gid = \"aggregator-\" + suffix, k = 2;\n    while(used.has(gid)){ gid = \"aggregator-\" + suffix + k; k++; }\n    used.add(gid);\n    gaggIds[nodeKey(cat)] = gid;\n  }\n\n  const pos = computeLayout(root, stages, gaggIds);\n\n  const nodes = extras.scaffold_nodes.map(clone);\n  for(const n of nodes){\n    if(pos[n.id]){ n.position = place(pos, n.id); n.positionAbsolute = place(pos, n.id); }\n  }\n  const order = postorder(root, stages);\n\n  const stageNodes = [];\n  (function emitStage(node){\n    const stage = stages.get(nodeKey(node));\n    stageNodes.push(llmNode(stage, pos));\n    if(stage.ifelseId) stageNodes.push(ifelseNode(stage, stages, pos));\n    for(const c of stage.branchChildren()) emitStage(c);\n  })(root);\n  for(const n of stageNodes) nodes.push(n);\n\n  for(const cat of root.children){\n    if(!cat.isBranch) continue;\n    const gid = gaggIds[nodeKey(cat)];\n    nodes.push(nodeShell(gid, {\n      desc: cat.label + \"系の判定結果を1つに集約します(最も深い判定が優先)。\",\n      output_type: \"string\",\n      selected: false,\n      title: \"変数集約(\" + cat.label + \")\",\n      type: \"variable-aggregator\",\n      variables: postorderSub(cat, stages).map(st => [st.id, \"text\"])\n    }, place(pos, gid)));\n  }\n\n  // 経路組み立て\n  const pathOrder = Array.from(stages.values()).slice();\n  pathOrder.sort((a, b) => stageDepth(a) - stageDepth(b));\n  const tpParts = [];\n  for(const st of pathOrder){\n    const v = rep(st.id, \"-\", \"_\");\n    tpParts.push(\"{% if \" + v + \" and \" + v + \"[:2] != '質問' %}\"\n                 + (st.isRoot ? \"\" : \"/\") + \"{{ \" + v + \" }}{% endif %}\");\n  }\n  nodes.push(nodeShell(\"template_path\", {\n    desc: \"判定で通ってきた経路を「流動資産/現金・預金/預金」のように「/」で連結します。\",\n    selected: false,\n    template: tpParts.join(\"\"),\n    title: \"経路組み立て\",\n    type: \"template-transform\",\n    variables: pathOrder.map(st => ({value_selector: [st.id, \"text\"], variable: rep(st.id, \"-\", \"_\")}))\n  }, place(pos, \"template_path\")));\n\n  // コード確定\n  const codeTmpl = \"{% set ns = namespace(code='', p=path) %}\"\n    + \"{% for _ in range(12) %}{% if ns.code == '' and ns.p %}\"\n    + \"{% for line in map.split('\\\\n') %}\"\n    + \"{% if line and line.split(',')[0] == ns.p %}{% set ns.code = line.split(',')[1] %}{% endif %}\"\n    + \"{% endfor %}\"\n    + \"{% if ns.code == '' %}{% set ns.p = ns.p.rsplit('/', 1)[0] if '/' in ns.p else '' %}{% endif %}\"\n    + \"{% endif %}{% endfor %}\"\n    + \"{{ ns.code if ns.code else 'コード未登録' }}\";\n  nodes.push(nodeShell(\"template_code\", {\n    desc: \"経路から勘定科目コード(共通7桁、下3桁まで確定していれば10桁)を対応表 code_map で決定的に確定します。未登録は「コード未登録」。\",\n    selected: false,\n    template: codeTmpl,\n    title: \"コード確定\",\n    type: \"template-transform\",\n    variables: [{value_selector: [\"template_path\", \"output\"], variable: \"path\"},\n                {value_selector: [\"env\", \"code_map\"], variable: \"map\"}]\n  }, place(pos, \"template_code\")));\n\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  if(Object.keys(byId).length !== nodes.length) throw Err(\"ノードIDが重複しています\");\n\n  byId[\"aggregator\"].data.variables =\n    root.children.filter(c => c.isBranch).map(c => [gaggIds[nodeKey(c)], \"output\"])\n      .concat([[stages.get(nodeKey(root)).id, \"text\"]]);\n\n  const endNode = byId[\"end\"];\n  for(const o of endNode.data.outputs)\n    if(o.variable === \"main_account\") o.value_selector = [\"template_path\", \"output\"];\n  if(!endNode.data.outputs.some(o => o.variable === \"account_code\"))\n    endNode.data.outputs.push({value_selector: [\"template_code\", \"output\"], variable: \"account_code\"});\n  endNode.data.desc = \"契約内容サマリー(認識確認用)、仕訳または更問い、判定経路(/区切り)、勘定科目コードを出力します。\";\n\n  const edges = [];\n  const E = (src, handle, tgt) => edges.push(makeEdge(byId, src, handle, tgt));\n  E(\"start\", \"source\", \"doc-extractor\");\n  E(\"doc-extractor\", \"source\", \"template-join\");\n  E(\"template-join\", \"source\", \"if-else-read\");\n  E(\"if-else-read\", \"case-no-extract\", \"llm_read\");\n  E(\"llm_read\", \"source\", \"aggregator_text\");\n  E(\"if-else-read\", \"false\", \"aggregator_text\");\n  E(\"aggregator_text\", \"source\", \"if-else-text\");\n  E(\"if-else-text\", \"case-no-text\", \"template-scan\");\n  E(\"template-scan\", \"source\", \"aggregator-out\");\n  E(\"if-else-text\", \"false\", \"llm_summary\");\n  E(\"llm_summary\", \"source\", \"if-else-confirm\");\n  E(\"if-else-confirm\", \"case-unconfirmed\", \"template-confirm\");\n  E(\"if-else-confirm\", \"false\", stages.get(nodeKey(root)).id);\n  E(\"template-confirm\", \"source\", \"aggregator-out\");\n  (function wire(node, sink){\n    const stage = stages.get(nodeKey(node));\n    if(stage.ifelseId){\n      E(stage.id, \"source\", stage.ifelseId);\n      for(const c of stage.branchChildren()){\n        E(stage.ifelseId, caseIdFor(stages.get(nodeKey(c))), stages.get(nodeKey(c)).id);\n        wire(c, node === root ? gaggIds[nodeKey(c)] : sink);\n      }\n      E(stage.ifelseId, \"false\", sink);\n    }else{\n      E(stage.id, \"source\", sink);\n    }\n  })(root, \"aggregator\");\n  for(const cat of root.children) if(cat.isBranch) E(gaggIds[nodeKey(cat)], \"source\", \"aggregator\");\n  E(\"aggregator\", \"source\", \"template_path\");\n  E(\"template_path\", \"source\", \"template_code\");\n  E(\"template_code\", \"source\", \"if-else-q\");\n  E(\"if-else-q\", \"case-question\", \"aggregator-out\");\n  E(\"if-else-q\", \"false\", \"llm_journal\");\n  E(\"llm_journal\", \"source\", \"aggregator-out\");\n  E(\"aggregator-out\", \"source\", \"end\");\n\n  const leaves = [];\n  (function countLeaves(n){\n    for(const c of n.children){ if(c.leaf) leaves.push(c.label); else countLeaves(c); }\n  })(root);\n  const app = clone(extras.app);\n  let envCount = 0;\n  for(const st of stages.values()) if(st.env) envCount++;\n  app.description = \"契約書ファイル(PDF・画像・テキスト)を読み込み、契約の主たる勘定科目を段階的に判定して、\"\n    + \"金額なしの仕訳(借方/貸方)と確信度・誤分類時の影響度を出力するワークフロー。\"\n    + \"文字を取り出せないスキャンPDFや画像はAIが直接読み取る。初回実行は契約内容の認識確認で停止し、\"\n    + \"情報不足時は更問い(質問+回答例)を返す。分類は\" + order.length + \"ステージの段階判定で、最終ラベルは\"\n    + leaves.length + \"種類。細分の分類基準は環境変数 rules_*(\" + envCount + \"個)で編集できる。\"\n    + \"このDSLはREADMEの分類ツリーから tools/generate_workflow.py で自動生成したもの。\";\n\n  const envs = envVars(root, stages, extras);\n  envs.push({\n    description: \"経路→勘定科目コードの対応表(ツリーの[7桁][3桁]から自動生成。1行=「経路,コード」。\"\n               + \"修正はツリー側が正で、ここでの編集は再生成までの応急対応)。\",\n    id: \"env-code-map\",\n    name: \"code_map\",\n    value: codeMapLines(root).join(\"\\n\"),\n    value_type: \"string\"\n  });\n\n  return {\n    app: app,\n    kind: \"app\",\n    version: \"0.1.5\",\n    workflow: {\n      conversation_variables: extras.conversation_variables || [],\n      environment_variables: envs,\n      features: clone(extras.features),\n      graph: {edges: edges, nodes: nodes, viewport: {x: 0, y: 0, zoom: 0.7}}\n    }\n  };\n}\n\n// ============================================================ チャット版(advanced-chat)の組み立て\n// ファイルの入り方・読み方は社内チャットフロー「契約仕訳アシスタント」と同一構成\nconst ACCOUNTING_POLICY_DEFAULT =\n    \"- リース・長期の賃借契約: 契約期間が1年超で中途解約できない(または解約に高額な違約金が伴う)場合は、\"\n  + \"費用処理ではなく使用権資産とリース債務を計上する。少額または1年以内の短期リースのみ費用処理とする\\n\"\n  + \"- 貸付金・借入金の長期/短期: 返済期限が1年超なら長期(長期貸付金・長期借入金 など)、1年以内なら短期として区分する\\n\"\n  + \"- 人材紹介(採用の成功報酬)の紹介手数料は、人材派遣料ではなく「その他経費」とする\\n\"\n  + \"- 自社が売主・貸主・受託者など「対価を受け取る側」の契約では、収益側の仕訳\"\n  + \"(売掛金・営業収入・前受収益・受入敷金 など)を書く\";\n\n// (sys.files + 抽出 + 会話変数保存 + vision + memory)。tools/generate_workflow.py の generate_chat と同一。\nfunction computeLayoutChat(){\n  const pos = {};\n  pos[\"start\"] = [colx(0), SCAF_Y];\n  pos[\"doc-extractor\"] = [colx(1), SCAF_Y];\n  pos[\"template-plain\"] = [colx(2), SCAF_Y];\n  pos[\"if-else-read\"] = [colx(3), SCAF_Y];\n  pos[\"llm_read\"] = [colx(4), TOP_Y];\n  pos[\"template-join-read\"] = [colx(5), TOP_Y];\n  pos[\"save-text-read\"] = [colx(6), TOP_Y];\n  pos[\"template-join\"] = [colx(4), SCAF_Y];\n  pos[\"save-text\"] = [colx(5), SCAF_Y];\n  pos[\"if-else-att\"] = [colx(6), SCAF_Y];\n  pos[\"llm_summary\"] = [colx(7), TOP_Y];\n  pos[\"save-summary\"] = [colx(8), TOP_Y];\n  pos[\"answer-confirm\"] = [colx(9), TOP_Y];\n  pos[\"llm_flow\"] = [colx(7), SCAF_Y];\n  pos[\"if-else-q\"] = [colx(8), SCAF_Y];\n  pos[\"answer-q\"] = [colx(10), TOP_Y];\n  pos[\"code_flow\"] = [colx(9), SCAF_Y];\n  pos[\"answer-final\"] = [colx(10), SCAF_Y];\n  return pos;\n}\n\nfunction makeEdgeChat(byId, src, handle, tgt){\n  return {\n    data: {isInLoop: false,\n           sourceType: byId[src].data.type,\n           targetType: byId[tgt].data.type},\n    id: src + \"-\" + handle + \"-\" + tgt + \"-target\",\n    source: src, sourceHandle: handle,\n    target: tgt, targetHandle: \"target\",\n    type: \"custom\", zIndex: 0\n  };\n}\n\nfunction accountListLines(root){\n  const lines = [];\n  (function walk(n, path){\n    for(const c of n.children){\n      if(c.leaf){\n        const d = c.definition ? \": \" + c.definition : \"\";\n        lines.push(\"- \" + c.label + \" (\" + (path.length ? path.join(\"/\") : ROOT_LABEL) + \")\" + d);\n      }else{\n        walk(c, path.concat([c.label]));\n      }\n    }\n  })(root, []);\n  return lines;\n}\n\nfunction generateChat(treeText, extras, warnings){\n  const root = parseTree(treeText, warnings);\n\n  const pos = computeLayoutChat();\n  const nodes = extras.chat.scaffold_nodes.map(clone);\n  for(const n of nodes){\n    if(pos[n.id]){ n.position = place(pos, n.id); n.positionAbsolute = place(pos, n.id); }\n  }\n\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  if(Object.keys(byId).length !== nodes.length) throw Err(\"ノードIDが重複しています\");\n\n  const edges = [];\n  const E = (src, handle, tgt) => edges.push(makeEdgeChat(byId, src, handle, tgt));\n  E(\"start\", \"source\", \"doc-extractor\");\n  E(\"doc-extractor\", \"source\", \"template-plain\");\n  E(\"template-plain\", \"source\", \"if-else-read\");\n  E(\"if-else-read\", \"case-need-read\", \"llm_read\");\n  E(\"llm_read\", \"source\", \"template-join-read\");\n  E(\"template-join-read\", \"source\", \"save-text-read\");\n  E(\"save-text-read\", \"source\", \"if-else-att\");\n  E(\"if-else-read\", \"false\", \"template-join\");\n  E(\"template-join\", \"source\", \"save-text\");\n  E(\"save-text\", \"source\", \"if-else-att\");\n  E(\"if-else-att\", \"true\", \"llm_summary\");\n  E(\"llm_summary\", \"source\", \"save-summary\");\n  E(\"save-summary\", \"source\", \"answer-confirm\");\n  E(\"if-else-att\", \"false\", \"llm_flow\");\n  E(\"llm_flow\", \"source\", \"if-else-q\");\n  E(\"if-else-q\", \"case-question\", \"answer-q\");\n  E(\"if-else-q\", \"false\", \"code_flow\");\n  E(\"code_flow\", \"source\", \"answer-final\");\n\n  const acct = accountListLines(root);\n  const app = clone(extras.app);\n  app.mode = \"advanced-chat\";\n  app.name = app.name + \"(チャット)\";\n  app.description = \"契約書(PDF・画像・テキスト)をアップロードすると、読み取った事実を表で確認したうえで、\"\n    + \"この契約で発生する一般的な会計仕訳の流れ(場面ごとの借方/貸方)を作成し、\"\n    + \"各行に勘定科目コードを機械的に付与するチャットフロー。\"\n    + \"科目名は分類ツリー由来のリスト(\" + acct.length + \"科目)で統制し、コードはLLMに触れさせず対応表から確定する。\"\n    + \"文字を取り出せないスキャンPDFや画像はAIが直接読み取る。情報が足りない場合はAIが質問し、\"\n    + \"回答すると確定するまで対話を継続する。\"\n    + \"このDSLはREADMEの分類ツリーから tools/generate_workflow.py で自動生成したもの。\";\n\n  const envs = [{\n    description: \"仕訳に使える勘定科目の一覧(分類ツリーの末端から自動生成。名前・分類上の位置・定義)。\"\n               + \"修正はツリー側が正で、ここでの編集は再生成までの応急対応。\",\n    id: \"env-account-list\",\n    name: \"account_list\",\n    value: acct.join(\"\\n\"),\n    value_type: \"string\"\n  }, {\n    description: \"科目名の別名対応表(1行に「別名=リストの科目名」。例: 預金=現金等)。\"\n               + \"AIが書いた一般名がコード未登録になったとき、ここに1行足すと次回から自動でコードが引ける。\",\n    id: \"env-account-aliases\",\n    name: \"account_aliases\",\n    value: \"\",\n    value_type: \"string\"\n  }, {\n    description: \"経路→勘定科目コードの対応表(ツリーの[7桁][3桁]から自動生成。1行=「経路,コード」。\"\n               + \"修正はツリー側が正で、ここでの編集は再生成までの応急対応)。\",\n    id: \"env-code-map\",\n    name: \"code_map\",\n    value: codeMapLines(root).join(\"\\n\"),\n    value_type: \"string\"\n  }, {\n    description: \"自社の会社名。仕訳を必ず自社の視点で書かせるために使う(契約書のどちらの当事者が自社かの特定に効く)。\",\n    id: \"env-company-name\",\n    name: \"company_name\",\n    value: \"\",\n    value_type: \"string\"\n  }, {\n    description: \"会社の会計方針・判定ルール(自由記述)。仕訳の判定で迷いやすい点をここに書き足すと次回から反映される(別名表のルール版)。\",\n    id: \"env-accounting-policy\",\n    name: \"accounting_policy\",\n    value: ACCOUNTING_POLICY_DEFAULT,\n    value_type: \"string\"\n  }];\n\n  const features = clone(extras.features);\n  features.opening_statement = extras.chat.opening_statement;\n\n  return {\n    app: app,\n    kind: \"app\",\n    version: \"0.3.0\",\n    workflow: {\n      conversation_variables: clone(extras.chat.conversation_variables),\n      environment_variables: envs,\n      features: features,\n      graph: {edges: edges, nodes: nodes, viewport: {x: 0, y: 0, zoom: 0.7}}\n    }\n  };\n}\n\n// ============================================================ オーケストレーション図\n// tools/render_canvas.py と同じ描き方をそのまま移植したもの(SVGを組み立てるだけ・通信なし)\nconst NODE_COLORS = {\n  \"start\": [\"#12b76a\", \"開始\"],\n  \"document-extractor\": [\"#667085\", \"テキスト抽出\"],\n  \"llm\": [\"#2970ff\", \"LLM\"],\n  \"if-else\": [\"#f79009\", \"条件分岐\"],\n  \"variable-aggregator\": [\"#7a5af8\", \"変数集約\"],\n  \"template-transform\": [\"#0e9384\", \"テンプレート\"],\n  \"assigner\": [\"#667085\", \"変数保存\"],\n  \"code\": [\"#fb6514\", \"コード実行\"],\n  \"answer\": [\"#f04438\", \"回答\"],\n  \"end\": [\"#f04438\", \"終了\"]\n};\n\nfunction srcPort(node, handle){\n  const x = node.position.x + (node.width || 244);\n  const y0 = node.position.y, h = node.height || 116;\n  if(node.data.type === \"if-else\"){\n    const cases = node.data.cases || [];\n    const slots = cases.length + 1;\n    let idx = cases.length;\n    if(handle !== \"false\"){\n      for(let i = 0; i < cases.length; i++) if(cases[i].case_id === handle){ idx = i; break; }\n    }\n    return [x, y0 + h * (idx + 1) / (slots + 1)];\n  }\n  return [x, y0 + h / 2];\n}\n\nfunction tgtPort(node){\n  return [node.position.x, node.position.y + (node.height || 116) / 2];\n}\n\nfunction xesc(s){\n  return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\")\n                  .replace(/\"/g, \"&quot;\");\n}\n\nfunction canvasSvg(nodes, edges, zoom){\n  const byId = {};\n  for(const n of nodes) byId[n.id] = n;\n  let w = 0, h = 0;\n  for(const n of nodes){\n    w = Math.max(w, n.position.x + (n.width || 244));\n    h = Math.max(h, n.position.y + (n.height || 116));\n  }\n  w += 100; h += 100;\n  const p = [];\n  p.push('<svg width=\"' + Math.round(w * zoom) + '\" height=\"' + Math.round(h * zoom)\n         + '\" viewBox=\"0 0 ' + w + \" \" + h + '\" xmlns=\"http://www.w3.org/2000/svg\">');\n  p.push('<rect width=\"' + w + '\" height=\"' + h + '\" fill=\"#f7f8fa\"/>');\n  for(const e of edges){\n    const s0 = byId[e.source], t0 = byId[e.target];\n    if(!s0 || !t0) continue;\n    const a = srcPort(s0, e.sourceHandle), b = tgtPort(t0);\n    const dx = Math.max(50, (b[0] - a[0]) * 0.5);\n    p.push('<path d=\"M ' + a[0].toFixed(0) + \" \" + a[1].toFixed(0)\n           + \" C \" + (a[0] + dx).toFixed(0) + \" \" + a[1].toFixed(0) + \", \"\n           + (b[0] - dx).toFixed(0) + \" \" + b[1].toFixed(0) + \", \"\n           + b[0].toFixed(0) + \" \" + b[1].toFixed(0)\n           + '\" fill=\"none\" stroke=\"rgba(52,64,84,0.5)\" stroke-width=\"1.6\"/>');\n    p.push('<circle cx=\"' + b[0].toFixed(0) + '\" cy=\"' + b[1].toFixed(0) + '\" r=\"3\" fill=\"#344054\"/>');\n  }\n  for(const n of nodes){\n    const x = n.position.x, y = n.position.y;\n    const wd = n.width || 244, ht = n.height || 116;\n    const c = NODE_COLORS[n.data.type] || [\"#667085\", n.data.type];\n    p.push('<g data-nid=\"' + xesc(n.id) + '\">');\n    p.push('<rect x=\"' + x + '\" y=\"' + y + '\" width=\"' + wd + '\" height=\"' + ht\n           + '\" rx=\"10\" fill=\"#ffffff\" stroke=\"#d0d5dd\" stroke-width=\"1.5\"/>');\n    p.push('<rect x=\"' + x + '\" y=\"' + y + '\" width=\"6\" height=\"' + ht + '\" rx=\"3\" fill=\"' + c[0] + '\"/>');\n    p.push('<text x=\"' + (x + 16) + '\" y=\"' + (y + 28) + '\" font-size=\"15\" font-weight=\"bold\" '\n           + 'fill=\"#101828\" font-family=\"sans-serif\">' + xesc(n.data.title || n.id) + \"<\/text>\");\n    p.push('<text x=\"' + (x + 16) + '\" y=\"' + (y + 50) + '\" font-size=\"12\" fill=\"' + c[0]\n           + '\" font-family=\"sans-serif\">' + xesc(c[1]) + \"<\/text>\");\n    if(n.data.type === \"if-else\"){\n      const cases = (n.data.cases || []).concat([null]);\n      for(const cse of cases){\n        const pt = srcPort(n, cse === null ? \"false\" : cse.case_id);\n        const label = cse === null ? \"ELSE\" : cse.conditions[0].value;\n        p.push('<circle cx=\"' + pt[0].toFixed(0) + '\" cy=\"' + pt[1].toFixed(0) + '\" r=\"3.5\" fill=\"#f79009\"/>');\n        p.push('<text x=\"' + (pt[0] - 8).toFixed(0) + '\" y=\"' + (pt[1] + 3).toFixed(0)\n               + '\" font-size=\"10\" fill=\"#98a2b3\" text-anchor=\"end\" font-family=\"sans-serif\">'\n               + xesc(label) + \"<\/text>\");\n      }\n    }\n    p.push(\"<\/g>\");\n  }\n  p.push(\"<\/svg>\");\n  return {svg: p.join(\"\"), w: w, h: h};\n}\n\n// ============================================================ 画面\nconst $ = id => document.getElementById(id);\nlet YAML = null, GRAPH = null, SVG_FULL = \"\", ZOOM = 0;\n\nfunction show(id, on){ $(id).classList.toggle(\"hide\", !on); }\nfunction esc(s){ return String(s).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\"); }\n\nfunction run(){\n  const text = $(\"tree\").value;\n  if(!text.trim()){\n    show(\"resultCard\", true); show(\"yamlCard\", false);\n    $(\"summary\").textContent = \"\";\n    $(\"checks\").innerHTML = '<div class=\"warn\">分類ツリーが入っていません。上の欄に貼り付けてください。<\/div>';\n    return;\n  }\n  const warnings = [];\n  const isChat = $(\"styleChat\").checked;\n  let d;\n  try{\n    d = (isChat ? generateChat : generate)(text, JSON.parse(EXTRAS_JSON), warnings);\n  }catch(e){\n    show(\"resultCard\", true); show(\"yamlCard\", false); show(\"canvasCard\", false);\n    $(\"summary\").textContent = \"\";\n    $(\"checks\").innerHTML = '<div class=\"warn\"><b>変換できませんでした<\/b><br>'\n      + esc(e.userFacing ? e.message : e.message).replace(/\\n/g, \"<br>\")\n      + \"<br><br>※ このメッセージをそのまま伝えず、内容をかみくだいて利用者に確認してください。<\/div>\";\n    YAML = null;\n    return;\n  }\n  // 全LLMノードに、選んだモデルを書き込む(Difyはモデルをノード単位で保存するため、\n  // ここで書き込んでおけばインポート後にノードを選び直す必要がない)\n  const mp = $(\"mProvider\").value.trim(), mn = $(\"mName\").value.trim();\n  let llmCount = 0;\n  for(const n of d.workflow.graph.nodes){\n    if(n.data && n.data.type === \"llm\" && n.data.model){\n      if(mp) n.data.model.provider = mp;\n      if(mn) n.data.model.name = mn;\n      llmCount++;\n    }\n  }\n  YAML = dumpYaml(d);\n  const g = d.workflow.graph;\n  const kinds = {};\n  for(const n of g.nodes) kinds[n.data.type] = (kinds[n.data.type] || 0) + 1;\n  const parts = Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a]).map(k => k + \" \" + kinds[k]);\n  show(\"resultCard\", true);\n  $(\"summary\").textContent =\n    \"■ 変換しました\\n  ノード \" + g.nodes.length + \"個 / エッジ \" + g.edges.length\n    + \"個 / 環境変数 \" + d.workflow.environment_variables.length + \"個\\n  内訳: \" + parts.join(\" / \")\n    + \"\\n  形式: \" + (isChat ? \"チャット形式(advanced-chat。契約書はチャットに添付)\" : \"フォーム形式(workflow。入力欄に入れて実行)\")\n    + (isChat ? \"\\n  ※ インポート後、右上の {x}変数 → 会話変数 に contract_text / contract_summary の2つが\\n     入っているか確認してください。無ければ String型・デフォルト空で手動追加 → 公開\\n     (Difyのインポートで変数が取り込まれないことがまれにあります)\" : \"\")\n    + \"\\n  AIモデル: \" + llmCount + \"個のノードすべてに \"\n    + ((mp || \"(変更なし)\") + \" / \" + (mn || \"(変更なし)\")) + \" を設定しました\";\n  $(\"checks\").innerHTML = warnings.length\n    ? '<div class=\"warn\"><b>確認してほしいこと<\/b><ul>'\n      + warnings.map(w => \"<li>\" + esc(w) + \"<\/li>\").join(\"\") + \"<\/ul><\/div>\"\n    : '<div class=\"ok\">構造チェックで問題は見つかりませんでした。<\/div>';\n  $(\"yaml\").textContent = YAML;\n  show(\"yamlCard\", true);\n  GRAPH = g;\n  ZOOM = 0;\n  drawCanvas(true);\n  show(\"canvasCard\", true);\n}\n\nfunction expTarget(nid){\n  if(nid === \"start\") return \"exp-start\";\n  if(nid === \"doc-extractor\" || nid === \"template-plain\" || nid === \"template-join\" || nid === \"template-join-read\"\n     || nid === \"save-text\" || nid === \"save-text-read\") return \"exp-extract\";\n  if(nid === \"llm_read\" || nid === \"if-else-read\" || nid === \"aggregator_text\" || nid === \"if-else-text\" || nid === \"template-scan\") return \"exp-vision\";\n  if(nid === \"llm_summary\" || nid === \"save-summary\") return \"exp-summary\";\n  if(nid === \"if-else-confirm\" || nid === \"template-confirm\" || nid === \"if-else-att\" || nid === \"answer-confirm\") return \"exp-confirm\";\n  if(nid === \"aggregator-out\" || nid === \"end\" || nid === \"answer-final\") return \"exp-end\";\n  if(nid === \"aggregator\" || nid.indexOf(\"aggregator-\") === 0) return \"exp-agg\";\n  if(nid === \"template_path\") return \"exp-path\";\n  if(nid === \"template_code\" || nid === \"code_flow\") return \"exp-code\";\n  if(nid === \"if-else-q\" || nid === \"answer-q\") return \"exp-qcheck\";\n  if(nid === \"llm_journal\" || nid === \"llm_flow\") return \"exp-journal\";\n  return \"exp-tree\";\n}\n\nlet EXP_TIMER = null;\n$(\"canvas\").addEventListener(\"click\", e => {\n  let g = e.target;\n  while(g && g !== e.currentTarget && !(g.getAttribute && g.getAttribute(\"data-nid\"))) g = g.parentNode;\n  if(!g || g === e.currentTarget) return;\n  const nid = g.getAttribute(\"data-nid\");\n  // 選択中のノードを枠線で示す\n  for(const other of $(\"canvas\").querySelectorAll(\"g[data-nid] > rect:first-of-type\")){\n    other.setAttribute(\"stroke\", \"#d0d5dd\");\n    other.setAttribute(\"stroke-width\", \"1.5\");\n  }\n  const rect = g.querySelector(\"rect\");\n  if(rect){ rect.setAttribute(\"stroke\", \"#2f6fed\"); rect.setAttribute(\"stroke-width\", \"3\"); }\n  // 解説の該当項目へスクロールしてハイライト\n  const target = document.getElementById(expTarget(nid));\n  if(!target) return;\n  // 全画面のままだと解説(図の外)が見えないので、いったん全画面を抜ける\n  if(inFull()) exitFull();\n  for(const el of document.querySelectorAll(\".exp-hit\")) el.classList.remove(\"exp-hit\");\n  target.classList.add(\"exp-hit\");\n  target.scrollIntoView({behavior: \"smooth\", block: \"center\"});\n  if(EXP_TIMER) clearTimeout(EXP_TIMER);\n  EXP_TIMER = setTimeout(() => target.classList.remove(\"exp-hit\"), 4000);\n});\n\nfunction drawCanvas(fit){\n  if(!GRAPH) return;\n  const box = $(\"canvas\").clientWidth || 900;\n  const probe = canvasSvg(GRAPH.nodes, GRAPH.edges, 1);\n  if(fit) ZOOM = Math.max(0.06, Math.min(1, (box - 24) / probe.w));\n  const r = canvasSvg(GRAPH.nodes, GRAPH.edges, ZOOM);\n  $(\"canvas\").innerHTML = r.svg;\n  SVG_FULL = canvasSvg(GRAPH.nodes, GRAPH.edges, 1).svg;\n  $(\"canvasInfo\").textContent = \"ノード \" + GRAPH.nodes.length + \"個 / 表示倍率 \"\n                              + Math.round(ZOOM * 100) + \"%(\" + r.w + \" x \" + r.h + \")\";\n}\n\nfunction save(text, name){\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([text], {type: \"text/yaml;charset=utf-8\"}));\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n}\n\nfunction copy(text, btn){\n  const ta = document.createElement(\"textarea\");\n  ta.value = text;\n  document.body.appendChild(ta);\n  ta.select();\n  try{ document.execCommand(\"copy\"); }catch(e){}\n  document.body.removeChild(ta);\n  const old = btn.textContent;\n  btn.textContent = \"コピーしました\";\n  setTimeout(() => { btn.textContent = old; }, 1200);\n}\n\nasync function load(file){\n  $(\"tree\").value = await file.text();\n  $(\"drop\").querySelector(\"b\").textContent = file.name;\n}\n\n$(\"drop\").onclick = () => $(\"file\").click();\n$(\"file\").onchange = e => { if(e.target.files[0]) load(e.target.files[0]); };\n$(\"drop\").ondragover = e => { e.preventDefault(); $(\"drop\").classList.add(\"hot\"); };\n$(\"drop\").ondragleave = () => $(\"drop\").classList.remove(\"hot\");\n$(\"drop\").ondrop = e => {\n  e.preventDefault();\n  $(\"drop\").classList.remove(\"hot\");\n  if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);\n};\n$(\"run\").onclick = run;\n$(\"sample\").onclick = () => {\n  $(\"tree\").value = SAMPLE_TREE;\n  $(\"drop\").querySelector(\"b\").textContent = \"サンプル(一般的な勘定科目・約200行)\";\n};\n$(\"clear\").onclick = () => {\n  $(\"tree\").value = \"\";\n  show(\"resultCard\", false);\n  show(\"yamlCard\", false);\n  show(\"canvasCard\", false);\n};\n$(\"zoomIn\").onclick = () => { ZOOM = Math.min(2, ZOOM * 1.4); drawCanvas(false); };\n$(\"zoomOut\").onclick = () => { ZOOM = Math.max(0.04, ZOOM / 1.4); drawCanvas(false); };\n$(\"zoomFit\").onclick = () => drawCanvas(true);\n\n// ---- 全画面表示(抜けるのは Esc か、もう一度ボタンを押す)\n// まとめ版ではこのページがiframeの中に入っている。その場合はiframe自体を全画面にし、\n// そのうえでカードを画面いっぱいに広げる(要素だけを全画面にすると、\n// iframeの大きさに引きずられて画面いっぱいにならないため)。\nfunction frameEl(){\n  try{ return window.frameElement || null; }catch(e){ return null; }\n}\nfunction ownerDoc(){\n  try{ return frameEl() ? window.parent.document : document; }catch(e){ return document; }\n}\nfunction inFull(){\n  if($(\"canvasCard\").classList.contains(\"pseudo-full\")) return true;\n  try{ return !!(ownerDoc().fullscreenElement || ownerDoc().webkitFullscreenElement); }\n  catch(e){ return false; }\n}\nfunction syncFullBtn(){\n  $(\"fullscreen\").textContent = inFull() ? \"全画面をやめる\" : \"全画面表示\";\n  drawCanvas(true);            // 表示領域が変わるので倍率を合わせ直す\n}\nfunction enterFull(){\n  const card = $(\"canvasCard\");\n  const target = frameEl() || card;\n  const req = target.requestFullscreen || target.webkitRequestFullscreen;\n  const spread = () => { if(frameEl()) card.classList.add(\"pseudo-full\"); syncFullBtn(); };\n  if(!req){ card.classList.add(\"pseudo-full\"); syncFullBtn(); return; }\n  try{\n    Promise.resolve(req.call(target)).then(spread).catch(function(){\n      // 全画面が許可されていない場合は、ページ内で目いっぱい広げる\n      card.classList.add(\"pseudo-full\");\n      syncFullBtn();\n    });\n  }catch(e){\n    card.classList.add(\"pseudo-full\");\n    syncFullBtn();\n  }\n}\nfunction exitFull(){\n  $(\"canvasCard\").classList.remove(\"pseudo-full\");\n  try{\n    const d = ownerDoc();\n    if(d.fullscreenElement || d.webkitFullscreenElement){\n      (d.exitFullscreen || d.webkitExitFullscreen).call(d);\n    }\n  }catch(e){}\n  syncFullBtn();\n}\n$(\"fullscreen\").onclick = () => { inFull() ? exitFull() : enterFull(); };\n\n// Esc で抜けたときにボタンの表示と倍率を合わせ直す\nfunction onFullChange(){\n  try{\n    const d = ownerDoc();\n    if(!(d.fullscreenElement || d.webkitFullscreenElement)){\n      $(\"canvasCard\").classList.remove(\"pseudo-full\");\n    }\n  }catch(e){}\n  syncFullBtn();\n}\ndocument.addEventListener(\"fullscreenchange\", onFullChange);\ndocument.addEventListener(\"webkitfullscreenchange\", onFullChange);\ntry{\n  if(frameEl()){\n    window.parent.document.addEventListener(\"fullscreenchange\", onFullChange);\n    window.parent.document.addEventListener(\"webkitfullscreenchange\", onFullChange);\n  }\n}catch(e){}\n// 全画面が使えず擬似全画面になっている場合も Esc で抜けられるようにする\ndocument.addEventListener(\"keydown\", e => {\n  if(e.key === \"Escape\" && $(\"canvasCard\").classList.contains(\"pseudo-full\")) exitFull();\n});\n$(\"dlsvg\").onclick = () => {\n  if(!SVG_FULL) return;\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(new Blob([SVG_FULL], {type: \"image/svg+xml;charset=utf-8\"}));\n  a.download = \"orchestration.svg\";\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n};\n$(\"dl\").onclick = () => YAML && save(YAML, $(\"styleChat\").checked ? \"contract-account-classification-chat.yml\" : \"contract-account-classification.yml\");\n$(\"cp\").onclick = e => YAML && copy(YAML, e.target);\n<\/script>\n"}];
var ABOUT_TEXT = "【契約書から勘定科目を判定する仕組み(3つのツール)】\n\n■ 何のためのものか\n契約書を読んで、その契約の主たる勘定科目(10桁コード)を判定するAIワークフローを\nDify上に作ります。上7桁が全社共通、下3桁が会社別です。\nこの3つのツールは、そのワークフローの「設計図」を作り、検査するためのものです。\n\n■ 全体の流れ(1→2→3)\n\n1. Excel → 分類ツリー\n   勘定科目マスタ(Excel)を読み込み、区分1/区分2/明細の階層から\n   判定用の「分類ツリー」を自動生成します。勘定科目コードもツリーに埋め込むので、\n   コードはAIに推測させず、経路から機械的に確定します。\n\n2. ツリーの検査(AIは判断だけ、編集は機械)\n   科目が正しい親の下に置かれているかを、AIに1科目ずつ確認させます。\n   AIに出させるのは「昇格(1階層上げる)」の指示リストだけで、\n   ツリーの書き換えはこのプログラムが機械的に行います。\n   → AIの書き間違いでコードや科目が消えることが、原理的に起きません。\n   適用後はコードの全数照合(欠け・増え0件、コードと科目名の対応)を毎回自動で行います。\n\n3. ツリー → Dify DSL\n   完成したツリーから、Difyにそのまま取り込めるワークフロー定義(YAML)を生成します。\n   Difyでの見え方(オーケストレーション図)もその場で確認できます。\n\n■ なぜ「段階判定」なのか\n数百ある科目から一度に選ばせると精度が出ないため、上の段から選択肢を絞って\n下りていく形にしています。一度選ぶと後戻りしないので、\n「科目が正しい親の下にあるか」を検査する2番目のツールが要になります。\n\n■ 実行環境とセキュリティ\n・ブラウザで開くだけの1ファイルHTMLです(インストール不要・管理者権限不要)\n・処理はすべてブラウザの中だけで行われ、読み込んだファイルはどこにも送信されません\n  外部と通信するコードは0件で、ネットワークを切断した状態でも全機能が動きます\n・同じ処理をSnowflakeのノートブックでも実行できます(社内で完結させたい場合)\n\n■ 現状\n仕組みは完成しています。実際の勘定科目コードを入れれば、そのまま動きます。\n";
var nav = document.getElementById("nav");
var main = document.getElementById("main");
var step = document.getElementById("step");
var panes = [], cur = -1;

function select(i){
  if(cur === i) return;
  cur = i;
  for(var k = 0; k < panes.length; k++){
    if(panes[k]) panes[k].classList.toggle("hide", k !== i);
    nav.children[k].classList.toggle("on", k === i);
  }
  if(!panes[i]){
    var t = TOOLS[i];
    var f = document.createElement("iframe");
    f.setAttribute("title", t.name);
    f.setAttribute("allow", "fullscreen");   // ③の図の全画面表示に必要
    panes[i] = f;
    main.appendChild(f);
    f.srcdoc = t.html;
    for(var k2 = 0; k2 < panes.length; k2++) if(panes[k2]) panes[k2].classList.toggle("hide", k2 !== i);
  }
  step.textContent = TOOLS[i].hint;
}

for(var i = 0; i < TOOLS.length; i++){
  panes.push(null);
  var b = document.createElement("button");
  b.textContent = TOOLS[i].name;
  b.onclick = (function(n){ return function(){ select(n); }; })(i);
  nav.appendChild(b);
}
select(0);

document.getElementById("aboutClose").onclick = function(){ aboutPanel.classList.add("hide"); };
aboutPanel.onclick = function(e){ if(e.target === aboutPanel) aboutPanel.classList.add("hide"); };
document.getElementById("aboutCopy").onclick = function(){
  var btn = this;
  var ta = document.createElement("textarea");
  ta.value = ABOUT_TEXT;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  btn.textContent = "コピーしました";
  setTimeout(function(){ btn.textContent = "説明文をコピーする"; }, 1400);
};
</script>
